# Un dd d'un poste Linux DÉJÀ MONTÉ en lecture seule.
#
# Le montage est votre geste, pas celui du script : c'est vous qui décidez
# ce qui est monté, où, quand et avec quelles options. Toute la séquence :
#
#   fdisk -l /images/PC07.dd          # la colonne Start de la partition
#   mkdir -p /votre/point
#   mount -o ro,noatime,noexec,nodev,loop,offset=$((2048*512)) \
#         /images/PC07.dd /votre/point
#   sudo ./tasker.sh -c exemples/dd-linux-monte.conf --set MONTAGE=/votre/point
#   umount /votre/point               # quand vous avez fini
#
#   ro       rien ne peut être écrit sur la pièce à conviction
#   noatime  la lire ne change pas ses dates — mac-robber les relève après
#   noexec,nodev  rien ne s'exécute depuis un disque suspect
#   offset   la colonne Start de fdisk, en secteurs, × 512 = octets
#
# La même analyse que exemples/dd-linux.conf, par l'autre voie :
#   + les fichiers se lisent avec cat, cp, grep, et les listes toutes
#     faites du script marchent avec leurs jokers — rien à découper
#   − les fichiers SUPPRIMÉS et l'espace libre restent invisibles : pour
#     eux il faut fls, ils et icat, donc dd-linux.conf
#
# Tout ce qui est écrit va dans ANALYSE/OS/SALLE/PREFIX/ :
#     SYSTEME/    PREFIX_hostname.txt  PREFIX_timezone.txt  PREFIX_localtime.txt
#     BASHRC/     PREFIX_carole_.bashrc.txt  PREFIX_dave_.bashrc.txt  …
#     TIMELINE/   PREFIX_body.mactime  PREFIX_mactime.csv
#     JOURNAUX/   les fichiers de /var/log, copiés tels quels
#     PHOTOREC/   recup_*/
# Le journal, le rapport, l'état de reprise et le journal photorec vont
# dans le répertoire d'où le script est lancé, préfixés par PREFIX.

# --- variables ---------------------------------------------------------
MONTAGE=""                     # À FOURNIR : --set MONTAGE=/votre/point
IMAGE="/images/PC07.dd"        # le dd lui-même, pour testdisk et photorec
PC="PC07"                      # nom du poste
SALLE="D32"                    # salle
PROJET="PRJ"                   # projet
OS="LINUX"                     # système du poste
ANALYSE="$PWD/ANALYSE"         # racine de sortie
TZ_MACTIME="UTC"               # fuseau de la timeline
TK_OPERATEUR="${SUDO_USER:-${USER:-inconnu}}"
TK_REQUIS=(findmnt strings mac-robber mactime testdisk photorec)

# --- chemins et contrôles ----------------------------------------------
calculer_variables() {
    TK_PREFIX="${PC}_${SALLE}_${PROJET}_${OS}"
    DEST="$ANALYSE/$OS/$SALLE/$TK_PREFIX"
    TK_SUJET="$PC · $SALLE · $PROJET · $OS"
    TK_DETAILS=("montage=$MONTAGE" "image=$IMAGE" "sortie=$DEST" "fuseau=$TZ_MACTIME")
    DIR_SYSTEME="$DEST/SYSTEME"
    DIR_BASHRC="$DEST/BASHRC"
    DIR_TIMELINE="$DEST/TIMELINE"
    DIR_JOURNAUX="$DEST/JOURNAUX"
    DIR_PHOTOREC="$DEST/PHOTOREC"
    DIR_LOGS="$PWD"             # journal, rapport, état : là où le script est lancé
}

verifier() {
    local opts
    [[ -n "$MONTAGE" ]] || { erreur "MONTAGE n'est pas renseigné : le script ne choisit pas où l'image est montée."
        info "donnez-le : --set MONTAGE=/votre/point   (la séquence complète est en tête de ce fichier)"
        return 1; }
    opts="$(findmnt -no OPTIONS "$MONTAGE" 2>/dev/null)" || {
        erreur "rien n'est monté sur $MONTAGE"
        info "montez l'image d'abord (la commande est en tête de ce fichier),"
        info "ou prenez exemples/dd-linux.conf : il lit l'image sans la monter."
        return 1; }
    # Une pièce à conviction montée en écriture s'abîme au premier accès.
    [[ ",$opts," == *",ro,"* ]] || { erreur "$MONTAGE n'est pas monté en lecture seule : $opts"
        info "remontez-le : umount '$MONTAGE' puis mount -o ro,noatime,noexec,nodev,…"
        return 1; }
    [[ -d "$MONTAGE/etc" ]] || attention "pas de $MONTAGE/etc : la racine du système est-elle bien là ?"
    [[ -r "$IMAGE" ]] || { erreur "image illisible : $IMAGE"
        info "les deux dernières étapes en ont besoin ; réglez IMAGE ou : --set IMAGE=/chemin.dd"
        return 1; }
    return 0
}

# --- commandes ---------------------------------------------------------
# [[partition]] : le numéro affiché par testdisk. Demandé à la dernière étape.
# photorec rend TOUJOURS 0, et si le numéro de partition n'existe pas il
# retombe silencieusement sur le disque entier. Son code de sortie ne dit
# donc rien : ce sont les fichiers listés en fin d'étape et le journal
# photorec qu'il faut lire pour savoir ce qui a réellement été récupéré.
# mac-robber tourne DANS le montage, entre parenthèses : les chemins de la
# timeline sont alors « ./etc/passwd » et non « VOTRE_POINT/etc/passwd » —
# comparables d'un cas à l'autre. Les parenthèses font un sous-shell : le
# cd n'y survit pas, alors qu'un cd dans une étape vaut jusqu'à la fin.
definir_commandes() {
TK_COMMANDES=(
"Ce qui est monté|false,log|findmnt -no SOURCE,TARGET,FSTYPE,OPTIONS '$MONTAGE'"
"Nom de la machine|true,continu|cat '$MONTAGE/etc/hostname' | tee '$DIR_SYSTEME/${TK_PREFIX}_hostname.txt'"
"Fuseau horaire (/etc/timezone)|true,continu|cat '$MONTAGE/etc/timezone' | tee '$DIR_SYSTEME/${TK_PREFIX}_timezone.txt'"
"Fuseau horaire (/etc/localtime)|true,continu|{ readlink '$MONTAGE/etc/localtime' || strings '$MONTAGE/etc/localtime' | tail -n 1; } | tee '$DIR_SYSTEME/${TK_PREFIX}_localtime.txt'"
"Le .bashrc de chaque compte|true,continu|cat '{{bashrc}}' | tee '$DIR_BASHRC/${TK_PREFIX}_{{compte_libelle}}_{{bashrc_libelle}}.txt'"
"Journaux de /var/log, copiés tels quels|true|cp -a '$MONTAGE/var/log/.' '$DIR_JOURNAUX/' && ls -l '$DIR_JOURNAUX' | tail -n 10"
"Corps de la timeline (mac-robber)|true|( cd '$MONTAGE' && mac-robber . ) | tee '$DIR_TIMELINE/${TK_PREFIX}_body.mactime' | tail -n 10"
"Timeline mactime|true|mactime -b '$DIR_TIMELINE/${TK_PREFIX}_body.mactime' -d -z '$TZ_MACTIME' | tee '$DIR_TIMELINE/${TK_PREFIX}_mactime.csv' | tail -n 10"
"Partitions pour photorec (testdisk)|false,log|testdisk /list '$IMAGE'"
"photorec sur la partition [[partition]]|true,ecran|photorec /log /logname '$DIR_LOGS/${TK_PREFIX}_photorec.log' /d '$DIR_PHOTOREC/recup_' /cmd '$IMAGE' '[[partition]]',fileopt,everything,enable,freespace,search && ls -lR '$DIR_PHOTOREC' | tail -n 20"
)
# Voilà ce que le montage apporte : pas une fonction à écrire. Ce sont les
# listes toutes faites du script, avec un joker — '.bash*' prendrait aussi
# .bash_history, '*' tout le profil. Un compte sans .bashrc ne produit
# aucune itération, ce n'est pas une erreur.
TK_LISTES=(
"compte|lister_dossiers '$MONTAGE/home'"
"bashrc|lister_fichiers '{{compte}}' '.bashrc'"
)
}
