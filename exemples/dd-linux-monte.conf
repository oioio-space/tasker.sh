# Un dd d'un poste Linux, MONTÉ en lecture seule.
#     sudo ./tasker.sh -c exemples/dd-linux-monte.conf
#
# La même analyse que exemples/dd-linux.conf, par l'autre voie. Ce qui
# change, une fois l'image montée :
#   + les fichiers se lisent avec cat, cp, grep, et les listes toutes
#     faites du script marchent avec leurs jokers — rien à découper
#   − les fichiers SUPPRIMÉS et l'espace libre restent invisibles : pour
#     eux il faut fls, ils et icat, donc dd-linux.conf
#   − il faut être root, et l'image est montée pendant l'analyse
#
# Le montage est fait à l'étape 2, défait à l'étape 10. Si vous quittez
# avant — « q », Ctrl-C, kill — nettoyer() démonte quand même : le script
# l'appelle en sortant, quelle que soit la sortie.
#
# Tout ce qui est écrit va dans ANALYSE/OS/SALLE/PREFIX/ :
#     SYSTEME/    PREFIX_hostname.txt  PREFIX_timezone.txt  PREFIX_localtime.txt
#     BASHRC/     PREFIX_carole_.bashrc.txt  PREFIX_dave_.bashrc.txt  …
#     TIMELINE/   PREFIX_body.mactime  PREFIX_mactime.csv
#     JOURNAUX/   les fichiers de /var/log, copiés tels quels
#     PHOTOREC/   recup_*/
# Le journal, le rapport, l'état de reprise et le journal photorec vont
# dans le répertoire d'où le script est lancé, préfixés par PREFIX.

# --- variables ---------------------------------------------------------
IMAGE="/images/PC07.dd"        # le dd à analyser
PC="PC07"                      # nom du poste
SALLE="D32"                    # salle
PROJET="PRJ"                   # projet
OS="LINUX"                     # système du poste
ANALYSE="$PWD/ANALYSE"         # racine de sortie
MONTAGE="/mnt/tasker"          # où l'image est montée, le temps de l'analyse
TZ_MACTIME="UTC"               # fuseau de la timeline
TK_OPERATEUR="${SUDO_USER:-${USER:-inconnu}}"
TK_REQUIS=(fdisk mount umount mountpoint findmnt mac-robber mactime testdisk photorec)

# --- chemins et contrôles ----------------------------------------------
calculer_variables() {
    TK_PREFIX="${PC}_${SALLE}_${PROJET}_${OS}"
    DEST="$ANALYSE/$OS/$SALLE/$TK_PREFIX"
    TK_SUJET="$PC · $SALLE · $PROJET · $OS"
    TK_DETAILS=("image=$IMAGE" "sortie=$DEST" "montage=$MONTAGE" "fuseau=$TZ_MACTIME")
    TK_DIR_SYSTEME="$DEST/SYSTEME"
    TK_DIR_BASHRC="$DEST/BASHRC"
    TK_DIR_TIMELINE="$DEST/TIMELINE"
    TK_DIR_JOURNAUX="$DEST/JOURNAUX"
    TK_DIR_PHOTOREC="$DEST/PHOTOREC"
    TK_DIR_LOGS="$PWD"             # journal, rapport, état : là où le script est lancé
}

verifier() {
    [[ -e "$IMAGE" ]] || { erreur "image absente : $IMAGE"
        info "réglez IMAGE dans ce fichier, ou : --set IMAGE=/chemin.dd"
        return 1; }
    [[ -r "$IMAGE" ]] || { erreur "image illisible : $IMAGE"; return 1; }
    (( EUID == 0 )) || { erreur "monter une image demande les droits root."
        info "relancez avec sudo, ou prenez exemples/dd-linux.conf : il lit l'image sans la monter."
        return 1; }
    mountpoint -q "$MONTAGE" 2>/dev/null && { erreur "$MONTAGE est déjà un point de montage."
        info "démontez-le (umount '$MONTAGE') ou changez MONTAGE dans ce fichier."
        return 1; }
    return 0
}

# Appelée en sortant, quelle que soit la sortie. Elle teste avant d'agir :
# elle est aussi appelée quand rien n'a été monté.
nettoyer() {
    mountpoint -q "$MONTAGE" 2>/dev/null || return 0
    umount "$MONTAGE" 2>/dev/null \
        && attention "image démontée en sortant : $MONTAGE" \
        || erreur "$MONTAGE est resté monté — démontez-le : umount '$MONTAGE'"
    return 0
}

# --- commandes ---------------------------------------------------------
# mac-robber tourne DANS le montage, entre parenthèses : les chemins de la
# timeline sont alors « ./etc/passwd » et non « /mnt/tasker/etc/passwd » —
# comparables d'un cas à l'autre. Les parenthèses font un sous-shell : le
# cd n'y survit pas, alors qu'un cd dans une étape vaut jusqu'à la fin.
#
# [[offset]]    : en secteurs, la colonne Start de fdisk. Demandé à l'étape 2.
# [[partition]] : le numéro affiché par testdisk. Demandé à la dernière étape.
# L'étape 2 est marquée « stop » : sans montage, tout le reste est vide.
definir_commandes() {
TK_COMMANDES=(
"Partitions du dd (fdisk)|false,log|fdisk -l '$IMAGE'"
"Monter la partition à l'offset [[offset]], en lecture seule|true,stop|monter '[[offset]]'"
"Nom de la machine|true,continu|cat '$MONTAGE/etc/hostname' | tee '$TK_DIR_SYSTEME/${TK_PREFIX}_hostname.txt'"
"Fuseau horaire (/etc/timezone)|true,continu|cat '$MONTAGE/etc/timezone' | tee '$TK_DIR_SYSTEME/${TK_PREFIX}_timezone.txt'"
"Fuseau horaire (/etc/localtime)|true,continu|{ readlink '$MONTAGE/etc/localtime' || strings '$MONTAGE/etc/localtime' | tail -n 1; } | tee '$TK_DIR_SYSTEME/${TK_PREFIX}_localtime.txt'"
"Le .bashrc de chaque compte|true,continu|cat '{{bashrc}}' | tee '$TK_DIR_BASHRC/${TK_PREFIX}_{{compte_libelle}}_{{bashrc_libelle}}.txt'"
"Journaux de /var/log, copiés tels quels|true|cp -a '$MONTAGE/var/log/.' '$TK_DIR_JOURNAUX/' && ls -l '$TK_DIR_JOURNAUX' | tail -n 10"
"Corps de la timeline (mac-robber)|true|( cd '$MONTAGE' && mac-robber . ) | tee '$TK_DIR_TIMELINE/${TK_PREFIX}_body.mactime' | tail -n 10"
"Timeline mactime|true|mactime -b '$TK_DIR_TIMELINE/${TK_PREFIX}_body.mactime' -d -z '$TZ_MACTIME' | tee '$TK_DIR_TIMELINE/${TK_PREFIX}_mactime.csv' | tail -n 10"
"Démonter l'image|true|demonter"
"Partitions pour photorec (testdisk)|false,log|testdisk /list '$IMAGE'"
"photorec sur la partition [[partition]]|true|photorec /log /logname '$TK_DIR_LOGS/${TK_PREFIX}_photorec.log' /d '$TK_DIR_PHOTOREC/recup_' /cmd '$IMAGE' '[[partition]]',fileopt,everything,enable,freespace,search"
)
# Voilà ce que le montage apporte : plus une fonction à écrire. Ce sont
# les listes toutes faites du script, avec un joker — '.bash*' prendrait
# aussi .bash_history, '*' tout le profil. Un compte sans .bashrc ne
# produit aucune itération, ce n'est pas une erreur.
TK_LISTES=(
"compte|lister_dossiers '$MONTAGE/home'"
"bashrc|lister_fichiers '{{compte}}' '.bashrc'"
)
}

# --- fonctions -----------------------------------------------------------
# monter <offset en secteurs> : l'offset vient de la colonne Start de
# fdisk, mount attend des octets. La valeur entre dans un calcul : on
# exige un entier avant de calculer, jamais l'inverse.
monter() {
    local off="$1"
    [[ "$off" =~ ^[0-9]+$ ]] || { erreur "offset : un nombre de secteurs attendu, reçu « $off »"; return 1; }
    mkdir -p "$MONTAGE" || return 1
    # ro       rien ne peut être écrit sur la pièce à conviction
    # noatime  la lire ne change pas ses dates — mac-robber les relève juste après
    # noexec,nodev  rien ne s'exécute depuis un disque suspect
    mount -o ro,noatime,noexec,nodev,loop,offset=$(( 10#$off * 512 )) "$IMAGE" "$MONTAGE" || return 1
    findmnt -no SOURCE,TARGET,FSTYPE,OPTIONS "$MONTAGE"
}

demonter() {
    mountpoint -q "$MONTAGE" 2>/dev/null || { info "rien de monté sur $MONTAGE"; return 0; }
    umount "$MONTAGE" || { erreur "démontage impossible — un shell ouvert dans $MONTAGE ?"; return 1; }
    info "$MONTAGE démonté"
    return 0
}
