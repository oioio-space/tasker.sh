# Un dd d'un poste Linux : identité, comptes, timeline, journaux, carving.
#     ./tasker.sh -c exemples/dd-linux.conf
#
# Même organisation que dd-windows.conf : fdisk affiche les partitions,
# on tape l'offset ; testdisk les affiche à sa façon, on tape le numéro
# pour photorec. Les comptes, eux, sont une liste : le script lit /home
# sur l'image et rejoue l'étape des .bashrc pour chacun.
#
# Tout ce qui est écrit va dans ANALYSE/OS/SALLE/PREFIX/ :
#     SYSTEME/           PREFIX_hostname.txt  PREFIX_timezone.txt  PREFIX_localtime.txt
#     BASHRC/            PREFIX_carole_.bashrc.txt  PREFIX_dave_.bashrc.txt  …
#     ILS_FLS_MACTIME/   PREFIX.fls  PREFIX.ils  PREFIX_body.mactime  PREFIX_mactime.csv
#     JOURNAUX/          les fichiers de /var/log, tels quels
#     PHOTOREC/          recup_*/
# Le journal, le rapport, l'état de reprise et le journal photorec vont
# dans le répertoire d'où le script est lancé, préfixés par PREFIX.

# --- variables ---------------------------------------------------------
IMAGE="/images/PC07.dd"        # le dd à analyser
PC="PC07"                      # nom du poste
SALLE="D32"                    # salle
PROJET="PRJ"                   # projet
OS="LINUX"                     # système du poste
ANALYSE="$PWD/ANALYSE"         # racine de sortie
TZ_MACTIME="UTC"               # fuseau de la timeline
TK_OPERATEUR="${SUDO_USER:-${USER:-inconnu}}"
TK_REQUIS=(fdisk fls ils icat fcat ifind istat tsk_recover mactime testdisk photorec)

# --- chemins et contrôles ----------------------------------------------
calculer_variables() {
    TK_PREFIX="${PC}_${SALLE}_${PROJET}_${OS}"
    DEST="$ANALYSE/$OS/$SALLE/$TK_PREFIX"
    TK_SUJET="$PC · $SALLE · $PROJET · $OS"
    TK_DETAILS=("image=$IMAGE" "sortie=$DEST" "fuseau=$TZ_MACTIME")
    DIR_SYSTEME="$DEST/SYSTEME"
    DIR_BASHRC="$DEST/BASHRC"
    DIR_FLS="$DEST/ILS_FLS_MACTIME"
    DIR_JOURNAUX="$DEST/JOURNAUX"
    DIR_PHOTOREC="$DEST/PHOTOREC"
    DIR_LOGS="$PWD"             # journal, rapport, état : là où le script est lancé
}

verifier() {
    [[ -e "$IMAGE" ]] || { erreur "image absente : $IMAGE"
        info "réglez IMAGE dans ce fichier, ou : --set IMAGE=/chemin.dd"
        return 1; }
    [[ -r "$IMAGE" ]] || { erreur "image illisible : $IMAGE"; return 1; }
    return 0
}

# --- commandes ---------------------------------------------------------
# [[offset]]    : en secteurs, la colonne Start de fdisk. Demandé à l'étape 2,
#                 réutilisé partout ensuite.
# [[partition]] : le numéro affiché par testdisk. Demandé à la dernière étape.
# photorec rend TOUJOURS 0, et si le numéro de partition n'existe pas il
# retombe silencieusement sur le disque entier. Son code de sortie ne dit
# donc rien : ce sont les fichiers listés en fin d'étape et le journal
# photorec qu'il faut lire pour savoir ce qui a réellement été récupéré.
# fcat lit un fichier par son chemin sur l'image, sans le monter. Les
# étapes « continu » ne cassent rien si le fichier n'existe pas : tous
# les Linux n'ont pas /etc/timezone, tous les comptes n'ont pas de .bashrc.
#
# /etc/localtime est un LIEN sur la plupart des Linux, et fcat sur un lien
# ne rend que des octets nuls : sa cible est dans l'inode, pas dans des
# blocs de données. C'est istat qui la montre — « symbolic link to: … » —
# et il donne les dates au passage. Si le fichier est une vraie copie du
# fuseau, sa règle se lit par : fcat … etc/localtime | strings | tail -n 1
definir_commandes() {
TK_COMMANDES=(
"Partitions du dd (fdisk)|false,log|fdisk -l '$IMAGE'"
"Nom de la machine, partition à l'offset [[offset]]|true,continu|fcat -o '[[offset]]' etc/hostname '$IMAGE' | tee '$DIR_SYSTEME/${TK_PREFIX}_hostname.txt'"
"Fuseau horaire (/etc/timezone)|true,continu|fcat -o '[[offset]]' etc/timezone '$IMAGE' | tee '$DIR_SYSTEME/${TK_PREFIX}_timezone.txt'"
"Fuseau horaire (/etc/localtime)|true,continu|istat -o '[[offset]]' '$IMAGE' \"\$(ifind -o '[[offset]]' -n etc/localtime '$IMAGE')\" | tee '$DIR_SYSTEME/${TK_PREFIX}_localtime.txt' | head -n 8"
"Le .bashrc de chaque compte|true,continu|icat -o '[[offset]]' '$IMAGE' '{{bashrc}}' | tee '$DIR_BASHRC/${TK_PREFIX}_{{bashrc_libelle}}.txt'"
"fls|true|fls -r -p -m / -o '[[offset]]' '$IMAGE' | tee '$DIR_FLS/${TK_PREFIX}.fls' | tail -n 10"
"ils|true|ils -m -o '[[offset]]' '$IMAGE' | tee '$DIR_FLS/${TK_PREFIX}.ils' | tail -n 10"
"Corps de la timeline (fls + ils)|true|cat '$DIR_FLS/${TK_PREFIX}.fls' '$DIR_FLS/${TK_PREFIX}.ils' | tee '$DIR_FLS/${TK_PREFIX}_body.mactime' | tail -n 10"
"Timeline mactime|true|mactime -b '$DIR_FLS/${TK_PREFIX}_body.mactime' -d -z '$TZ_MACTIME' | tee '$DIR_FLS/${TK_PREFIX}_mactime.csv' | tail -n 10"
"Journaux de /var/log, tels quels|true|tsk_recover -a -o '[[offset]]' -d \"\$(ifind -o '[[offset]]' -n var/log '$IMAGE')\" '$IMAGE' '$DIR_JOURNAUX'"
"Partitions pour photorec (testdisk)|false,log|testdisk /list '$IMAGE'"
"photorec sur la partition [[partition]]|true,ecran|photorec /log /logname '$DIR_LOGS/${TK_PREFIX}_photorec.log' /d '$DIR_PHOTOREC/recup_' /cmd '$IMAGE' '[[partition]]',fileopt,everything,enable,freespace,search && ls -lR '$DIR_PHOTOREC' | tail -n 20"
)
# home   : chaque dossier de /home sur l'image, inode<TAB>chemin
# bashrc : dans chacun, le fichier .bashrc — motif shell, pas une regex :
#          '.bash*' prendrait aussi .bash_history, '*' tout le profil.
#          Zéro itération si le compte n'en a pas : ce n'est pas une erreur.
TK_LISTES=(
"home|lister_homes_dd '$IMAGE' '[[offset]]'"
"bashrc|lister_fichiers_dd '$IMAGE' '[[offset]]' '{{home}}' '.bashrc' '{{home_libelle}}'"
)
}

# --- fonctions -----------------------------------------------------------
# Elles rendent « inode<TAB>étiquette » : l'inode entre dans la commande,
# l'étiquette s'affiche et sert de nom de fichier.
#
# fls écrit une ligne par entrée : « d/d 14: <TAB> carole », avec une
# étoile pour un fichier supprimé : « r/r * 26: <TAB> vieux.txt ». Deux
# coupes bash en tirent l'inode, aucun awk ni sed n'est nécessaire. Le
# motif est un motif SHELL — .bashrc, *.log, [!.]* — pas une expression
# régulière ; absent, il prend tout.

# lister_dossiers_dd <image> <offset> <inode> : les sous-dossiers directs.
lister_dossiers_dd() {
    local meta nom ino
    while IFS=$'\t' read -r meta nom; do
        (( INTERROMPU )) && return 130
        [[ "$nom" == "." || "$nom" == ".." || "$nom" == '$'* ]] && continue
        ino="${meta##* }"; emettre "${ino%:}" "$nom"
    done < <(fls -o "$2" -D -p "$1" "$3" 2>/dev/null)
    return 0
}

# lister_fichiers_dd <image> <offset> <inode> [motif] [préfixe]
# Les fichiers du dossier et de ses sous-dossiers dont le NOM colle au
# motif. L'étiquette est un nom de fichier sûr : le préfixe — le compte —
# évite que les .bashrc de deux comptes portent le même nom, car fls rend
# un chemin relatif à l'inode de départ, pas le chemin complet.
lister_fichiers_dd() {
    local motif="${4:-*}" pre="${5-}" meta nom ino etiq
    while IFS=$'\t' read -r meta nom; do
        (( INTERROMPU )) && return 130
        [[ "$meta" == V/V* ]] && continue        # $OrphanFiles et compagnie
        nom="${nom##*/}"                          # -r rend un chemin : le nom suffit
        # shellcheck disable=SC2053  # motif volontairement non protégé
        [[ "$nom" == $motif ]] || continue
        ino="${meta##* }"; ino="${ino%:}"
        etiq="${pre:+${pre}_}$nom"
        [[ "$meta" == *"*"* ]] && etiq+="_supprime"
        emettre "$ino" "${etiq//[!A-Za-z0-9._-]/_}"
    done < <(fls -o "$2" -F -p -r "$1" "$3" 2>/dev/null)
    return 0
}

# lister_homes_dd <image> <offset> : les dossiers de /home.
# ifind rend l'inode d'un chemin — c'est ce que fait aussi l'étape 10 pour
# var/log. Inutile de relire la racine avec fls pour retrouver « home ».
lister_homes_dd() {
    local racine
    racine="$(ifind -o "$2" -n home "$1" 2>/dev/null)"
    [[ -n "$racine" ]] || { printf 'pas de dossier home sur la partition %s\n' "$2" >&2; return 1; }
    lister_dossiers_dd "$1" "$2" "$racine"
}
