# Un dd d'un poste Linux : identité, comptes, timeline, journaux, carving.
#     ./tasker.sh -c exemples/dd-linux.conf
#
# Même organisation que dd-windows.conf : fdisk affiche les partitions,
# on tape l'offset ; testdisk les affiche à sa façon, on tape le numéro
# pour photorec. Les comptes, eux, sont une liste : le script lit /home
# sur l'image et rejoue l'étape des .bashrc pour chacun.
#
# Tout ce qui est écrit va dans ANALYSE/OS/SALLE/PREFIX/ :
#     SYSTEME/           PREFIX_hostname.txt  PREFIX_timezone.txt  PREFIX_localtime.tzfile
#     BASHRC/            PREFIX_carole_.bashrc.txt  PREFIX_dave_.bashrc.txt  …
#     ILS_FLS_MACTIME/   PREFIX.fls  PREFIX.ils  PREFIX_body.mactime  PREFIX_mactime.csv
#     JOURNAUX/          les fichiers de /var/log, tels quels
#     PHOTOREC/          recup_*/
# Le journal, le rapport, l'état de reprise et le journal photorec vont
# dans le répertoire d'où le script est lancé, préfixés par PREFIX.

# --- variables ---------------------------------------------------------
IMAGE="/images/PC07.dd"        # le dd à analyser
PC="PC07"                      # nom du poste
SALLE="D32"                    # salle
PROJET="PRJ"                   # projet
OS="LINUX"                     # système du poste
ANALYSE="$PWD/ANALYSE"         # racine de sortie
TZ_MACTIME="UTC"               # fuseau de la timeline
TK_OPERATEUR="${SUDO_USER:-${USER:-inconnu}}"
TK_REQUIS=(fdisk fls ils icat fcat ifind tsk_recover mactime testdisk photorec)

# --- chemins et contrôles ----------------------------------------------
calculer_variables() {
    TK_PREFIX="${PC}_${SALLE}_${PROJET}_${OS}"
    DEST="$ANALYSE/$OS/$SALLE/$TK_PREFIX"
    TK_SUJET="$PC · $SALLE · $PROJET · $OS"
    TK_DETAILS=("image=$IMAGE" "sortie=$DEST" "fuseau=$TZ_MACTIME")
    TK_DIR_SYSTEME="$DEST/SYSTEME"
    TK_DIR_BASHRC="$DEST/BASHRC"
    TK_DIR_FLS="$DEST/ILS_FLS_MACTIME"
    TK_DIR_JOURNAUX="$DEST/JOURNAUX"
    TK_DIR_PHOTOREC="$DEST/PHOTOREC"
    TK_DIR_LOGS="$PWD"             # journal, rapport, état : là où le script est lancé
}

verifier() {
    [[ -e "$IMAGE" ]] || { erreur "image absente : $IMAGE"
        info "réglez IMAGE dans ce fichier, ou : --set IMAGE=/chemin.dd"
        return 1; }
    [[ -r "$IMAGE" ]] || { erreur "image illisible : $IMAGE"; return 1; }
    return 0
}

# --- commandes ---------------------------------------------------------
# [[offset]]    : en secteurs, la colonne Start de fdisk. Demandé à l'étape 2,
#                 réutilisé partout ensuite.
# [[partition]] : le numéro affiché par testdisk. Demandé à la dernière étape.
# fcat lit un fichier par son chemin sur l'image, sans le monter. Les
# étapes « continu » ne cassent rien si le fichier n'existe pas : tous
# les Linux n'ont pas /etc/timezone, tous les comptes n'ont pas de .bashrc.
definir_commandes() {
TK_COMMANDES=(
"Partitions du dd (fdisk)|false,log|fdisk -l '$IMAGE'"
"Nom de la machine, partition à l'offset [[offset]]|true,continu|fcat -o '[[offset]]' etc/hostname '$IMAGE' | tee '$TK_DIR_SYSTEME/${TK_PREFIX}_hostname.txt'"
"Fuseau horaire (/etc/timezone)|true,continu|fcat -o '[[offset]]' etc/timezone '$IMAGE' | tee '$TK_DIR_SYSTEME/${TK_PREFIX}_timezone.txt'"
"Fuseau horaire (/etc/localtime, dernière ligne = la règle)|true,continu|fcat -o '[[offset]]' etc/localtime '$IMAGE' > '$TK_DIR_SYSTEME/${TK_PREFIX}_localtime.tzfile' && strings '$TK_DIR_SYSTEME/${TK_PREFIX}_localtime.tzfile' | tail -n 1"
"Le .bashrc de chaque compte|true,continu|icat -o '[[offset]]' '$IMAGE' '{{bashrc}}' | tee '$TK_DIR_BASHRC/${TK_PREFIX}_{{bashrc_libelle}}.txt'"
"fls|true|fls -r -p -m / -o '[[offset]]' '$IMAGE' | tee '$TK_DIR_FLS/${TK_PREFIX}.fls' | tail -n 10"
"ils|true|ils -m -o '[[offset]]' '$IMAGE' | tee '$TK_DIR_FLS/${TK_PREFIX}.ils' | tail -n 10"
"Corps de la timeline (fls + ils)|true|cat '$TK_DIR_FLS/${TK_PREFIX}.fls' '$TK_DIR_FLS/${TK_PREFIX}.ils' | tee '$TK_DIR_FLS/${TK_PREFIX}_body.mactime' | tail -n 10"
"Timeline mactime|true|mactime -b '$TK_DIR_FLS/${TK_PREFIX}_body.mactime' -d -z '$TZ_MACTIME' | tee '$TK_DIR_FLS/${TK_PREFIX}_mactime.csv' | tail -n 10"
"Journaux de /var/log, tels quels|true|tsk_recover -a -o '[[offset]]' -d \"\$(ifind -o '[[offset]]' -n var/log '$IMAGE')\" '$IMAGE' '$TK_DIR_JOURNAUX'"
"Partitions pour photorec (testdisk)|false,log|testdisk /list '$IMAGE'"
"photorec sur la partition [[partition]]|true|photorec /log /logname '$TK_DIR_LOGS/${TK_PREFIX}_photorec.log' /d '$TK_DIR_PHOTOREC/recup_' /cmd '$IMAGE' '[[partition]]',fileopt,everything,enable,freespace,search"
)
# home   : chaque dossier de /home sur l'image, inode<TAB>chemin
# bashrc : dans chacun, le fichier nommé .bashrc — zéro itération s'il manque
TK_LISTES=(
"home|lister_homes '$IMAGE' '[[offset]]'"
"bashrc|lister_fichiers_nommes '$IMAGE' '[[offset]]' '{{home}}' '^\.bashrc$' '{{home_libelle}}'"
)
}

# --- fonctions -----------------------------------------------------------
# Elles lisent l'image avec fls et rendent inode<TAB>chemin : l'inode va
# dans la commande, le chemin s'affiche et sert de nom de fichier.

# lister_homes <image> <offset> : les dossiers de /home.
lister_homes() {
    local img="$1" off="$2" ino
    ino=$(fls -o "$off" -D -p "$img" 2>/dev/null | awk -F'\t' '
        { n = $2; sub(/^.*\//, "", n)
          if (n == "home") { split($1, c, " "); i = c[length(c)]; sub(/:$/, "", i); print i; exit } }')
    [[ -n "$ino" ]] || { printf 'pas de dossier home sur la partition %s\n' "$off" >&2; return 1; }
    fls -o "$off" -D -p "$img" "$ino" 2>/dev/null | awk -F'\t' '
        { n = $2; sub(/^.*\//, "", n)
          if (n == "." || n == "..") next
          split($1, c, " "); i = c[length(c)]; sub(/:$/, "", i)
          printf "%s\t%s%s\n", i, $2, ($1 ~ /\*/) ? " (supprimé)" : "" }'
    return 0
}

# lister_fichiers_image <image> <offset> <inode> : les fichiers d'un dossier.
lister_fichiers_image() {
    fls -o "$2" -F -p -r "$1" "$3" 2>/dev/null | awk -F'\t' '
        { split($1, c, " "); i = c[length(c)]; sub(/:$/, "", i)
          if (i !~ /^[0-9]/) next
          printf "%s\t%s%s\n", i, $2, ($1 ~ /\*/) ? " (supprimé)" : "" }'
    return 0
}

# lister_fichiers_nommes <image> <offset> <inode> <motif> [préfixe]
# Les fichiers d'un dossier dont le NOM correspond au motif. Le libellé sert
# de nom de fichier : il faut donc le préfixer par le compte, sinon les
# .bashrc de deux comptes portent le même nom et le second écrase le premier.
# fls -p rend un chemin relatif à l'inode de départ, pas le chemin complet.
lister_fichiers_nommes() {
    lister_fichiers_image "$1" "$2" "$3" | awk -F'\t' -v m="$4" -v pre="${5-}" '
        { n = $2; sub(/^.*\//, "", n)
          if (n !~ m) next
          p = (pre == "" ? $2 : pre "_" n)
          gsub(/[^A-Za-z0-9._-]/, "_", p)
          printf "%s\t%s\n", $1, p }'
    return 0
}
