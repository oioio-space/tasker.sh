# Exemple de configuration — un fichier par poste analysé.
#
#     ./forensic.sh -c exemples/pc07.conf
#
# On n'y met que les variables de la section 1 du script : les chemins
# de travail (DEST, DIR_BODY, ...) en sont déduits automatiquement.
# C'est un bout de shell, donc les guillemets sont obligatoires dès
# qu'il y a un espace.

IMAGE="/images/pc07.dd"
PC="PC07"
SALLE="B204"
OS="windows"                  # windows ou linux
BASE="/cases"
OPERATEUR="M. Bachmann"

# Fuseau du poste analysé, pas le vôtre.
TZ_MACTIME="Europe/Paris"

# Décommentez pour confirmer chaque étape sans avoir à taper -v.
#TOUT_VALIDER="true"

# Garde-fou sur les étapes répétées : au-delà, le script demande
# confirmation avant de partir pour la nuit.
#MAX_ITERATIONS=500
