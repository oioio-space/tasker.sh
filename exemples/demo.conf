# Bac à sable pour découvrir forensic.sh sans image disque ni outil
# forensique. Chargé par ./forensic.sh --demo (ou -c exemples/demo.conf).
#
# Un fichier -c est du shell : il peut fixer les variables de la
# section 1, mais aussi redéfinir definir_commandes et ajouter des
# fonctions. C'est ce qu'on fait ici. Lisez-le comme un exemple complet.

DEMO="${TMPDIR:-/tmp}/forensic-demo"
IMAGE="$DEMO/scelles"          # ici, un dossier tient lieu d'image
BASE="$DEMO/sortie"
PC="DEMO"; SALLE="bac-a-sable"; OS="demo"
REQUIS=(ls find wc du sha256sum)

INTRO="  Mode démonstration : tout se passe dans $DEMO, rien d'autre n'est touché.
  · étape 2 : répondez au menu, puis regardez l'étape 3 ne plus rien demander
  · étape 4 : « l » liste les itérations, « u » les déroule une par une
  · étape 5 : deux listes emboîtées alors qu'une seule est écrite
  · partout : « e » édite, « r » ressaisit, Ctrl-C arrête"

# Le bac à sable : deux services, des agents, des notes — et un nom
# avec une apostrophe, parce que c'est ce qui casse les scripts.
mkdir -p "$IMAGE"
for a in comptabilite/alice comptabilite/bruno "logistique/celia dupont" logistique/omar "logistique/o'brien"; do
    mkdir -p "$IMAGE/$a"
    for n in memo rapport; do printf 'note %s de %s\n' "$n" "${a##*/}" > "$IMAGE/$a/$n.txt"; done
done

# ---------------------------------------------------------------------
definir_commandes() {

COMMANDES=(
# Étape simple, sans validation.
"Ce qu'il y a dans le bac à sable|false|ls -R '$IMAGE'"

# [[service]] : demandé une fois. La liste « service » existe : menu.
"Contenu d'un service|true|ls -l '$IMAGE/[[service]]'"

# La même [[valeur]] : plus redemandée.
"Taille de ce service|true|du -sh '$IMAGE/[[service]]'"

# {{agent}} : rejouée pour chaque agent. {{agent_libelle}} = le nom seul.
"Nombre de fichiers par agent|true|echo -n '{{agent_libelle}} : '; ls -1 '{{agent}}' | wc -l"

# Deux boucles emboîtées : « note » dépend de {{agent}}, la boucle sur
# les agents se déclenche toute seule.
"Empreinte de chaque note de chaque agent|true,log|sha256sum '{{note}}'"

# Un échec, pour voir. « continu » = pas de question.
"Une étape qui échoue exprès|true,continu|ls '$IMAGE/ce-fichier-n-existe-pas'"

# Un \$ échappé : il n'existe qu'à l'exécution.
"Compte-rendu|false,log|printf 'notes : %s\n' \$(find '$IMAGE' -name '*.txt' | wc -l)"
)

LISTES=(
"service|ls -1 '$IMAGE'"
"agent|lister_agents '$IMAGE/[[service]]'"
"note|lister_notes '{{agent}}'"
)

}

# chemin<TAB>nom de chaque sous-dossier
lister_agents() {
    local a
    for a in "$1"/*/; do
        (( INTERROMPU )) && return 130
        [[ -d "$a" ]] || continue
        a="${a%/}"; printf '%s\t%s\n' "$a" "${a##*/}"
    done
    return 0
}

# chemin<TAB>nom de chaque .txt d'un dossier
lister_notes() {
    local f
    for f in "$1"/*.txt; do
        (( INTERROMPU )) && return 130
        [[ -e "$f" ]] && printf '%s\t%s\n' "$f" "${f##*/}"
    done
    return 0
}
