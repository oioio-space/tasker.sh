# ══════════════════════════════════════════════════════════════════════
#  COLLECTE DE TRIAGE — poste Linux, image DÉJÀ MONTÉE en lecture seule
# ══════════════════════════════════════════════════════════════════════
#
#     sudo ./tasker.sh -c exemples/collecte-linux.conf \
#          --set MONTAGE=/mnt/investigation --set PERIPH=/dev/loop0p2
#
#     MONTAGE   la racine du système montée en ro : tout se lit là
#     PERIPH    le périphérique qui porte le système de fichiers —
#               ce qu'affiche : findmnt -no SOURCE /mnt/investigation
#
# Montez avant : losetup -r, puis mount -o ro,noatime (xfs au journal
# sale : ajoutez norecovery). Un /home sur un autre volume, monté sous
# MONTAGE, est traité comme la racine : timeline, comptes, système de
# fichiers, supprimés, photorec.
#
# Aucun outil maison : chaque étape est une commande que vous pouvez
# retaper à la main. Modifiez une ligne du tableau, ajoutez-en, retirez-en.
#
# Pour exploiter la collecte ensuite : exemples/skills/forensic-linux/, un
# skill qui en tire un rapport daté et sourcé. Son mode d'emploi est dans
# exemples/skills/README.md — il ne demande que python3.


# ══════════════════════════════════════════════════════════════════════
#  CE QUI EST ÉCRIT — ANALYSE/OS/PROJET/PREFIX/
# ══════════════════════════════════════════════════════════════════════
#
#     SYSTEME/      os-release, hostname, localtime, timezone, fstab,
#                   PREFIX_fs_<volume>.txt, PREFIX_localtime.txt — la
#                   cible du lien /etc/localtime, qui nomme le fuseau, ou
#                   la règle TZ du fichier quand ce n'est pas un lien —
#                   et PREFIX_installation.tar.gz : machine-id, adjtime
#                   (heure RTC locale ou UTC), machine-info, crypttab,
#                   l'horloge de systemd-timesync, et les journaux de
#                   l'installateur, dont la DATE dans l'archive donne la
#                   pose du système
#     PAQUETS/      la base brute, la liste des paquets avec leur date
#                   d'installation, l'historique du gestionnaire de paquets
#                   — dpkg, apt, yum, dnf, zypper, pacman, apk —, et ce qui s'installe
#                   à côté de lui : snap, flatpak, les dépôts déclarés
#     COMPTES/      passwd, group, PREFIX_droits.tar.gz (shadow, sudoers,
#                   et le contrôle d'accès : SELinux ou AppArmor),
#                   PREFIX_domaine.tar.gz (sssd, kerberos, samba, et le
#                   cache sss, qui nomme les comptes du domaine vus ici)
#                   puis, par compte : dates, sessions, échecs, artefacts,
#                   profils applicatifs, inventaire
#     CONNEXIONS/   wtmp, btmp, lastlog copiés ; wtmp et btmp relus ;
#                   wtmp.db et lastlog2.db (Fedora 40+, Debian 13+) copiés
#                   et vidés en texte
#     RESEAU/       PREFIX_reseau.tar.gz — profils NetworkManager,
#                   netplan, ifcfg, systemd, plus hosts, ssh, les baux, et
#                   le pare-feu quel qu'il soit : firewalld, ufw, iptables,
#                   nftables
#     PERSISTANCE/  PREFIX_persistance.tar.gz (cron, systemd, rc.local,
#                   profile.d, ld.so.preload, modules)
#     JOURNAUX/     var_log.tar.gz, et le journal systemd exporté en
#                   clair quand l'image en a un sur disque
#     TIMELINE/     PREFIX_mactime.csv, la chronologie de TOUTE
#                   l'arborescence, et les corps dont elle sort, un par
#                   provenance : PREFIX_body.mactime, le système de
#                   fichiers de PERIPH lu sur le périphérique, et
#                   PREFIX_body_imbriques.mactime, ce qui est monté
#                   dessous — un /home sur un autre volume. Aucune
#                   ligne n'est dans les deux.
#     MACHINES/     les disques virtuels trouvés sur le poste
#     SUPPRIMES/    un dossier par volume xfs. Ce que xfs_undelete rend
#                   aux inodes libérés : n'importe quel type de fichier,
#                   nommé de sa date de suppression et de son inode, mais
#                   rendu par blocs entiers, complété de zéros
#     PHOTOREC/     un dossier par volume, recup_*/ dedans. Ce que le
#                   carving retrouve sans inode : les seuls types qu'il
#                   connaît, sans nom ni date, mais à la bonne taille ;
#                   l'étape en affiche le poids total
#     STRINGS/      PREFIX_strings_<volume>.txt.gz, les chaînes lisibles
#                   du PÉRIPHÉRIQUE de chaque volume, avec leur décalage
#                   en octets — donc aussi celles des fichiers effacés,
#                   du slack et du swap, que ni la timeline ni photorec
#                   ne rendent. À côté, quatre extraits déjà triés que
#                   l'analyse lit directement : _urls, _courriels, _ip,
#                   _chemins. Un jeu par volume : aucun n'est oublié,
#                   c'est la même liste que photorec
#
# Le journal, le rapport, l'état de reprise et les journaux photorec vont
# dans PREFIX/, là où le script est lancé.
#
# Le nom du fichier dit comment il a été écrit :
#     cp -aL   une pièce emportée telle quelle, avec ses dates, sous son
#              nom d'origine — os-release, fstab, wtmp
#     tar      un lot de pièces, dont certaines peuvent manquer —
#              PREFIX_droits.tar.gz ; -v affiche ce qui est entré
#     tee      la sortie d'un outil, sous le PREFIX — PREFIX_fs_racine.txt
# Toujours -L : c'est le CONTENU qu'on veut, /etc/os-release et
# /etc/localtime étant des liens sur la plupart des distributions. Aucune
# étape ne pose donc de lien dans la sortie — une destination qui n'en
# accepte pas, SAN en NTFS ou en exFAT, partage SMB, la reçoit entière.
# Ce qu'un lien disait est relevé à côté : PREFIX_localtime.txt.


# ══════════════════════════════════════════════════════════════════════
#  1 · VARIABLES
# ══════════════════════════════════════════════════════════════════════

MONTAGE=""                     # À FOURNIR : --set MONTAGE=/mnt/investigation
PERIPH=""                      # À FOURNIR : --set PERIPH=/dev/loop0p2

PC="PC07"                      # nom du poste
SALLE="D32"                    # salle
PROJET="PRJ"                   # projet
OS="LINUX"                     # système du poste

ANALYSE="$PWD/ANALYSE"         # racine de sortie
TZ_MACTIME="UTC"               # fuseau de la timeline

TK_OPERATEUR="${SUDO_USER:-${USER:-inconnu}}"

# Ce qu'il faut sur TOUTE image — mactime en fait partie, il lit le corps
# de la timeline quel que soit le système de fichiers ; tune2fs et blkid
# aussi, l'étape « Système de fichiers » essaie le premier puis l'autre
# sur chaque volume. Le reste s'ajoute plus bas, dans la branche qui
# l'emploie, et n'est réclamé que si l'image le demande : rpm ou
# dpkg-query, fls et ils sur ext, fsxfsinfo sur xfs, journalctl, sqlite3,
# last et lastb.
# Sur Ubuntu 24.04 : apt install rpm sleuthkit testdisk libfsxfs-utils
# ATTENTION au libfsxfs-utils de 22.04 et 24.04 (20201117) : il calcule
# sur 32 bits la taille d'un groupe d'allocation EN OCTETS. Au-delà de
# 4 Gio par groupe le calcul déborde, il cherche le groupe suivant
# n'importe où et refuse le volume — or tout xfs de plus de 16 Gio a des
# groupes plus gros. Mesuré : 4 Gio passe, 4,25 Gio non ; sur 50 Gio en
# quatre groupes de 12,5 Gio, il va lire à 512 Mio.
# 25.10 et 26.04 ont la version corrigée, 20240501. Sur 24.04, on la
# rétroporte — un vrai paquet, que dpkg suit et sait retirer :
#     apt purge libfsxfs-utils
#     apt install build-essential debhelper pkgconf dh-python \
#                 python3-dev python3-setuptools
#     P=http://archive.ubuntu.com/ubuntu/pool/universe/libf/libfsxfs
#     for f in libfsxfs_20240501-1ubuntu3.dsc \
#              libfsxfs_20240501.orig.tar.gz \
#              libfsxfs_20240501-1ubuntu3.debian.tar.xz; do curl -fLO $P/$f; done
#     dpkg-source -x libfsxfs_20240501-1ubuntu3.dsc
#     cd libfsxfs-20240501 && DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -us -uc -b
#     apt install ../libfsxfs1t64_*.deb ../libfsxfs-utils_*.deb
# nocheck écarte le seul test qui échoue, celui du module Python, quand
# python-is-python3 est installé : le script de test amont s'y perd. Les
# tests de la bibliothèque et des outils, eux, passent.
# Sans ce rétroportage rien ne casse : l'étape voit le refus et lit la
# timeline sur le montage — voir « lecteur », en section 5.
# xfs_undelete n'est dans aucun dépôt : c'est un script Tcl, et l'étape qui
# s'en sert n'existe que s'il est là. Pour l'avoir :
#     apt install tcl tcllib
#     curl -L -o /usr/local/bin/xfs_undelete \
#          https://raw.githubusercontent.com/ianka/xfs_undelete/master/xfs_undelete
#     chmod +x /usr/local/bin/xfs_undelete
TK_REQUIS=(findmnt tar find strings gzip zcat tune2fs blkid mactime photorec)


# ══════════════════════════════════════════════════════════════════════
#  2 · CHEMINS ET CONTRÔLES
# ══════════════════════════════════════════════════════════════════════

calculer_variables() {
    TK_PREFIX="${PC}_${SALLE}_${PROJET}_${OS}"
    DEST="$ANALYSE/$OS/$PROJET/$TK_PREFIX"

    TK_SUJET="$PC · $SALLE · $PROJET · $OS"
    TK_DETAILS=("montage=$MONTAGE" "source=$PERIPH" "sortie=$DEST" "fuseau=$TZ_MACTIME")

    DIR_SYSTEME="$DEST/SYSTEME"
    DIR_PAQUETS="$DEST/PAQUETS"
    DIR_COMPTES="$DEST/COMPTES"
    DIR_CONNEXIONS="$DEST/CONNEXIONS"
    DIR_RESEAU="$DEST/RESEAU"
    DIR_PERSISTANCE="$DEST/PERSISTANCE"
    DIR_JOURNAUX="$DEST/JOURNAUX"
    DIR_TIMELINE="$DEST/TIMELINE"
    DIR_MACHINES="$DEST/MACHINES"
    DIR_PHOTOREC="$DEST/PHOTOREC"
    DIR_STRINGS="$DEST/STRINGS"
    DIR_SUPPRIMES="$DEST/SUPPRIMES"

    # Un dossier par collecte, là où le script est lancé : deux passes
    # sur le même poste ne mélangent plus leurs journaux.
    DIR_LOGS="$PWD/$TK_PREFIX"
}

verifier() {
    # Les chemins sont posés entre apostrophes dans les commandes : une
    # apostrophe dans l'un d'eux redécouperait la ligne entière.
    case "$DEST$DIR_LOGS$MONTAGE$PERIPH$TZ_MACTIME" in
        *\'*) erreur "apostrophe dans un chemin ou un nom : impossible ici."
             info "renommez le dossier de sortie, ou lancez le script d'ailleurs."
             return 1 ;;
    esac

    [[ -n "$MONTAGE" ]] || { erreur "MONTAGE n'est pas renseigné."
        info "donnez-le : --set MONTAGE=/mnt/investigation"
        return 1; }

    [[ -n "$PERIPH" ]] || { erreur "PERIPH n'est pas renseigné : fls et ils lisent le périphérique, pas le montage."
        info "donnez-le : --set PERIPH=/dev/loop0p2"
        return 1; }

    local opts
    opts="$(findmnt -no OPTIONS "$MONTAGE" 2>/dev/null)" || { erreur "rien n'est monté sur $MONTAGE"
        info "montez l'image d'abord : mount -o ro,noatime <partition> '$MONTAGE' — ou prenez exemples/dd-linux.conf, qui lit l'image sans la monter."
        return 1; }

    # Une pièce montée en écriture s'abîme au premier accès.
    [[ ",$opts," == *",ro,"* ]] || { erreur "$MONTAGE n'est pas monté en lecture seule : $opts"
        info "remontez-le : umount '$MONTAGE' puis mount -o ro,noatime,noexec,nodev …"
        return 1; }

    [[ -b "$PERIPH" ]] || { erreur "pas un périphérique bloc : $PERIPH"
        info "il faut être root, et donner la partition, pas un fichier."
        return 1; }

    # En LVM, findmnt dit /dev/mapper/vg-root et vous /dev/vg/root : le même
    # périphérique, d'où readlink -f. En btrfs il suffixe le sous-volume,
    # /dev/mapper/clair[/root] : on coupe au crochet.
    local src; src="$(findmnt -no SOURCE "$MONTAGE" 2>/dev/null)"; src="${src%%[*}"
    [[ "$(readlink -f "$src")" == "$(readlink -f "$PERIPH")" ]] \
        || attention "$PERIPH n'est pas la source de $MONTAGE : donnez la partition, pas le disque entier."

    # Sans /etc, ce n'est pas la racine d'un système.
    [[ -d "$MONTAGE/etc" ]] || { erreur "pas de $MONTAGE/etc : ce n'est pas la racine d'un système."
        info "en btrfs, montez le sous-volume : mount -o ro,subvol=root … ; sinon vérifiez le chemin."
        return 1; }

    return 0
}


# ══════════════════════════════════════════════════════════════════════
#  3 · COMMANDES
# ══════════════════════════════════════════════════════════════════════
#
# Aucune étape ne porte « continu » : rouge veut dire qu'il s'est passé
# quelque chose — d'où les étapes qui n'existent pas quand l'image n'a pas
# de quoi les nourrir, plutôt qu'une étape qui échouerait. Ce qui varie est
# réglé une fois, en tête de la fonction, sous deux formes :
#   · un fragment de commande interpolé dans une étape qui, elle, existe
#     toujours — $fuseau, $paquets, $connexions, $corps, $corps_tous,
#     $volumes ;
#   · une étape entière, ou rien — $journal, $bases, $corps_imbr,
#     $supprimes, et celles qui lisent wtmp ou btmp. Voir le tableau
#     pour la façon de l'y glisser.
# Le plan (-l) montre les commandes retenues, et lui seul dit combien
# d'étapes ce cas-ci demande : cela dépend de l'image, et pour la seule
# étape xfs_undelete, de ce qui est installé sur le poste.
#
# À savoir :
#   · les étapes qui relisent wtmp, btmp ou wtmp.db lisent la COPIE faite
#     par « Copie des fichiers de connexion » — avec -o, gardez-la.
#   · les artefacts d'un compte tiennent en deux étapes : les pièces de
#     triage (quelques Ko), puis .cache, .local, les profils de navigateur,
#     snap et flatpak — 300 Mo et une minute pour UN compte. En triage,
#     passez la seconde (touche p).
#   · l'export du journal systemd écrit du texte brut : un journal de
#     plusieurs Go en donne autant, et --verify le relit en entier.
#   · xfs_undelete est plus lourd encore : il examine CHAQUE inode du
#     système de fichiers, en Tcl — comptez des dizaines de minutes sur un
#     disque bien rempli, davantage sur plusieurs millions d'inodes. Et
#     « -i "" » ayant retiré le filtre, il écrit tout ce qu'il retrouve.
#     Avec photorec juste après, prévoyez la place. En triage, passez-le
#     (touche p) ou bornez-le dans le temps avec son option -t.
#   · l'« Historique des installations » reprend des chemins déjà pris par
#     l'archive de /var/log : c'est voulu, PAQUETS/ se lit alors sans aller
#     ouvrir JOURNAUX/.
#   · les tar de LOTS portent --ignore-failed-read : une pièce absente est
#     notée au journal, pas une erreur — toutes les distributions n'ont pas
#     /etc/cron.d. Celui de /var/log ne le porte pas : un /var/log absent
#     est une anomalie.
#   · photorec rend toujours 0, même quand il ne fait rien. PERIPH étant
#     déjà un système de fichiers, il n'y a pas de partition à choisir :
#     partition_none. Lisez la liste en fin d'étape, et son journal.

definir_commandes() {

    # ── Réglé une fois, selon l'image examinée ────────────────────────

    # /etc/localtime est presque toujours un lien, et c'est sa CIBLE qui
    # nomme le fuseau — le fichier pointé ne porte que les transitions.
    # La cible est donc relevée en clair : recopier le lien échouerait sur
    # une destination qui n'en accepte pas — SAN en NTFS ou en exFAT,
    # partage SMB sans mfsymlinks — et un nom de fuseau dans un .txt se
    # lit de partout.
    # Quand ce n'est pas un lien, le pied du fichier TZif porte la règle
    # (CET-1CEST,M3.5.0…) : strings la rend, c'est sa dernière ligne.
    local fuseau="cp -aL '$MONTAGE/etc/localtime' '$DIR_SYSTEME/' && { readlink '$MONTAGE/etc/localtime' || strings '$MONTAGE/etc/localtime' | tail -n 1; } | tee '$DIR_SYSTEME/${TK_PREFIX}_localtime.txt'"
    # /etc/timezone n'existe que sur Debian et dérivés.
    [[ -f "$MONTAGE/etc/timezone" ]] && fuseau="$fuseau && cp -aL '$MONTAGE/etc/timezone' '$DIR_SYSTEME/'"

    # rpm est interrogé dans une COPIE de sa base : il l'ouvre en écriture
    # même pour lire, et échoue sur un montage en lecture seule. cp -aLT :
    # -L parce que /var/lib/rpm est un lien depuis Fedora 36, -T pour ne pas
    # recopier la base DANS la copie si l'étape est rejouée. --last donne
    # la date d'installation. dpkg-query n'écrit rien et lit le montage ;
    # il passe en premier, une Debian où rpm est un simple outil a un
    # /var/lib/rpm vide.
    # Arch : un dossier par paquet dans var/lib/pacman/local, avec sa date de
    # pose dans « desc » (%INSTALLDATE%) — on l'emporte tel quel, la liste
    # est celle des dossiers. Alpine : lib/apk/db/installed, en texte.
    # openSUSE : la base RPM est au format ndb, que le rpm d'Ubuntu ne lit
    # pas toujours ; rpm --last échoue alors, et var/log/zypp/history — dans
    # l'historique — donne quand même chaque pose avec sa date.
    local paquets="echo 'ni base dpkg, ni RPM, ni pacman, ni apk sur cette image' >&2; false"
    if [[ -d "$MONTAGE/var/lib/dpkg" ]]; then
        TK_REQUIS+=(dpkg-query)
        paquets="cp -aL '$MONTAGE/var/lib/dpkg/status' '$DIR_PAQUETS/${TK_PREFIX}_dpkg_status.txt' && dpkg-query --admindir='$MONTAGE/var/lib/dpkg' -l"
    elif [[ -d "$MONTAGE/var/lib/rpm" ]]; then
        TK_REQUIS+=(rpm)
        local rpmdb="$DIR_PAQUETS/${TK_PREFIX}_rpmdb"
        paquets="cp -aLT '$MONTAGE/var/lib/rpm' '$rpmdb' && rpm --dbpath '$rpmdb' -qa --last"
    elif [[ -d "$MONTAGE/var/lib/pacman/local" ]]; then
        # « desc » suffit ; « files » et « mtree » (déjà gzippé) pèsent cent
        # fois plus, et la liste des paquets est celle des dossiers
        paquets="tar -czf '$DIR_PAQUETS/${TK_PREFIX}_pacman_local.tar.gz' --exclude='*/files' --exclude='*/mtree' -C '$MONTAGE/var/lib/pacman' local && ls -1 '$MONTAGE/var/lib/pacman/local'"
    elif [[ -f "$MONTAGE/lib/apk/db/installed" ]]; then
        local apkdb="$DIR_PAQUETS/${TK_PREFIX}_apk_installed.txt"
        paquets="cp -aL '$MONTAGE/lib/apk/db/installed' '$apkdb' && awk -F: '/^P:/{p=\$2} /^V:/{print p\"-\"\$2}' '$apkdb'"
    fi

    # Les fichiers de connexion présents sur l'image. Les rotations se
    # nomment autrement selon la distribution : wtmp.1 chez Debian,
    # wtmp-20190901 chez RHEL quand logrotate porte « dateext ». Un joker
    # les prend toutes — et c'est de la profondeur d'historique, donc des
    # mois de sessions qu'on perdrait à n'emporter que wtmp.
    # lastlog disparaît (Fedora 40, Debian 13) au profit de lastlog2.db, et
    # wtmp.db (wtmpdb) s'ajoute à wtmp. Les deux .db sont du sqlite :
    # copiés, puis vidés en texte par sqlite3.
    local f db connexions="" dumps=""
    for f in "$MONTAGE"/var/log/wtmp* "$MONTAGE"/var/log/btmp* "$MONTAGE"/var/log/lastlog; do
        [[ -f "$f" ]] && connexions="${connexions:+$connexions }'$f'"
    done
    for f in var/lib/wtmpdb/wtmp.db var/lib/lastlog/lastlog2.db; do
        [[ -f "$MONTAGE/$f" ]] || continue
        db="${f##*/}"
        connexions="${connexions:+$connexions }'$MONTAGE/$f'"
        dumps="${dumps:+$dumps && }sqlite3 '$DIR_CONNEXIONS/$db' .dump > '$DIR_CONNEXIONS/${TK_PREFIX}_$db.txt'"
    done
    local bases=""
    if [[ -n "$dumps" ]]; then
        TK_REQUIS+=(sqlite3)
        bases="Sessions en base (wtmpdb, lastlog2)|true|$dumps && ls -l '$DIR_CONNEXIONS'"
    fi

    # last et lastb relisent wtmp et btmp dans la COPIE. Une image qui n'a
    # que wtmp.db n'a ni l'un ni l'autre : leurs étapes n'existent alors
    # pas, plutôt que d'échouer en rouge sur une collecte saine — et les
    # deux outils ne sont réclamés que là.
    local demarrages="" sessions="" sessions_c="" echecs="" echecs_c=""
    if [[ -f "$MONTAGE/var/log/wtmp" ]]; then
        TK_REQUIS+=(last)
        demarrages="Démarrages et arrêts|true|last -F -x -f '$DIR_CONNEXIONS/wtmp' reboot shutdown | tee '$DIR_CONNEXIONS/${TK_PREFIX}_reboots.txt'"
        sessions="Sessions ouvertes|true|last -F -f '$DIR_CONNEXIONS/wtmp' | tee '$DIR_CONNEXIONS/${TK_PREFIX}_sessions.txt' | tail -n 15"
        sessions_c="Sessions de {{compte_libelle}}|true|last -F -f '$DIR_CONNEXIONS/wtmp' '{{compte_libelle}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_sessions.txt'"
    fi
    if [[ -f "$MONTAGE/var/log/btmp" ]]; then
        TK_REQUIS+=(lastb)
        echecs="Échecs d'authentification|true|lastb -F -f '$DIR_CONNEXIONS/btmp' | tee '$DIR_CONNEXIONS/${TK_PREFIX}_echecs.txt' | tail -n 15"
        echecs_c="Échecs d'authentification de {{compte_libelle}}|true|lastb -F -f '$DIR_CONNEXIONS/btmp' '{{compte_libelle}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_echecs.txt'"
    fi

    # Le journal systemd est binaire ; sur Fedora c'est le SEUL journal. S'il
    # est sur disque, journalctl l'exporte en clair et vérifie ses fichiers.
    # Sans journal sur disque (rsyslog seul, journal volatil), pas d'étape :
    # les journaux texte sont dans var_log.tar.gz.
    # Le glob, et non [[ -d ]] : un dossier de journal vide (journal en RAM)
    # ne donnerait qu'un export vide. tee plutôt qu'une redirection puis un
    # wc : le fichier écrit n'est pas relu pour être compté.
    local journal="" jdir="$MONTAGE/var/log/journal" jtxt="$DIR_JOURNAUX/${TK_PREFIX}_journal.txt"
    if ls "$jdir"/*/*.journal >/dev/null 2>&1; then
        TK_REQUIS+=(journalctl)
        journal="Journal systemd, en clair|true|journalctl -D '$jdir' -o short-iso --no-pager | tee '$jtxt' | wc -l && journalctl -D '$jdir' --verify"
    fi

    # Un volume = un système de fichiers. fls, fsxfsinfo et find -xdev
    # n'en lisent qu'un ; ce qui est monté dessous — un /home sur un autre
    # volume — a le sien. La fonction « lecteur », en section 5, choisit
    # de quoi lire UN volume, et la boucle l'appelle pour chacun. Rien
    # n'est perdu, rien n'est compté deux fois, le nom du corps dit d'où
    # viennent ses lignes, et la timeline finale les relit tous les deux.
    # La boucle dresse en même temps VOLUMES, les périphériques dont
    # vivent les étapes rejouées de la section 4 — système de fichiers,
    # xfs_undelete, photorec —, et la liste des points de montage, pour
    # tout find qui doit parcourir l'image sans en sortir.
    local corps="" corps_imbr="" imbriques="" volumes="" xfs_present="" vus=" "
    local racine="" m src fs lu rel lib dev lecture
    local body="$DIR_TIMELINE/${TK_PREFIX}_body.mactime"
    local body_imbr="$DIR_TIMELINE/${TK_PREFIX}_body_imbriques.mactime"
    local csv="$DIR_TIMELINE/${TK_PREFIX}_mactime.csv"
    VOLUMES=()
    # -l évite le dessin d'arbre de -R. La première ligne est le montage
    # lui-même : la racine à retirer des chemins.
    while read -r m src fs; do
        lu="$fs"
        if [[ -z "$racine" ]]; then
            racine="$m" src="$PERIPH" rel="" lib="racine"
        else
            # Un [/chemin] après la source dit un sous-arbre — bind, ou
            # sous-volume btrfs. Ce qui est monté là n'est pas le
            # périphérique entier : seul find, sur le montage, voit juste.
            [[ "$src" != *\[* ]] || lu=""
            # Seuls les vrais volumes sont de l'image : un /proc ou un
            # /sys monté là pour un chroot n'y appartient pas.
            src="${src%%[*}"; [[ -b "$src" ]] || continue
            rel="${m#"$racine"}"
            # L'étiquette nomme les pièces du volume : /home donne home,
            # /var/log donne var_log.
            lib="${rel#/}"; lib="${lib//[!A-Za-z0-9._-]/_}"
        fi
        volumes="${volumes:+$volumes }'$m'"
        [[ "$fs" == xfs ]] && xfs_present=1
        # Un sous-volume btrfs, un bind : deux montages, un seul
        # périphérique. Chaque montage a son corps ; le périphérique, lui,
        # n'est relevé et carvé qu'une fois.
        dev="$(readlink -f -- "$src")"
        [[ "$vus" == *" $dev "* ]] || { vus+="$dev "; VOLUMES+=("$src	$lib	$fs"); }
        lecteur lecture "$src" "$m" "$rel" "$lu"
        if [[ "$m" == "$racine" ]]; then corps="$lecture"
        else imbriques="${imbriques:+$imbriques && }$lecture"; fi
    done < <(findmnt -lR -no TARGET,SOURCE,FSTYPE "$MONTAGE" 2>/dev/null)

    # tee crée le fichier même quand la commande devant lui échoue, et
    # une lecture qui casse à mi-chemin laisse un corps tronqué. Un corps
    # dont la lecture a échoué est donc mis de côté en .partiel — gardé,
    # pas relu — et la timeline, qui ne le trouve plus, passe au rouge ;
    # même sort pour elle si mactime échoue.
    local corps_tous="'$body'"
    if [[ -n "$imbriques" ]]; then
        corps_tous="$corps_tous '$body_imbr'"
        corps_imbr="Corps des montages imbriqués|true|( $imbriques ) | tee '$body_imbr' | tail -n 10 || { mv -f '$body_imbr' '$body_imbr.partiel'; false; }"
    fi

    # Les deux outils ne cherchent pas la même chose : de là les deux
    # étapes, et l'intérêt de les garder toutes les deux.
    #   xfs_undelete part des INODES libérés, dont xfs n'efface pas les
    #     extents. Il rend donc n'importe quel type de fichier, nommé de
    #     la date de sa suppression — le ctime de l'inode — et de son
    #     numéro d'inode. Mais il rend des blocs entiers : le contenu est
    #     là, suivi de zéros jusqu'à la fin du dernier bloc.
    #   photorec ne lit pas le système de fichiers. Il reconnaît des
    #     SIGNATURES dans les octets : il ignore ce qu'il ne connaît pas —
    #     un texte, une base maison —, invente parfois un fichier là où il
    #     n'y en a pas, mais coupe à la bonne taille ce qu'il connaît, et
    #     retrouve ce dont plus aucun inode ne parle.
    # Mesuré sur une même image xfs : un texte de 1235 o, xfs_undelete le
    # rend (4096 o), photorec ne le voit pas ; un png de 7157 o,
    # xfs_undelete le rend à 8192 o, photorec à 7157 o exacts.
    # « -i "" » retire le filtre par défaut, qui jette tout ce que « file »
    # appelle Binary data, un petit texte complété de zéros compris.
    # Seule étape conditionnée à un outil du POSTE et non à l'image, parce
    # que son absence est normale : voir l'en-tête. ls -U n'ordonne pas,
    # et awk lit tout en une passe : les vingt premiers noms, puis le
    # compte — pas head, qui se retire après sa 20e ligne et tue ls d'un
    # SIGPIPE, que pipefail remonte en code 141.
    local supprimes="" sup="$DIR_SUPPRIMES/{{volume_xfs_libelle}}" pr="$DIR_PHOTOREC/{{volume_libelle}}"
    local st="$DIR_STRINGS/${TK_PREFIX}_strings_{{volume_libelle}}"

    # UNE seule décompression, et awk range chaque correspondance dans son
    # fichier au vol. La première version décompressait, coupait le décalage,
    # triait tout le flux avec « sort -u », puis le relisait quatre fois :
    # cinq passes sur des dizaines de gigaoctets, et surtout un tri géant qui
    # déborde dans $TMPDIR — souvent un tmpfs sur un poste d'analyse, où il
    # emporte la collecte avec lui. Ici rien de grand n'est trié : seuls les
    # résultats le sont, et ils tiennent en mégaoctets.
    #
    # La commande se bâtit ici, en bash, plutôt qu'à même l'étape : une boucle
    # « for » dans une chaîne évaluée demanderait quatre niveaux de guillemets
    # imbriqués, pour un résultat que personne ne saurait relire ni corriger.
    #
    # Les motifs d'URL et de chemin sont en classe NÉGATIVE. Une liste positive
    # de caractères se coupe au premier accent : « /home/jean/Téléchargements »
    # devient « /home/jean/T », et sur un poste français c'est la moitié des
    # chemins personnels qui se perd.
    # Motifs donnés à awk en CHAÎNES, pas en /littéraux/ : une expression entre
    # barres obliques s'achève à la première d'entre elles, et « https:// » la
    # fermerait aussitôt. Et pas d'intervalle {n,m} : mawk ne les connaît pas,
    # et la collecte tourne sur le poste qu'on trouve. Les classes négatives
    # bornent d'elles-mêmes, puisqu'elles s'arrêtent à la première espace.
    local motifs_chaines=(
        "urls|(https?|ftp)://[^[:space:]]+"
        "courriels|[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+[.][A-Za-z][A-Za-z.]+"
        "ip|[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+"
        # Six paires écrites en toutes lettres : mawk ne connaît pas les
        # intervalles {n}, et l'awk d'une machine d'analyse n'est pas toujours
        # gawk. Une adresse MAC vue ici a été écrite sur ce disque — un point
        # d'accès associé, une machine du réseau local, une interface qui n'est
        # plus configurée nulle part.
        "mac|[0-9a-fA-F][0-9a-fA-F]:[0-9a-fA-F][0-9a-fA-F]:[0-9a-fA-F][0-9a-fA-F]:[0-9a-fA-F][0-9a-fA-F]:[0-9a-fA-F][0-9a-fA-F]:[0-9a-fA-F][0-9a-fA-F]"
        "chemins|/(home|root|media|mnt|run/media)/[^[:space:]]+"
    )
    local extraits_chaines="" range="" tri="" mc genre motif
    for mc in "${motifs_chaines[@]}"; do
        genre="${mc%%|*}"; motif="${mc#*|}"
        # $1 est le décalage rendu par « strings -t d » ; on le garde, et on
        # n'écrit que ce qui a été reconnu.
        range="${range:+$range }if (match(\$0, \"$motif\")) print \$1, substr(\$0, RSTART, RLENGTH) >> \"${st}_$genre.brut\";"
        # uniq -c -f1 compare en sautant le premier champ : deux décalages
        # différents d'une même chaîne se regroupent, et le décalage conservé
        # est celui de la première occurrence.
        tri="${tri:+$tri && }LC_ALL=C sort -k2 '${st}_$genre.brut' | uniq -c -f1 | LC_ALL=C sort -rn > '${st}_$genre.txt' && rm -f '${st}_$genre.brut'"
    done
    extraits_chaines="rm -f '${st}_'*.brut ; zcat '$st.txt.gz' | LC_ALL=C awk '{ $range }' && $tri && wc -l '${st}_'*.txt"
    if [[ -n "$xfs_present" ]] && command -v xfs_undelete >/dev/null 2>&1; then
        supprimes="Fichiers supprimés de {{volume_xfs_libelle}} (xfs_undelete)|true|mkdir -p '$sup' && xfs_undelete -i '' -o '$sup' '{{volume_xfs}}' && ls -U '$sup' | awk 'NR<=20{print} END{print NR, \"fichiers\"}'"
    fi

# ${x:+"$x"} glisse une étape SI la variable est remplie. Les guillemets
# sont à l'intérieur : dehors ils laisseraient un élément vide, que le
# script refuse (« format attendu Titre|validation|commande ») ; sans eux,
# la ligne serait redécoupée en mots. Une étape optionnelle de plus s'écrit
# de même, à sa place dans le tableau — l'ordre du tableau est l'ordre
# d'exécution. Une liste vide ne conviendrait pas : elle rendrait l'étape
# rouge au lieu de la faire disparaître.
# Les chemins que deux archives emportent, un par ligne : ajouter une
# distribution, c'est ajouter une ligne — et tests/matrice.py à côté.
PIECES_PAQUETS=(
    var/log/dpkg.log var/log/dpkg.log.1 var/log/apt                 # Debian, Ubuntu
    etc/apt/sources.list etc/apt/sources.list.d
    var/log/yum.log var/log/dnf.log var/log/dnf.rpm.log var/log/dnf5 # RHEL, Fedora
    var/lib/dnf/history.sqlite usr/lib/sysimage/libdnf5 etc/yum.repos.d
    var/log/zypp/history etc/zypp/repos.d                            # openSUSE
    var/log/pacman.log etc/pacman.conf                               # Arch
    etc/apk/world etc/apk/repositories var/log/apk.log               # Alpine
    var/lib/snapd/state.json var/lib/flatpak/repo/config             # hors gestionnaire
)
PIECES_RESEAU=(
    etc/NetworkManager var/lib/NetworkManager                        # NM : profils, dates
    etc/sysconfig/network-scripts etc/netplan etc/systemd/network etc/network
    etc/wpa_supplicant var/lib/iwd etc/iwd                           # sans fil hors NM
    etc/hosts etc/hosts.allow etc/hosts.deny etc/resolv.conf etc/systemd/resolved.conf
    etc/nsswitch.conf etc/ssh var/lib/dhcp
    etc/firewalld etc/ufw etc/iptables etc/nftables.conf             # pare-feu
    etc/sysconfig/iptables etc/sysconfig/ip6tables etc/sysconfig/nftables.conf
)

TK_COMMANDES=(

# ── le système ────────────────────────────────────────────────────────
"Ce qui est monté|false,log|findmnt -R -no SOURCE,TARGET,FSTYPE,OPTIONS '$MONTAGE'"
"Distribution (/etc/os-release)|true|cp -aL '$MONTAGE/etc/os-release' '$DIR_SYSTEME/' && cat '$DIR_SYSTEME/os-release'"
"Nom de la machine (/etc/hostname)|true|cp -aL '$MONTAGE/etc/hostname' '$DIR_SYSTEME/' && cat '$DIR_SYSTEME/hostname'"
"Fuseau horaire|true|$fuseau && ls -l '$DIR_SYSTEME'"
"Identité et installation (machine-id, journaux d'installation)|true|tar --ignore-failed-read -czvf '$DIR_SYSTEME/${TK_PREFIX}_installation.tar.gz' -C '$MONTAGE' etc/machine-id var/lib/dbus/machine-id etc/adjtime etc/machine-info etc/crypttab var/lib/systemd/timesync/clock var/log/anaconda root/anaconda-ks.cfg root/original-ks.cfg var/log/installer var/log/installer.log | tail -n 20"
"Montages déclarés (/etc/fstab)|true|cp -aL '$MONTAGE/etc/fstab' '$DIR_SYSTEME/' && cat '$DIR_SYSTEME/fstab'"
"Système de fichiers de {{volume_libelle}}|true|( tune2fs -l '{{volume}}' 2>/dev/null || blkid -p '{{volume}}' ) | tee '$DIR_SYSTEME/${TK_PREFIX}_fs_{{volume_libelle}}.txt' | tail -n 20"
"Paquets installés|true|$paquets | tee '$DIR_PAQUETS/${TK_PREFIX}_paquets.txt' | tail -n 10"
"Historique des installations (dpkg, apt, dnf, zypper, pacman, apk)|true|tar --ignore-failed-read -czvf '$DIR_PAQUETS/${TK_PREFIX}_historique.tar.gz' -C '$MONTAGE' ${PIECES_PAQUETS[*]} | tail -n 20"

# ── les comptes du système ────────────────────────────────────────────
"Comptes déclarés (/etc/passwd, /etc/group)|true|cp -aL '$MONTAGE/etc/passwd' '$MONTAGE/etc/group' '$DIR_COMPTES/' && cat '$DIR_COMPTES/passwd'"
"Domaine et annuaire (sssd, kerberos, samba, ldap)|true|tar --ignore-failed-read -czvf '$DIR_COMPTES/${TK_PREFIX}_domaine.tar.gz' -C '$MONTAGE' etc/sssd etc/krb5.conf etc/krb5.conf.d etc/krb5.keytab etc/realmd.conf etc/samba etc/ipa etc/openldap etc/ldap.conf etc/nslcd.conf etc/pam_ldap.conf etc/net-snmp var/lib/sss/db var/lib/sss/pubconf var/lib/samba | tail -n 20"
"Droits (shadow, sudoers, login.defs)|true|tar --ignore-failed-read -czvf '$DIR_COMPTES/${TK_PREFIX}_droits.tar.gz' -C '$MONTAGE' etc/shadow etc/gshadow etc/passwd- etc/shadow- etc/group- etc/gshadow- etc/sudoers etc/sudoers.d etc/login.defs etc/security etc/pam.d etc/selinux/config etc/apparmor.d etc/sudoers.dist"

# ── qui s'est connecté ────────────────────────────────────────────────
"Copie des fichiers de connexion|true|cp -aL $connexions '$DIR_CONNEXIONS/' && ls -l '$DIR_CONNEXIONS'"
${demarrages:+"$demarrages"}
${sessions:+"$sessions"}
${echecs:+"$echecs"}
${bases:+"$bases"}

# ── le réseau et les journaux ─────────────────────────────────────────
"Réseau : profils, hosts, ssh, baux|true|tar --ignore-failed-read -czvf '$DIR_RESEAU/${TK_PREFIX}_reseau.tar.gz' -C '$MONTAGE' ${PIECES_RESEAU[*]} | tail -n 20"
"Archive de /var/log|true|tar -czf '$DIR_JOURNAUX/${TK_PREFIX}_var_log.tar.gz' -C '$MONTAGE' var/log && ls -lh '$DIR_JOURNAUX'"
${journal:+"$journal"}

# ── ce qui se relance tout seul ───────────────────────────────────────
"Persistance (cron, systemd, rc.local, profile.d…)|true|tar --ignore-failed-read -czvf '$DIR_PERSISTANCE/${TK_PREFIX}_persistance.tar.gz' -C '$MONTAGE' etc/crontab etc/cron.d etc/cron.hourly etc/cron.daily etc/cron.weekly etc/cron.monthly var/spool/cron etc/systemd/system usr/lib/systemd/system etc/rc.local etc/init.d etc/profile etc/profile.d etc/bash.bashrc etc/environment etc/ld.so.preload etc/ld.so.conf.d etc/modules-load.d etc/modprobe.d etc/xdg/autostart etc/rc.d etc/bashrc etc/anacrontab var/spool/anacron var/spool/at etc/udev/rules.d etc/update-motd.d etc/apt/apt.conf.d etc/NetworkManager/dispatcher.d etc/systemd/user usr/local/bin usr/local/sbin | tail -n 20"

# ── la timeline ───────────────────────────────────────────────────────
"Corps de la timeline|true|$corps | tee '$body' | tail -n 10 || { mv -f '$body' '$body.partiel'; false; }"
${corps_imbr:+"$corps_imbr"}
"Timeline mactime|true|echo '$TZ_MACTIME' > '$DIR_TIMELINE/${TK_PREFIX}_fuseau_timeline.txt' && cat $corps_tous | mactime -b - -d -y -z '$TZ_MACTIME' | tee '$csv' | tail -n 10 || { mv -f '$csv' '$csv.partiel'; false; }"

# ── chaque compte ─────────────────────────────────────────────────────
"Dates du dossier de {{compte_libelle}}|true|stat '{{compte}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_stat.txt'"
${sessions_c:+"$sessions_c"}
${echecs_c:+"$echecs_c"}
"Artefacts de {{compte_libelle}}|true|tar --ignore-failed-read -czvf '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_artefacts.tar.gz' -C '{{compte}}' .bash_history .zsh_history .python_history .mysql_history .psql_history .lesshst .wget-hsts .bashrc .profile .bash_logout .viminfo .gitconfig .ssh .gnupg .aws .kube .docker .config .pki .xsession-errors"
"Caches et profils applicatifs de {{compte_libelle}}|true|tar --ignore-failed-read -czf '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_profils.tar.gz' -C '{{compte}}' .local .cache .mozilla .thunderbird snap .var/app && du -h '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_profils.tar.gz'"
"Inventaire du profil de {{compte_libelle}}|true|ls -lRa '{{compte}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_inventaire.txt' | tail -n 10"

# ── le reste ──────────────────────────────────────────────────────────
"Disques virtuels sur le poste|true|find $volumes -xdev \( -iname '*.vmdk' -o -iname '*.vdi' -o -iname '*.ova' -o -iname '*.qcow2' \) | tee '$DIR_MACHINES/${TK_PREFIX}_disques_virtuels.txt'"
${supprimes:+"$supprimes"}
"photorec sur l'espace libre de {{volume_libelle}}|true,ecran|mkdir -p '$pr' && photorec /log /logname '$DIR_LOGS/${TK_PREFIX}_photorec_{{volume_libelle}}.log' /d '$pr/recup_' /cmd '{{volume}}' partition_none,fileopt,everything,enable,freespace,search && du -sh '$pr'"

# Les chaînes du PÉRIPHÉRIQUE, pas des fichiers : c'est tout l'intérêt.
# Un grep sur le montage ne voit que les fichiers vivants ; ici on lit
# les octets, donc aussi ce qui est effacé, le slack de fin de bloc, le
# swap et les zones que photorec ignore faute de signature. C'est la
# pièce qui répond à « cette adresse a-t-elle jamais été sur ce
# disque ? » quand tout le reste a été vidé.
#
# -a lit tout le flux sans se fier au format, -t d donne le décalage en
# octets — de quoi revenir à l'emplacement exact et le citer dans le
# rapport —, -n 8 coupe le bruit binaire des chaînes trop courtes.
# gzip parce que la sortie brute d'un disque se compte en dizaines de
# gigaoctets ; le texte se comprime d'un facteur cinq à dix.
#
# {{volume}} est le périphérique, et la liste est celle de photorec :
# chaque volume monté sous MONTAGE y passe, la racine comme le /home sur
# un autre disque. Aucun n'est oublié parce qu'aucun n'est nommé à la
# main.
"Chaînes lisibles de {{volume_libelle}}|true,ecran|strings -a -t d -n 8 '{{volume}}' | gzip -c > '$st.txt.gz' && du -h '$st.txt.gz'"

# Le .gz est la pièce ; ces quatre-là sont ce que l'analyse lit vraiment : un
# dépouillement qui n'ouvre pas dix gigaoctets, mais qui donne les adresses,
# les comptes de messagerie, les IP et les chemins, comptés — le compte dit à
# lui seul si une chaîne traîne partout ou n'apparaît qu'une fois. Le décalage
# en octets reste en tête de ligne : c'est ce qui permet de citer un
# emplacement précis sans rouvrir le .gz. Voir $extraits_chaines, en section 3.
"Extraits des chaînes de {{volume_libelle}}|true|$extraits_chaines"
)


# ══════════════════════════════════════════════════════════════════════
#  4 · LISTES
# ══════════════════════════════════════════════════════════════════════
#
# Deux listes, trois quand l'image a du xfs et le poste xfs_undelete.
#   compte    lue dans le /etc/passwd de l'image. Valeur : le dossier
#             personnel, préfixé du montage ; étiquette : le login, qui
#             sert aussi de nom de fichier. Quatre étapes, six si l'image
#             a wtmp et btmp, rejouées par compte. Un compte sans dossier
#             sur l'image ne rend rien : il n'y a rien à collecter.
#   volume    les périphériques dressés par definir_commandes — un par
#             périphérique, le sous-volume et le bind n'en font pas un de
#             plus. Valeur : le périphérique ; étiquette : racine, home,
#             var_log… Système de fichiers, photorec et les chaînes
#             lisibles, par volume. C'est cette liste qui garantit qu'un
#             volume monté sous MONTAGE ne peut pas être oublié : rien
#             n'y est nommé à la main.
#   volume_xfs  les mêmes, ceux en xfs : xfs_undelete.

TK_LISTES=("compte|lister_comptes" "volume|lister_volumes"
${supprimes:+"volume_xfs|lister_volumes xfs"})
}


# ══════════════════════════════════════════════════════════════════════
#  5 · FONCTIONS
# ══════════════════════════════════════════════════════════════════════
#
# Lister /home paraissait plus simple, mais un compte logé ailleurs serait
# oublié et lost+found passerait pour un compte : le /etc/passwd de
# l'image, lui, dit la vérité. Une ligne par compte, le dossier en valeur,
# le login en étiquette.
# Le corps de la timeline d'UN volume, et ce qu'il faut installer pour
# l'écrire. Lu sur le PÉRIPHÉRIQUE quand un lecteur existe : dates de
# création comprises, entrées supprimées comprises.
#   lecteur <variable> <périphérique> <point de montage> <préfixe> <type>
# La commande est posée dans la variable nommée. Le préfixe est vide pour
# la racine, « /home » pour un volume monté là : les chemins d'un corps
# disent où le fichier était dans l'arborescence, pas où il est dans son
# volume.
lecteur() {
    local -n sortie="$1"; local dev="$2" mnt="$3" pre="$4" fs="$5" err
    sortie=""
    if [[ "$fs" == ext* ]]; then
        TK_REQUIS+=(fls ils)
        # ils annonce ses colonnes avant ses lignes : cet en-tête n'a rien
        # à faire dans un corps, tail l'écarte.
        sortie="( fls -r -p -m '$pre/' '$dev' && ils -m '$dev' | tail -n +2 )"
    elif [[ "$fs" == xfs ]]; then
        # fsxfsinfo vérifie une copie du superbloc dans CHACUN des
        # groupes d'allocation, et s'arrête à la première qu'il ne trouve
        # pas — alors que le noyau, lui, ne lit jamais que celle du
        # groupe 0. La version du dépôt Ubuntu cherche donc au mauvais
        # endroit dès que les groupes passent 4 Gio (voir l'en-tête), et
        # un simple droit de lecture qui manque produit le même refus.
        # On l'essaie donc, sans -H : c'est l'ouverture qui échoue, pas le
        # parcours, et elle ne coûte que deux lectures par groupe ; son
        # message dit lequel des deux. Ici c'est -H qui déclenche le
        # parcours que -B écrit, et la ligne de version part sur la sortie
        # standard, d'où le grep.
        TK_REQUIS+=(fsxfsinfo)
        if ! command -v fsxfsinfo >/dev/null 2>&1; then
            :   # TK_REQUIS le signalera
        elif err="$(fsxfsinfo "$dev" 2>&1 >/dev/null)"; then
            sortie="fsxfsinfo -H -B /dev/stdout '$dev' | grep '|'"
            [[ -z "$pre" ]] || sortie="$sortie | sed 's#^0|#0|$pre#'"
        else
            err="$(grep -m1 -i 'superblock\|denied' <<<"$err" || printf '%s' "${err%%$'\n'*}")"
            err="${err#*: }"; attention "fsxfsinfo n'ouvre pas $dev — ${err%.}. Ce volume sera lu sur son montage : sans les dates de création ni les entrées supprimées."
        fi
    fi
    # btrfs, xfs refusé, ou tout autre : pas de lecteur, find parcourt le
    # volume monté. Il ignore la date de création — %B@ rend un marqueur
    # non numérique dont mactime se plaint à chaque ligne, d'où le -1 — et
    # ne voit rien des supprimés.
    [[ -n "$sortie" ]] || sortie="( cd '$mnt' && find . -xdev -printf '0|$pre/%P|%i|%M|%U|%G|%s|%A@|%T@|%C@|-1\n' )"
}

# Les volumes de l'image, dressés par definir_commandes : valeur, le
# périphérique ; étiquette, le nom qui sert de dossier et de suffixe.
# Avec un type en argument, ceux de ce type seulement.
lister_volumes() {   # lister_volumes [type]
    local v
    for v in ${VOLUMES[@]+"${VOLUMES[@]}"}; do
        [[ -z "${1:-}" || "$v" == *"	$1" ]] || continue
        v="${v%	*}"; emettre "${v%%	*}" "${v##*	}"
    done
}

lister_comptes() {
    local nom home
    [[ -r "$MONTAGE/etc/passwd" ]] || { printf 'lister_comptes : pas de %s/etc/passwd\n' "$MONTAGE" >&2; return 0; }
    while IFS=: read -r nom _ _ _ _ home _; do
        (( INTERROMPU )) && return 130
        # /?* écarte les comptes logés à la racine — on collecterait le
        # système entier au nom d'un compte de service. Le login vient de
        # la pièce et sert de nom de fichier : il est assaini.
        [[ "$home" == /?* && -d "$MONTAGE$home" ]] && emettre "$MONTAGE$home" "${nom//[!A-Za-z0-9._-]/_}"
    done < "$MONTAGE/etc/passwd"
    return 0
}
