# ══════════════════════════════════════════════════════════════════════
#  COLLECTE DE TRIAGE — poste Linux, image DÉJÀ MONTÉE en lecture seule
# ══════════════════════════════════════════════════════════════════════
#
#     sudo ./tasker.sh -c exemples/collecte-linux.conf \
#          --set MONTAGE=/mnt/investigation --set PERIPH=/dev/loop0p2
#
#     MONTAGE   la racine du système montée en ro : tout se lit là
#     PERIPH    le périphérique qui porte le système de fichiers —
#               ce qu'affiche : findmnt -no SOURCE /mnt/investigation
#
# Montez avant : losetup -r, puis mount -o ro,noatime (xfs au journal sale :
# ajoutez norecovery). Un /home sur un autre volume, monté sous MONTAGE, est
# traité comme la racine.
#
# Aucun outil maison : chaque étape est une commande que vous pouvez retaper à
# la main. Pour exploiter la collecte ensuite, exemples/skills/forensic-linux/
# en tire un rapport daté et sourcé ; voir exemples/skills/README.md.


# ══════════════════════════════════════════════════════════════════════
#  CE QUI EST ÉCRIT — ANALYSE/OS/PROJET/PREFIX/
# ══════════════════════════════════════════════════════════════════════
#
#     SYSTEME/      os-release, hostname, localtime, timezone, fstab, le
#                   système de fichiers par volume, et _installation.tar.gz :
#                   machine-id, adjtime, crypttab, l'horloge de timesync et
#                   les journaux de l'installateur, dont la DATE dans
#                   l'archive donne la pose du système
#     PAQUETS/      la base brute, la liste des paquets avec leur date de
#                   pose, l'historique du gestionnaire, et ce qui s'installe
#                   à côté : snap, flatpak, les dépôts déclarés
#     COMPTES/      passwd, group, _droits.tar.gz (shadow, sudoers, SELinux
#                   ou AppArmor), _domaine.tar.gz (sssd, kerberos, samba, et
#                   le cache sss qui nomme les comptes du domaine), puis par
#                   compte : dates, sessions, échecs, artefacts, profils
#     CONNEXIONS/   wtmp, btmp, lastlog copiés et relus ; wtmp.db et
#                   lastlog2.db (Fedora 40+, Debian 13+) vidés en texte ;
#                   _auth_succes.txt et _auth_echecs.txt, les
#                   authentifications relevées dans TOUS les journaux
#     RESEAU/       _reseau.tar.gz : profils NetworkManager, netplan, ifcfg,
#                   systemd, hosts, ssh, les baux, et le pare-feu
#     PERSISTANCE/  _persistance.tar.gz : cron, systemd, rc.local,
#                   profile.d, ld.so.preload, modules
#     JOURNAUX/     var_log.tar.gz, et le journal systemd exporté en clair
#     TIMELINE/     _mactime.csv, la chronologie de TOUTE l'arborescence, et
#                   les corps dont elle sort, un par provenance : aucune
#                   ligne n'est dans les deux
#     MACHINES/     les disques virtuels trouvés sur le poste
#     SUPPRIMES/    un dossier par volume xfs : ce que xfs_undelete rend aux
#                   inodes libérés, par blocs entiers
#     PHOTOREC/     un dossier par volume : ce que le carving retrouve sans
#                   inode, sans nom ni date, mais à la bonne taille
#     STRINGS/      _strings_<volume>.txt, les chaînes lisibles du
#                   PÉRIPHÉRIQUE (strings nu, non comprimé) — donc aussi
#                   celles des fichiers effacés, du slack et du swap —, plus
#                   cinq extraits triés et comptés : _urls, _courriels, _ip,
#                   _mac, _chemins
#
# Le journal, le rapport, l'état de reprise et les journaux photorec vont
# dans PREFIX/, là où le script est lancé.
#
# Le nom du fichier dit comment il a été écrit : cp -aL, une pièce emportée
# telle quelle ; tar, un lot dont des pièces peuvent manquer ; tee, la sortie
# d'un outil, sous le PREFIX. Toujours -L, c'est le CONTENU qu'on veut :
# aucune étape ne pose de lien dans la sortie, qu'une destination NTFS, exFAT
# ou SMB refuserait. Ce qu'un lien disait est relevé à côté.


# ══════════════════════════════════════════════════════════════════════
#  1 · VARIABLES
# ══════════════════════════════════════════════════════════════════════

MONTAGE=""                     # À FOURNIR : --set MONTAGE=/mnt/investigation
PERIPH=""                      # À FOURNIR : --set PERIPH=/dev/loop0p2

PC="PC07"                      # nom du poste
SALLE="D32"                    # salle
PROJET="PRJ"                   # projet
OS="LINUX"                     # système du poste

ANALYSE="$PWD/ANALYSE"         # racine de sortie
TZ_MACTIME="UTC"               # fuseau de la timeline

TK_OPERATEUR="${SUDO_USER:-${USER:-inconnu}}"

# Ce qu'il faut sur TOUTE image. Le reste s'ajoute plus bas, dans la
# branche qui l'emploie, et n'est réclamé que si l'image le demande.
# Sur Ubuntu 24.04 : apt install rpm sleuthkit testdisk libfsxfs-utils
# ATTENTION au libfsxfs-utils de 22.04 et 24.04 (20201117) : il calcule sur
# 32 bits la taille d'un groupe d'allocation en octets, déborde au-delà de
# 4 Gio par groupe et refuse tout xfs de plus de 16 Gio. Mesuré : 4 Gio
# passe, 4,25 Gio non. 25.10 et 26.04 ont la version corrigée, 20240501 ;
# sur 24.04 on la rétroporte, en vrai paquet que dpkg sait retirer :
#     apt purge libfsxfs-utils
#     apt install build-essential debhelper pkgconf dh-python \
#                 python3-dev python3-setuptools
#     P=http://archive.ubuntu.com/ubuntu/pool/universe/libf/libfsxfs
#     for f in libfsxfs_20240501-1ubuntu3.dsc \
#              libfsxfs_20240501.orig.tar.gz \
#              libfsxfs_20240501-1ubuntu3.debian.tar.xz; do curl -fLO $P/$f; done
#     dpkg-source -x libfsxfs_20240501-1ubuntu3.dsc
#     cd libfsxfs-20240501 && DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -us -uc -b
#     apt install ../libfsxfs1t64_*.deb ../libfsxfs-utils_*.deb
# nocheck écarte le seul test qui échoue, celui du module Python. Sans ce
# rétroportage rien ne casse : l'étape voit le refus et lit la timeline sur
# le montage. xfs_undelete, lui, n'est dans aucun dépôt — un script Tcl, et
# l'étape qui s'en sert n'existe que s'il est là :
#     apt install tcl tcllib
#     curl -L -o /usr/local/bin/xfs_undelete \
#          https://raw.githubusercontent.com/ianka/xfs_undelete/master/xfs_undelete
#     chmod +x /usr/local/bin/xfs_undelete
TK_REQUIS=(findmnt tar find strings gzip tune2fs blkid mactime photorec)


# ══════════════════════════════════════════════════════════════════════
#  2 · CHEMINS ET CONTRÔLES
# ══════════════════════════════════════════════════════════════════════

calculer_variables() {
    TK_PREFIX="${PC}_${SALLE}_${PROJET}_${OS}"
    DEST="$ANALYSE/$OS/$PROJET/$TK_PREFIX"

    TK_SUJET="$PC · $SALLE · $PROJET · $OS"
    TK_DETAILS=("montage=$MONTAGE" "source=$PERIPH" "sortie=$DEST" "fuseau=$TZ_MACTIME")

    DIR_SYSTEME="$DEST/SYSTEME"
    DIR_PAQUETS="$DEST/PAQUETS"
    DIR_COMPTES="$DEST/COMPTES"
    DIR_CONNEXIONS="$DEST/CONNEXIONS"
    DIR_RESEAU="$DEST/RESEAU"
    DIR_PERSISTANCE="$DEST/PERSISTANCE"
    DIR_JOURNAUX="$DEST/JOURNAUX"
    DIR_TIMELINE="$DEST/TIMELINE"
    DIR_MACHINES="$DEST/MACHINES"
    DIR_PHOTOREC="$DEST/PHOTOREC"
    DIR_STRINGS="$DEST/STRINGS"
    DIR_SUPPRIMES="$DEST/SUPPRIMES"

    # Un dossier par collecte, là où le script est lancé : deux passes
    # sur le même poste ne mélangent plus leurs journaux.
    DIR_LOGS="$PWD/$TK_PREFIX"
}

# Un chemin RAMASSÉ SUR L'IMAGE entre dans une commande shell : il faut le
# citer. Les rotations de wtmp sont nommées par le système EXAMINÉ, et
# « wtmp.1';rm -rf /;echo ' » est un nom de fichier légal en ext4. Mesuré :
# la commande construite écrivait hors du scellé, perdait wtmp et btmp, et
# l'étape restait VERTE. Les garde-fous de tasker.sh ne couvrent pas ce
# chemin-là : ils portent sur les --set et les valeurs de listes.
citer() { printf "'%s'" "${1//\'/\'\\\'\'}"; }


verifier() {
    # Les chemins sont posés entre apostrophes dans les commandes : une
    # apostrophe dans l'un d'eux redécouperait la ligne entière.
    case "$DEST$DIR_LOGS$MONTAGE$PERIPH$TZ_MACTIME" in
        *\'*) erreur "apostrophe dans un chemin ou un nom : impossible ici."
             info "renommez le dossier de sortie, ou lancez le script d'ailleurs."
             return 1 ;;
    esac

    [[ -n "$MONTAGE" ]] || { erreur "MONTAGE n'est pas renseigné."
        info "donnez-le : --set MONTAGE=/mnt/investigation"
        return 1; }

    [[ -n "$PERIPH" ]] || { erreur "PERIPH n'est pas renseigné : fls et ils lisent le périphérique, pas le montage."
        info "donnez-le : --set PERIPH=/dev/loop0p2"
        return 1; }

    local opts
    opts="$(findmnt -no OPTIONS "$MONTAGE" 2>/dev/null)" || { erreur "rien n'est monté sur $MONTAGE"
        info "montez l'image d'abord : mount -o ro,noatime <partition> '$MONTAGE' — ou prenez exemples/dd-linux.conf, qui lit l'image sans la monter."
        return 1; }

    # Une pièce montée en écriture s'abîme au premier accès.
    [[ ",$opts," == *",ro,"* ]] || { erreur "$MONTAGE n'est pas monté en lecture seule : $opts"
        info "remontez-le : umount '$MONTAGE' puis mount -o ro,noatime,noexec,nodev …"
        return 1; }

    [[ -b "$PERIPH" ]] || { erreur "pas un périphérique bloc : $PERIPH"
        info "il faut être root, et donner la partition, pas un fichier."
        return 1; }

    # En LVM, findmnt dit /dev/mapper/vg-root et vous /dev/vg/root : le même
    # périphérique, d'où readlink -f. En btrfs il suffixe le sous-volume,
    # /dev/mapper/clair[/root] : on coupe au crochet.
    local src; src="$(findmnt -no SOURCE "$MONTAGE" 2>/dev/null)"; src="${src%%[*}"
    [[ "$(readlink -f "$src")" == "$(readlink -f "$PERIPH")" ]] \
        || attention "$PERIPH n'est pas la source de $MONTAGE : donnez la partition, pas le disque entier."

    # Sans /etc, ce n'est pas la racine d'un système.
    [[ -d "$MONTAGE/etc" ]] || { erreur "pas de $MONTAGE/etc : ce n'est pas la racine d'un système."
        info "en btrfs, montez le sous-volume : mount -o ro,subvol=root … ; sinon vérifiez le chemin."
        return 1; }

    return 0
}


# ══════════════════════════════════════════════════════════════════════
#  3 · COMMANDES
# ══════════════════════════════════════════════════════════════════════
#
# Aucune étape ne porte « continu » : rouge veut dire qu'il s'est passé
# quelque chose — d'où les étapes qui n'existent pas quand l'image n'a pas
# de quoi les nourrir. Ce qui varie est réglé en tête de la fonction, soit
# en fragment interpolé dans une étape qui existe toujours ($fuseau,
# $paquets, $connexions, $corps…), soit en étape entière ou rien ($journal,
# $auth, $bases, $corps_imbr, $supprimes, wtmp et btmp). Le plan (-l) dit
# lesquelles ce cas-ci demande.
#
# À savoir : ce qui relit wtmp ou btmp lit la COPIE, gardez-la avec -o ; les
# étapes longues sont l'export du journal systemd, xfs_undelete et les caches
# d'un compte (300 Mo), passez-les en triage (touche p) ; les tar de LOTS
# portent --ignore-failed-read, pas celui de /var/log ; photorec rend toujours
# 0, même quand il ne fait rien — lisez la liste en fin d'étape.

# Les lignes qui disent une authentification réussie, puis celles qui disent
# un échec — données à awk en expressions ERE, donc sans une barre oblique,
# qui fermerait le littéral, et sans intervalle {n,m}, que mawk ne connaît pas.
# Les deux premières de chaque liste sont les lignes de PAM : elles sont les
# mêmes partout, de Debian à Alpine, et ce sont elles qui rattrapent les
# distributions sans journal texte dédié.
RE_AUTH_OK='session opened for user|New session [0-9]+ of user|Accepted (password|publickey|keyboard-interactive|gssapi-with-mic|hostbased|none) for|USER_(LOGIN|AUTH|START|ACCT).*res=success|LOGIN ON| login on |Successful su for|su: \(to '
RE_AUTH_KO='authentication failure|Failed (password|publickey|keyboard-interactive|hostbased|none) for|USER_(LOGIN|AUTH|ACCT).*res=failed|FAILED LOGIN|FAILED su for|[Ii]nvalid user |[Ii]nvalid password|Login incorrect|incorrect password attempt|maximum authentication attempts exceeded|Connection closed by authenticating user|account temporarily locked'

definir_commandes() {

    # ── Réglé une fois, selon l'image examinée ────────────────────────

    # /etc/localtime est presque toujours un lien, et c'est sa CIBLE qui nomme
    # le fuseau. On la relève en clair : un lien ne se recopie pas sur une
    # destination NTFS ou SMB, un nom de fuseau dans un .txt se lit de partout.
    # Quand ce n'est pas un lien, le pied du TZif porte la règle
    # (CET-1CEST,M3.5.0…) : strings la rend, c'est sa dernière ligne.
    local fuseau="cp -aL '$MONTAGE/etc/localtime' '$DIR_SYSTEME/' && { readlink '$MONTAGE/etc/localtime' || strings '$MONTAGE/etc/localtime' | tail -n 1; } | tee '$DIR_SYSTEME/${TK_PREFIX}_localtime.txt'"
    # /etc/timezone n'existe que sur Debian et dérivés.
    [[ -f "$MONTAGE/etc/timezone" ]] && fuseau="$fuseau && cp -aL '$MONTAGE/etc/timezone' '$DIR_SYSTEME/'"

    # rpm ouvre sa base en écriture même pour lire : on l'interroge dans une
    # COPIE. On cherche le FICHIER de base, et non le dossier — c'est le
    # défaut que ceci corrige. Depuis Fedora 36 et openSUSE 15.5 la base est à
    # usr/lib/sysimage/rpm, var/lib/rpm n'étant plus qu'un lien, parfois mort,
    # parfois un dossier vide laissé par la migration ; et une Debian où rpm
    # n'est qu'un outil a un var/lib/rpm vide lui aussi. Dans tous ces cas
    # « rpm -qa » rend une liste VIDE avec un code 0, et l'étape passait au
    # vert sans un paquet.
    # Le format se lit au fichier présent : rpmdb.sqlite (Fedora 33+, RHEL 9),
    # Packages.db (ndb, openSUSE), Packages (bdb, RHEL 7 et 8). Il n'est PAS
    # imposé par --define : rpm le détecte depuis 4.16, alors qu'un nom de
    # moteur inconnu d'un rpm plus ancien le fait retomber sur une « dummy
    # database » — vide, et sans erreur. L'autre moitié du correctif est à
    # l'étape « Paquets installés » : une liste vide y est une erreur.
    local rpmsrc="" rpmfmt="" f
    for f in usr/lib/sysimage/rpm var/lib/rpm; do
        if   [[ -s "$MONTAGE/$f/rpmdb.sqlite" ]]; then rpmfmt=sqlite
        elif [[ -s "$MONTAGE/$f/Packages.db"  ]]; then rpmfmt=ndb
        elif [[ -s "$MONTAGE/$f/Packages"     ]]; then rpmfmt=bdb
        else continue
        fi
        rpmsrc="$MONTAGE/$f"
        break
    done

    # Arch : un dossier par paquet dans var/lib/pacman/local, sa date de pose
    # dans « desc » (%INSTALLDATE%) ; la liste est celle des dossiers.
    # Alpine : lib/apk/db/installed, en texte.
    # Le DOSSIER ne prouve rien, dans un sens comme dans l'autre : une Fedora
    # où dpkg est installé en simple outil a un var/lib/dpkg dont le status est
    # vide, et dpkg l'emportait alors sur une base RPM pleine. On choisit donc
    # sur le contenu, des quatre côtés.
    local paquets="echo 'ni base dpkg, ni RPM, ni pacman, ni apk sur cette image' >&2; false"
    local paquets_source="aucune base de paquets trouvée"
    if [[ -s "$MONTAGE/var/lib/dpkg/status" ]]; then
        TK_REQUIS+=(dpkg-query)
        paquets_source="base dpkg var/lib/dpkg"
        paquets="cp -aL '$MONTAGE/var/lib/dpkg/status' '$DIR_PAQUETS/${TK_PREFIX}_dpkg_status.txt' && dpkg-query --admindir='$MONTAGE/var/lib/dpkg' -l"
    elif [[ -n "$rpmsrc" ]]; then
        TK_REQUIS+=(rpm)
        local rpmdb="$DIR_PAQUETS/${TK_PREFIX}_rpmdb"
        paquets_source="base RPM ${rpmsrc#"$MONTAGE/"}, format $rpmfmt"
        # rm -rf avant la copie : une reprise sur une base d'un autre format
        # laisserait les deux jeux de fichiers dans le même dossier, et rpm
        # choisirait le mauvais.
        paquets="rm -rf '$rpmdb' && cp -aLT $(citer "$rpmsrc") '$rpmdb' && rpm --dbpath '$rpmdb' -qa --last"
    elif compgen -G "$MONTAGE/var/lib/pacman/local/*/desc" >/dev/null; then
        paquets_source="base pacman var/lib/pacman/local"
        # « desc » suffit ; « files » et « mtree » (déjà gzippé) pèsent cent fois plus
        paquets="tar -czf '$DIR_PAQUETS/${TK_PREFIX}_pacman_local.tar.gz' --exclude='*/files' --exclude='*/mtree' -C '$MONTAGE/var/lib/pacman' local && ls -1 '$MONTAGE/var/lib/pacman/local'"
    elif [[ -s "$MONTAGE/lib/apk/db/installed" ]]; then
        paquets_source="base apk lib/apk/db/installed"
        local apkdb="$DIR_PAQUETS/${TK_PREFIX}_apk_installed.txt"
        paquets="cp -aL '$MONTAGE/lib/apk/db/installed' '$apkdb' && awk -F: '/^P:/{p=\$2} /^V:/{print p\"-\"\$2}' '$apkdb'"
    fi
    local liste_paquets="$DIR_PAQUETS/${TK_PREFIX}_paquets.txt"

    # Les rotations se nomment autrement selon la distribution : wtmp.1 chez
    # Debian, wtmp-20190901 chez RHEL en « dateext ». Un joker les prend
    # toutes, et c'est des mois de sessions. lastlog disparaît (Fedora 40,
    # Debian 13) au profit de lastlog2.db, et wtmp.db (wtmpdb) s'ajoute à
    # wtmp : deux sqlite, copiés puis vidés en texte.
    local db connexions="" dumps=""
    for f in "$MONTAGE"/var/log/wtmp* "$MONTAGE"/var/log/btmp* "$MONTAGE"/var/log/lastlog; do
        [[ -f "$f" ]] && connexions="${connexions:+$connexions }$(citer "$f")"
    done
    for f in var/lib/wtmpdb/wtmp.db var/lib/lastlog/lastlog2.db; do
        [[ -f "$MONTAGE/$f" ]] || continue
        db="${f##*/}"
        connexions="${connexions:+$connexions }$(citer "$MONTAGE/$f")"
        dumps="${dumps:+$dumps && }sqlite3 '$DIR_CONNEXIONS/$db' .dump > '$DIR_CONNEXIONS/${TK_PREFIX}_$db.txt'"
    done
    # Une image sans wtmp, sans btmp, sans lastlog et sans base — Arch, et
    # toute image récente dont systemd n'écrit plus utmp — laissait « cp -aL »
    # SANS SOURCE : l'étape passait au rouge sur une collecte saine. Pas de
    # pièce, pas d'étape.
    local copie=""
    [[ -n "$connexions" ]] &&
        copie="Copie des fichiers de connexion|true|cp -aL $connexions '$DIR_CONNEXIONS/' && ls -l '$DIR_CONNEXIONS'"
    local bases=""
    if [[ -n "$dumps" ]]; then
        TK_REQUIS+=(sqlite3)
        bases="Sessions en base (wtmpdb, lastlog2)|true|$dumps && ls -l '$DIR_CONNEXIONS'"
    fi

    # last et lastb relisent la COPIE. Une image qui n'a que wtmp.db n'a ni
    # l'un ni l'autre : leurs étapes n'existent alors pas.
    local demarrages="" sessions="" sessions_c="" echecs="" echecs_c=""
    if [[ -f "$MONTAGE/var/log/wtmp" ]]; then
        TK_REQUIS+=(last)
        demarrages="Démarrages et arrêts|true|last -F -x -f '$DIR_CONNEXIONS/wtmp' reboot shutdown | tee '$DIR_CONNEXIONS/${TK_PREFIX}_reboots.txt'"
        sessions="Sessions ouvertes|true|last -F -f '$DIR_CONNEXIONS/wtmp' | tee '$DIR_CONNEXIONS/${TK_PREFIX}_sessions.txt' | tail -n 15"
        sessions_c="Sessions de {{compte_libelle}}|true|last -F -f '$DIR_CONNEXIONS/wtmp' '{{compte_libelle}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_sessions.txt'"
    fi
    if [[ -f "$MONTAGE/var/log/btmp" ]]; then
        TK_REQUIS+=(lastb)
        echecs="Échecs d'authentification|true|lastb -F -f '$DIR_CONNEXIONS/btmp' | tee '$DIR_CONNEXIONS/${TK_PREFIX}_echecs.txt' | tail -n 15"
        echecs_c="Échecs d'authentification de {{compte_libelle}}|true|lastb -F -f '$DIR_CONNEXIONS/btmp' '{{compte_libelle}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_echecs.txt'"
    fi

    # Le journal systemd est binaire ; sur Fedora et Arch c'est le SEUL
    # journal. Le glob, et non [[ -d ]] : un dossier de journal vide (journal
    # en RAM) ne donnerait qu'un export vide.
    local journal="" jdir="$MONTAGE/var/log/journal" jtxt="$DIR_JOURNAUX/${TK_PREFIX}_journal.txt"
    if ls "$jdir"/*/*.journal >/dev/null 2>&1; then
        TK_REQUIS+=(journalctl)
        journal="Journal systemd, en clair|true|journalctl -D '$jdir' -o short-iso --no-pager | tee '$jtxt' | wc -l && journalctl -D '$jdir' --verify"
    fi

    # ── succès et échecs d'authentification, sur toutes les distributions ──
    # wtmp et btmp ne suffisent pas ; sur trois familles ils ne disent rien.
    # Où chacune écrit, vérifié :
    #   Debian, Ubuntu   var/log/auth.log ; wtmp et btmp tenus
    #   RHEL, Fedora     var/log/secure quand rsyslog est là — Fedora ne
    #                    l'installe plus, le journal systemd est alors la
    #                    seule source ; auditd écrit var/log/audit/audit.log
    #                    (type=USER_LOGIN, res=success ou res=failed)
    #   openSUSE         var/log/messages et var/log/warn, pas de secure
    #   Arch             journal systemd seul, et wtmp/btmp absents des
    #                    images récentes : rien ne s'en lisait
    #   Alpine           busybox syslogd écrit var/log/messages, et son login
    #                    note « root login on 'tty1' », pas « LOGIN ON »
    # D'où : tout ce que l'image porte, journal exporté compris, mis bout à
    # bout et rangé par un seul passage d'awk.
    local auth_ok="$DIR_CONNEXIONS/${TK_PREFIX}_auth_succes.txt"
    local auth_ko="$DIR_CONNEXIONS/${TK_PREFIX}_auth_echecs.txt"
    # Les lectures sont séparées par « ; » et non par « && » : une rotation
    # tronquée — c'est courant sur un disque saisi — ne doit pas emporter les
    # journaux suivants. Le journal exporté est lu le premier, sans
    # 2>/dev/null : s'il manque parce que l'étape d'avant a été passée, le
    # message part au journal de la collecte plutôt que de se taire.
    local lire="" outil f
    [[ -n "$journal" ]] && lire="cat -- '$jtxt'"
    for f in "$MONTAGE"/var/log/auth.log* "$MONTAGE"/var/log/secure* \
             "$MONTAGE"/var/log/messages* "$MONTAGE"/var/log/warn* \
             "$MONTAGE"/var/log/sulog* "$MONTAGE"/var/log/audit/audit.log*; do
        [[ -f "$f" ]] || continue
        case "$f" in
            *.gz)        outil="zcat -f" ;;
            *.xz|*.lzma) outil=xzcat ;;
            *.bz2)       outil=bzcat ;;
            *.zst)       outil=zstdcat ;;
            *)           outil=cat ;;
        esac
        # réclamé UNE fois, pas une fois par rotation
        [[ "$outil" == cat || " ${TK_REQUIS[*]} " == *" ${outil%% *} "* ]] ||
            TK_REQUIS+=("${outil%% *}")
        lire="${lire:+$lire; }$outil -- $(citer "$f")"
    done
    local auth=""
    if [[ -n "$lire" ]]; then
        # Les deux fichiers sont POSÉS VIDES avant awk : une image sans un seul
        # échec est normale, et « wc -l » sur un fichier absent ferait rougir
        # l'étape entière sous pipefail.
        auth="Authentifications, succès et échecs|true|: > '$auth_ok'; : > '$auth_ko'; { $lire ; } | LC_ALL=C awk '/$RE_AUTH_OK/ { print >> \"$auth_ok\"; next } /$RE_AUTH_KO/ { print >> \"$auth_ko\" }' && wc -l '$auth_ok' '$auth_ko'"
    fi

    # Un volume = un système de fichiers. fls, fsxfsinfo et find -xdev n'en
    # lisent qu'un ; ce qui est monté dessous a le sien. « lecteur », en
    # section 5, choisit de quoi lire UN volume ; la boucle l'appelle pour
    # chacun et dresse au passage VOLUMES, dont vivent les étapes rejouées.
    local corps="" corps_imbr="" imbriques="" volumes="" xfs_present="" vus=" "
    local racine="" m src fs lu rel lib dev lecture
    local body="$DIR_TIMELINE/${TK_PREFIX}_body.mactime"
    local body_imbr="$DIR_TIMELINE/${TK_PREFIX}_body_imbriques.mactime"
    local csv="$DIR_TIMELINE/${TK_PREFIX}_mactime.csv"
    VOLUMES=()
    # -l évite le dessin d'arbre de -R. La première ligne est le montage
    # lui-même : la racine à retirer des chemins.
    while read -r m src fs; do
        lu="$fs"
        if [[ -z "$racine" ]]; then
            racine="$m" src="$PERIPH" rel="" lib="racine"
        else
            # Un [/chemin] après la source dit un sous-arbre — bind, ou
            # sous-volume btrfs. Ce qui est monté là n'est pas le
            # périphérique entier : seul find, sur le montage, voit juste.
            [[ "$src" != *\[* ]] || lu=""
            # Seuls les vrais volumes sont de l'image : un /proc ou un
            # /sys monté là pour un chroot n'y appartient pas.
            src="${src%%[*}"; [[ -b "$src" ]] || continue
            rel="${m#"$racine"}"
            # L'étiquette nomme les pièces du volume : /home donne home,
            # /var/log donne var_log.
            lib="${rel#/}"; lib="${lib//[!A-Za-z0-9._-]/_}"
        fi
        volumes="${volumes:+$volumes }$(citer "$m")"
        [[ "$fs" == xfs ]] && xfs_present=1
        # Un sous-volume btrfs, un bind : deux montages, un seul
        # périphérique. Chaque montage a son corps ; le périphérique, lui,
        # n'est relevé et carvé qu'une fois.
        dev="$(readlink -f -- "$src")"
        [[ "$vus" == *" $dev "* ]] || { vus+="$dev "; VOLUMES+=("$src	$lib	$fs"); }
        lecteur lecture "$src" "$m" "$rel" "$lu"
        if [[ "$m" == "$racine" ]]; then corps="$lecture"
        else imbriques="${imbriques:+$imbriques && }$lecture"; fi
    done < <(findmnt -lR -no TARGET,SOURCE,FSTYPE "$MONTAGE" 2>/dev/null)

    # tee crée le fichier même quand la commande devant lui échoue : un corps
    # dont la lecture a cassé est mis de côté en .partiel — gardé, pas relu —
    # et la timeline, qui ne le trouve plus, passe au rouge.
    local corps_tous="'$body'"
    if [[ -n "$imbriques" ]]; then
        corps_tous="$corps_tous '$body_imbr'"
        corps_imbr="Corps des montages imbriqués|true|( $imbriques ) | tee '$body_imbr' | tail -n 10 || { mv -f '$body_imbr' '$body_imbr.partiel'; false; }"
    fi

    # Les deux outils ne cherchent pas la même chose, d'où les deux étapes.
    # xfs_undelete part des INODES libérés : n'importe quel type de fichier,
    # nommé de sa date de suppression, mais rendu par blocs entiers.
    # photorec ne lit pas le système de fichiers, il reconnaît des
    # SIGNATURES : il ignore ce qu'il ne connaît pas, mais coupe à la bonne
    # taille et retrouve ce dont plus aucun inode ne parle. Mesuré sur la
    # même image xfs : un texte de 1235 o, xfs_undelete le rend (4096 o),
    # photorec ne le voit pas ; un png de 7157 o, xfs_undelete le rend à
    # 8192 o, photorec à 7157 o exacts.
    # « -i "" » retire le filtre par défaut, qui jette tout ce que « file »
    # appelle Binary data. Pas de head après ls -U : il tue ls d'un SIGPIPE,
    # que pipefail remonte en code 141.
    local supprimes="" sup="$DIR_SUPPRIMES/{{volume_xfs_libelle}}" pr="$DIR_PHOTOREC/{{volume_libelle}}"
    local st="$DIR_STRINGS/${TK_PREFIX}_strings_{{volume_libelle}}"

    # Un seul passage d'awk, qui range chaque correspondance dans son fichier
    # au vol. La version d'avant triait tout le flux avec « sort -u » : un tri
    # de dizaines de gigaoctets qui déborde dans $TMPDIR, souvent un tmpfs sur
    # un poste d'analyse. Ici seuls les résultats sont triés.
    # La commande se bâtit en bash, pas dans la chaîne évaluée : une boucle
    # « for » y demanderait quatre niveaux de guillemets imbriqués.
    # Motifs donnés à awk en CHAÎNES, pas en /littéraux/ : « https:// »
    # fermerait le littéral à sa première barre oblique. Pas d'intervalle
    # {n,m} non plus, mawk ne les connaît pas. Et classes NÉGATIVES : une
    # liste positive de caractères se couperait au premier accent.
    local motifs_chaines=(
        "urls|(https?|ftp)://[^[:space:]]+"
        "courriels|[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+[.][A-Za-z][A-Za-z.]+"
        "ip|[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+"
        # Six paires en toutes lettres, faute d'intervalles {n} dans mawk. Une
        # MAC vue ici a été écrite sur ce disque : un point d'accès associé,
        # une machine du réseau local, une interface oubliée.
        "mac|[0-9a-fA-F][0-9a-fA-F]:[0-9a-fA-F][0-9a-fA-F]:[0-9a-fA-F][0-9a-fA-F]:[0-9a-fA-F][0-9a-fA-F]:[0-9a-fA-F][0-9a-fA-F]:[0-9a-fA-F][0-9a-fA-F]"
        "chemins|/(home|root|media|mnt|run/media)/[^[:space:]]+"
    )
    local extraits_chaines="" range="" tri="" pose="" mc genre motif
    for mc in "${motifs_chaines[@]}"; do
        genre="${mc%%|*}"; motif="${mc#*|}"
        # Le fichier brut est POSÉ VIDE avant awk, qui n'y écrit qu'en cas de
        # correspondance. Sans cela, un genre sans aucune trouvaille laissait
        # « sort » sans fichier ; sous « set -o pipefail », que tasker.sh pose,
        # le tube entier échouait, la chaîne de && s'arrêtait là, et TOUS les
        # genres suivants étaient perdus — l'étape passant au rouge. Mesuré sur
        # un disque sans une seule adresse de courriel : « ip », « mac » et
        # « chemins » jamais produits, étape rouge. Or un disque sans courriel
        # n'a rien d'anormal.
        pose="${pose:+$pose }: > '${st}_$genre.brut';"
        # On n'écrit QUE ce qui a été reconnu. Plus de décalage à conserver :
        # strings est appelé sans -t d, et la ligne ne porte donc pas la
        # position de la chaîne sur le volume.
        range="${range:+$range }if (match(\$0, \"$motif\")) print substr(\$0, RSTART, RLENGTH) >> \"${st}_$genre.brut\";"
        # uniq -c sur la ligne entière : sans champ de décalage, deux
        # occurrences d'une même chaîne sont deux lignes identiques.
        tri="${tri:+$tri && }LC_ALL=C sort '${st}_$genre.brut' | uniq -c | LC_ALL=C sort -rn > '${st}_$genre.txt' && rm -f '${st}_$genre.brut'"
    done
    extraits_chaines="rm -f '${st}_'*.brut ; $pose LC_ALL=C awk '{ $range }' '$st.txt' && $tri && wc -l '${st}_'*.txt"
    if [[ -n "$xfs_present" ]] && command -v xfs_undelete >/dev/null 2>&1; then
        supprimes="Fichiers supprimés de {{volume_xfs_libelle}} (xfs_undelete)|true|mkdir -p '$sup' && xfs_undelete -i '' -o '$sup' '{{volume_xfs}}' && ls -U '$sup' | awk 'NR<=20{print} END{print NR, \"fichiers\"}'"
    fi

# ${x:+"$x"} glisse une étape SI la variable est remplie. Les guillemets sont
# à l'intérieur : dehors ils laisseraient un élément vide, que le script
# refuse ; sans eux, la ligne serait redécoupée en mots. L'ordre du tableau
# est l'ordre d'exécution.
# Les chemins que deux archives emportent, un par ligne : ajouter une
# distribution, c'est ajouter une ligne — et tests/matrice.py à côté.
PIECES_PAQUETS=(
    var/log/dpkg.log var/log/dpkg.log.1 var/log/apt                 # Debian, Ubuntu
    etc/apt/sources.list etc/apt/sources.list.d
    var/log/yum.log var/log/dnf.log var/log/dnf.rpm.log var/log/dnf5 # RHEL, Fedora
    var/lib/dnf/history.sqlite usr/lib/sysimage/libdnf5 etc/yum.repos.d
    var/log/zypp/history etc/zypp/repos.d                            # openSUSE
    var/log/pacman.log etc/pacman.conf                               # Arch
    etc/apk/world etc/apk/repositories var/log/apk.log               # Alpine
    var/lib/snapd/state.json var/lib/flatpak/repo/config             # hors gestionnaire
)
PIECES_RESEAU=(
    etc/NetworkManager var/lib/NetworkManager                        # NM : profils, dates
    etc/sysconfig/network-scripts etc/netplan etc/systemd/network etc/network
    etc/wpa_supplicant var/lib/iwd etc/iwd                           # sans fil hors NM
    etc/hosts etc/hosts.allow etc/hosts.deny etc/resolv.conf etc/systemd/resolved.conf
    etc/nsswitch.conf etc/ssh var/lib/dhcp
    etc/firewalld etc/ufw etc/iptables etc/nftables.conf             # pare-feu
    etc/sysconfig/iptables etc/sysconfig/ip6tables etc/sysconfig/nftables.conf
)

TK_COMMANDES=(

# ── le système ────────────────────────────────────────────────────────
"Ce qui est monté|false,log|findmnt -R -no SOURCE,TARGET,FSTYPE,OPTIONS '$MONTAGE'"
"Distribution (/etc/os-release)|true|cp -aL '$MONTAGE/etc/os-release' '$DIR_SYSTEME/' && cat '$DIR_SYSTEME/os-release'"
"Nom de la machine (/etc/hostname)|true|cp -aL '$MONTAGE/etc/hostname' '$DIR_SYSTEME/' && cat '$DIR_SYSTEME/hostname'"
"Fuseau horaire|true|$fuseau && ls -l '$DIR_SYSTEME'"
"Identité et installation (machine-id, journaux d'installation)|true|tar --ignore-failed-read -czvf '$DIR_SYSTEME/${TK_PREFIX}_installation.tar.gz' -C '$MONTAGE' etc/machine-id var/lib/dbus/machine-id etc/adjtime etc/machine-info etc/crypttab var/lib/systemd/timesync/clock var/log/anaconda root/anaconda-ks.cfg root/original-ks.cfg var/log/installer var/log/installer.log | tail -n 20"
"Montages déclarés (/etc/fstab)|true|cp -aL '$MONTAGE/etc/fstab' '$DIR_SYSTEME/' && cat '$DIR_SYSTEME/fstab'"
"Système de fichiers de {{volume_libelle}}|true|( tune2fs -l '{{volume}}' 2>/dev/null || blkid -p '{{volume}}' ) | tee '$DIR_SYSTEME/${TK_PREFIX}_fs_{{volume_libelle}}.txt' | tail -n 20"
"Paquets installés|true|{ $paquets ; } > '$liste_paquets' && { [ -s '$liste_paquets' ] || { echo 'liste de paquets VIDE — $paquets_source' >&2; false; }; } && wc -l < '$liste_paquets' && tail -n 10 '$liste_paquets'"
"Historique des installations (dpkg, apt, dnf, zypper, pacman, apk)|true|tar --ignore-failed-read -czvf '$DIR_PAQUETS/${TK_PREFIX}_historique.tar.gz' -C '$MONTAGE' ${PIECES_PAQUETS[*]} | tail -n 20"

# ── les comptes du système ────────────────────────────────────────────
"Comptes déclarés (/etc/passwd, /etc/group)|true|cp -aL '$MONTAGE/etc/passwd' '$MONTAGE/etc/group' '$DIR_COMPTES/' && cat '$DIR_COMPTES/passwd'"
"Domaine et annuaire (sssd, kerberos, samba, ldap)|true|tar --ignore-failed-read -czvf '$DIR_COMPTES/${TK_PREFIX}_domaine.tar.gz' -C '$MONTAGE' etc/sssd etc/krb5.conf etc/krb5.conf.d etc/krb5.keytab etc/realmd.conf etc/samba etc/ipa etc/openldap etc/ldap.conf etc/nslcd.conf etc/pam_ldap.conf etc/net-snmp var/lib/sss/db var/lib/sss/pubconf var/lib/samba | tail -n 20"
"Droits (shadow, sudoers, login.defs)|true|tar --ignore-failed-read -czvf '$DIR_COMPTES/${TK_PREFIX}_droits.tar.gz' -C '$MONTAGE' etc/shadow etc/gshadow etc/passwd- etc/shadow- etc/group- etc/gshadow- etc/sudoers etc/sudoers.d etc/login.defs etc/security etc/pam.d etc/selinux/config etc/apparmor.d etc/sudoers.dist"

# ── qui s'est connecté ────────────────────────────────────────────────
${copie:+"$copie"}
${demarrages:+"$demarrages"}
${sessions:+"$sessions"}
${echecs:+"$echecs"}
${bases:+"$bases"}

# ── le réseau et les journaux ─────────────────────────────────────────
"Réseau : profils, hosts, ssh, baux|true|tar --ignore-failed-read -czvf '$DIR_RESEAU/${TK_PREFIX}_reseau.tar.gz' -C '$MONTAGE' ${PIECES_RESEAU[*]} | tail -n 20"
"Archive de /var/log|true|tar -czf '$DIR_JOURNAUX/${TK_PREFIX}_var_log.tar.gz' -C '$MONTAGE' var/log && ls -lh '$DIR_JOURNAUX'"
${journal:+"$journal"}
${auth:+"$auth"}

# ── ce qui se relance tout seul ───────────────────────────────────────
"Persistance (cron, systemd, rc.local, profile.d…)|true|tar --ignore-failed-read -czvf '$DIR_PERSISTANCE/${TK_PREFIX}_persistance.tar.gz' -C '$MONTAGE' etc/crontab etc/cron.d etc/cron.hourly etc/cron.daily etc/cron.weekly etc/cron.monthly var/spool/cron etc/systemd/system usr/lib/systemd/system etc/rc.local etc/init.d etc/profile etc/profile.d etc/bash.bashrc etc/environment etc/ld.so.preload etc/ld.so.conf.d etc/modules-load.d etc/modprobe.d etc/xdg/autostart etc/rc.d etc/bashrc etc/anacrontab var/spool/anacron var/spool/at etc/udev/rules.d etc/update-motd.d etc/apt/apt.conf.d etc/NetworkManager/dispatcher.d etc/systemd/user usr/local/bin usr/local/sbin | tail -n 20"

# ── la timeline ───────────────────────────────────────────────────────
"Corps de la timeline|true|$corps | tee '$body' | tail -n 10 || { mv -f '$body' '$body.partiel'; false; }"
${corps_imbr:+"$corps_imbr"}
"Timeline mactime|true|echo '$TZ_MACTIME' > '$DIR_TIMELINE/${TK_PREFIX}_fuseau_timeline.txt' && cat $corps_tous | mactime -b - -d -y -z '$TZ_MACTIME' | tee '$csv' | tail -n 10 || { mv -f '$csv' '$csv.partiel'; false; }"

# ── chaque compte ─────────────────────────────────────────────────────
"Dates du dossier de {{compte_libelle}}|true|stat '{{compte}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_stat.txt'"
${sessions_c:+"$sessions_c"}
${echecs_c:+"$echecs_c"}
"Artefacts de {{compte_libelle}}|true|tar --ignore-failed-read -czvf '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_artefacts.tar.gz' -C '{{compte}}' .bash_history .zsh_history .python_history .mysql_history .psql_history .lesshst .wget-hsts .bashrc .profile .bash_logout .viminfo .gitconfig .ssh .gnupg .aws .kube .docker .config .pki .xsession-errors"
"Caches et profils applicatifs de {{compte_libelle}}|true|tar --ignore-failed-read -czf '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_profils.tar.gz' -C '{{compte}}' .local .cache .mozilla .thunderbird snap .var/app && du -h '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_profils.tar.gz'"
"Inventaire du profil de {{compte_libelle}}|true|ls -lRa '{{compte}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_inventaire.txt' | tail -n 10"

# ── le reste ──────────────────────────────────────────────────────────
"Disques virtuels sur le poste|true|find $volumes -xdev \( -iname '*.vmdk' -o -iname '*.vdi' -o -iname '*.ova' -o -iname '*.qcow2' \) | tee '$DIR_MACHINES/${TK_PREFIX}_disques_virtuels.txt'"
${supprimes:+"$supprimes"}
"photorec sur l'espace libre de {{volume_libelle}}|true,ecran|mkdir -p '$pr' && photorec /log /logname '$DIR_LOGS/${TK_PREFIX}_photorec_{{volume_libelle}}.log' /d '$pr/recup_' /cmd '{{volume}}' partition_none,fileopt,everything,enable,freespace,search && du -sh '$pr'"

# Les chaînes du PÉRIPHÉRIQUE, pas des fichiers : on lit les octets, donc
# aussi ce qui est effacé, le slack et le swap. strings NU, sans une option.
# Ce que cela coûte : aucun décalage en octets, la longueur minimale au
# défaut de 4 caractères donc plus de bruit, et pas de compression — des
# dizaines de gigaoctets, prévoyez la place.
"Chaînes lisibles de {{volume_libelle}}|true,ecran|strings '{{volume}}' > '$st.txt' && du -h '$st.txt'"

# Le .txt est la pièce ; ces cinq extraits sont ce que l'analyse lit vraiment
# sans ouvrir dix gigaoctets : adresses, courriels, IP, MAC et chemins,
# comptés — le compte dit à lui seul si une chaîne traîne partout ou
# n'apparaît qu'une fois. Voir $extraits_chaines, en section 3.
"Extraits des chaînes de {{volume_libelle}}|true|$extraits_chaines"
)


# ══════════════════════════════════════════════════════════════════════
#  4 · LISTES
# ══════════════════════════════════════════════════════════════════════
#
# Deux listes, trois quand l'image a du xfs et le poste xfs_undelete.
#   compte      lue dans le /etc/passwd de l'image : le dossier personnel en
#               valeur, le login en étiquette. Sans dossier sur l'image, ou
#               sans interpréteur de session, le compte n'y entre pas.
#   volume      les périphériques dressés par definir_commandes ; c'est cette
#               liste qui garantit qu'aucun volume monté sous MONTAGE n'est
#               oublié, rien n'y étant nommé à la main.
#   volume_xfs  les mêmes, ceux en xfs : xfs_undelete.

TK_LISTES=("compte|lister_comptes" "volume|lister_volumes"
${supprimes:+"volume_xfs|lister_volumes xfs"})
}


# ══════════════════════════════════════════════════════════════════════
#  5 · FONCTIONS
# ══════════════════════════════════════════════════════════════════════
#
# Lister /home paraissait plus simple, mais un compte logé ailleurs serait
# oublié et lost+found passerait pour un compte : le /etc/passwd de l'image
# dit la vérité.
# Le corps de la timeline d'UN volume, lu sur le PÉRIPHÉRIQUE quand un
# lecteur existe : dates de création et entrées supprimées comprises.
#   lecteur <variable> <périphérique> <point de montage> <préfixe> <type>
# Le préfixe est vide pour la racine, « /home » pour un volume monté là :
# les chemins d'un corps disent où le fichier était dans l'arborescence.
lecteur() {
    local -n sortie="$1"; local dev="$2" mnt="$3" pre="$4" fs="$5" err
    sortie=""
    if [[ "$fs" == ext* ]]; then
        TK_REQUIS+=(fls ils)
        # ils annonce ses colonnes avant ses lignes : cet en-tête n'a rien
        # à faire dans un corps, tail l'écarte.
        sortie="( fls -r -p -m '$pre/' '$dev' && ils -m '$dev' | tail -n +2 )"
    elif [[ "$fs" == xfs ]]; then
        # fsxfsinfo vérifie une copie du superbloc dans CHACUN des groupes
        # d'allocation et s'arrête à la première manquante, là où le noyau ne
        # lit que celle du groupe 0 : la version du dépôt Ubuntu cherche au
        # mauvais endroit dès 4 Gio par groupe (voir l'en-tête), et un droit
        # de lecture qui manque donne le même refus. On l'essaie donc sans -H,
        # deux lectures par groupe, et son message dit lequel des deux.
        TK_REQUIS+=(fsxfsinfo)
        if ! command -v fsxfsinfo >/dev/null 2>&1; then
            :   # TK_REQUIS le signalera
        elif err="$(fsxfsinfo "$dev" 2>&1 >/dev/null)"; then
            sortie="fsxfsinfo -H -B /dev/stdout '$dev' | grep '|'"
            [[ -z "$pre" ]] || sortie="$sortie | sed 's#^0|#0|$pre#'"
        else
            err="$(grep -m1 -i 'superblock\|denied' <<<"$err" || printf '%s' "${err%%$'\n'*}")"
            err="${err#*: }"; attention "fsxfsinfo n'ouvre pas $dev — ${err%.}. Ce volume sera lu sur son montage : sans les dates de création ni les entrées supprimées."
        fi
    fi
    # btrfs, xfs refusé, ou tout autre : pas de lecteur, find parcourt le
    # volume monté. Il ignore la date de création — %B@ rend un marqueur
    # non numérique dont mactime se plaint à chaque ligne, d'où le -1 — et
    # ne voit rien des supprimés.
    [[ -n "$sortie" ]] || sortie="( cd '$mnt' && find . -xdev -printf '0|$pre/%P|%i|%M|%U|%G|%s|%A@|%T@|%C@|-1\n' )"
}

# Les volumes de l'image, dressés par definir_commandes : valeur, le
# périphérique ; étiquette, le nom qui sert de dossier et de suffixe.
# Avec un type en argument, ceux de ce type seulement.
lister_volumes() {   # lister_volumes [type]
    local v
    for v in ${VOLUMES[@]+"${VOLUMES[@]}"}; do
        [[ -z "${1:-}" || "$v" == *"	$1" ]] || continue
        v="${v%	*}"; emettre "${v%%	*}" "${v##*	}"
    done
}

# Les interpréteurs qui refusent d'ouvrir une session. nologin n'est pas le
# seul et son chemin change — /sbin, /usr/sbin, /usr/bin — d'où un test sur
# le seul NOM : Debian pose /usr/sbin/nologin, /bin/false et /bin/sync ;
# openSUSE et Alpine, /bin/false sur la plupart des comptes de service ;
# RHEL, /sbin/nologin ; Arch, /usr/bin/nologin. /dev/null et /nonexistent se
# rencontrent aussi. Un champ VIDE n'est pas un refus : login lance alors
# /bin/sh, et le compte reste dans la liste.
SHELLS_SANS_SESSION="nologin false sync shutdown halt true null nonexistent"

lister_comptes() {
    local nom home shell ecartes=""
    [[ -r "$MONTAGE/etc/passwd" ]] || { printf 'lister_comptes : pas de %s/etc/passwd\n' "$MONTAGE" >&2; return 0; }
    while IFS=: read -r nom _ _ _ _ home shell; do
        (( INTERROMPU )) && return 130
        # /?* écarte les comptes logés à la racine — on collecterait le
        # système entier au nom d'un compte de service. Le login vient de
        # la pièce et sert de nom de fichier : il est assaini.
        [[ "$home" == /?* && -d "$MONTAGE$home" ]] || continue
        if [[ " $SHELLS_SANS_SESSION " == *" ${shell##*/} "* ]]; then
            ecartes="${ecartes:+$ecartes }$nom($shell)"
            continue
        fi
        emettre "$MONTAGE$home" "${nom//[!A-Za-z0-9._-]/_}"
    done < "$MONTAGE/etc/passwd"
    # Écarter sans le dire, ce serait perdre la trace de ce qui n'a pas été
    # collecté : la ligne part au journal de la collecte.
    [[ -n "$ecartes" ]] && printf 'lister_comptes : sans session, écartés — %s\n' "$ecartes" >&2
    return 0
}
