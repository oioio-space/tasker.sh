# ══════════════════════════════════════════════════════════════════════
#  COLLECTE DE TRIAGE — poste Linux, image DÉJÀ MONTÉE en lecture seule
# ══════════════════════════════════════════════════════════════════════
#
#     sudo ./tasker.sh -c exemples/collecte-linux.conf \
#          --set MONTAGE=/mnt/investigation --set PERIPH=/dev/loop0p2
#
#     MONTAGE   la racine du système montée en ro : tout se lit là
#     PERIPH    le périphérique qui porte le système de fichiers —
#               ce qu'affiche : findmnt -no SOURCE /mnt/investigation
#
# Que des commandes ordinaires : cp, cat, ls, tar, find, last. Chaque
# ligne du tableau est une étape ; modifiez-la, ajoutez-en, retirez-en.


# ══════════════════════════════════════════════════════════════════════
#  MÉMO — MONTER L'IMAGE
# ══════════════════════════════════════════════════════════════════════
#
# L'image est un fichier ; losetup en fait un disque, mount en fait un
# dossier. La protection tient au -r de losetup : rien en dessous ne
# peut écrire sur la pièce.
#
#     losetup -P -r -f --show image.dd        -> /dev/loop0
#     lsblk -f /dev/loop0                     l'arbre, les types, les UUID
#
# La colonne FSTYPE de lsblk dit quel cas s'applique :
#
#   ext4, xfs, btrfs — un système de fichiers, montez-le
#     mount -o ro /dev/loop0p2 /mnt/investigation
#     PERIPH=/dev/loop0p2
#
#   LVM2_member — un réservoir qui contient plusieurs volumes
#     vgscan ; vgchange -ay nom_du_groupe ; lvs
#     mount -o ro /dev/nom_du_groupe/root /mnt/investigation
#     PERIPH=/dev/nom_du_groupe/root
#
#   crypto_LUKS — chiffré, il faut la phrase de passe
#     cryptsetup open --readonly /dev/loop0p3 clair    -> /dev/mapper/clair
#     mount -o ro /dev/mapper/clair /mnt/investigation
#     PERIPH=/dev/mapper/clair
#
#   LUKS puis LVM — Ubuntu ou Fedora chiffrée : on déchiffre, du LVM apparaît
#     cryptsetup open --readonly /dev/loop0p3 clair
#     vgchange -ay nom_du_groupe
#     mount -o ro /dev/nom_du_groupe/root /mnt/investigation
#     PERIPH=/dev/nom_du_groupe/root
#
# Défaire, dans l'ordre inverse :
#     umount /mnt/investigation
#     vgchange -an nom_du_groupe          (si LVM)
#     cryptsetup close clair              (si LUKS)
#     losetup -d /dev/loop0
#
# Si losetup -P ne crée pas les p1, p2… (conteneur, noyau sans scan) :
#     fdisk -l image.dd                   colonne Start, en secteurs
#     losetup -r -o $((2048*512)) -f --show image.dd
#
# Options de mount utiles : ro (rien n'est écrit), noatime (lire ne
# change pas les dates), noexec, nodev (rien ne s'exécute depuis la pièce).


# ══════════════════════════════════════════════════════════════════════
#  CE QUI EST ÉCRIT — ANALYSE/OS/SALLE/PREFIX/
# ══════════════════════════════════════════════════════════════════════
#
#     SYSTEME/      os-release, hostname, localtime, timezone, fstab,
#                   PREFIX_fs.txt
#     PAQUETS/      la base brute, plus la liste des paquets
#     COMPTES/      passwd, group, PREFIX_droits.tar.gz (shadow, sudoers…)
#                   puis, par compte : dates, sessions, artefacts, inventaire
#     CONNEXIONS/   wtmp, btmp et lastlog copiés ; wtmp et btmp relus
#     RESEAU/       les profils sous leur chemin d'origine,
#                   PREFIX_reseau.tar.gz (hosts, resolv.conf, ssh)
#     PERSISTANCE/  PREFIX_persistance.tar.gz (cron, systemd, rc.local,
#                   profile.d, ld.so.preload, modules)
#     JOURNAUX/     var_log.tar.gz — avec le journal systemd, à lire par :
#                   journalctl -D <extrait>/var/log/journal -o short-iso
#     TIMELINE/     PREFIX_body.mactime, PREFIX_mactime.csv
#     MACHINES/     les disques virtuels trouvés sur le poste
#     PHOTOREC/     recup_*/
#
# À côté du dossier : PREFIX_manifeste.sha256, une empreinte par fichier,
# à vérifier plus tard par sha256sum -c. Le journal, le rapport et l'état
# de reprise restent là où le script est lancé.
#
# Le nom du fichier dit comment il a été écrit :
#     cp -a    une pièce emportée telle quelle, avec ses dates, sous son
#              nom d'origine — os-release, fstab, wtmp
#     tar      un lot de pièces, dont certaines peuvent manquer —
#              PREFIX_droits.tar.gz ; -v affiche ce qui est entré
#     tee      la sortie d'un outil, sous le PREFIX — PREFIX_fs.txt
# cp -aL (avec L) quand c'est le contenu qu'on veut : /etc/os-release
# est un lien sur la plupart des distributions. cp -a sans L pour
# /etc/localtime : là, c'est le lien lui-même qui nomme le fuseau.


# ══════════════════════════════════════════════════════════════════════
#  1 · VARIABLES
# ══════════════════════════════════════════════════════════════════════

MONTAGE=""                     # À FOURNIR : --set MONTAGE=/mnt/investigation
PERIPH=""                      # À FOURNIR : --set PERIPH=/dev/loop0p2

PC="PC07"                      # nom du poste
SALLE="D32"                    # salle
PROJET="PRJ"                   # projet
OS="LINUX"                     # système du poste

ANALYSE="$PWD/ANALYSE"         # racine de sortie
TZ_MACTIME="UTC"               # fuseau de la timeline

TK_OPERATEUR="${SUDO_USER:-${USER:-inconnu}}"

# Ce que le script d'origine n'utilisait pas vient d'util-linux (findmnt,
# blkid), de coreutils (sha256sum, sort, readlink) ou de findutils : tous
# sur tous les Linux. tune2fs, dpkg-query et rpm ne sont pas requis :
# chacun ne sert que sur certaines images, et il est choisi plus bas.
TK_REQUIS=(findmnt blkid last lastb tar find fls ils mactime testdisk photorec sha256sum)


# ══════════════════════════════════════════════════════════════════════
#  2 · CHEMINS ET CONTRÔLES
# ══════════════════════════════════════════════════════════════════════

calculer_variables() {
    TK_PREFIX="${PC}_${SALLE}_${PROJET}_${OS}"
    DEST="$ANALYSE/$OS/$SALLE/$TK_PREFIX"
    A_COTE="$ANALYSE/$OS/$SALLE"          # le manifeste, à côté du dossier

    TK_SUJET="$PC · $SALLE · $PROJET · $OS"
    TK_DETAILS=("montage=$MONTAGE" "source=$PERIPH" "sortie=$DEST" "fuseau=$TZ_MACTIME")

    DIR_SYSTEME="$DEST/SYSTEME"
    DIR_PAQUETS="$DEST/PAQUETS"
    DIR_COMPTES="$DEST/COMPTES"
    DIR_CONNEXIONS="$DEST/CONNEXIONS"
    DIR_RESEAU="$DEST/RESEAU"
    DIR_PERSISTANCE="$DEST/PERSISTANCE"
    DIR_JOURNAUX="$DEST/JOURNAUX"
    DIR_TIMELINE="$DEST/TIMELINE"
    DIR_MACHINES="$DEST/MACHINES"
    DIR_PHOTOREC="$DEST/PHOTOREC"

    DIR_LOGS="$PWD"     # journal, rapport, état : là où le script est lancé
}

verifier() {
    [[ -n "$MONTAGE" ]] || { erreur "MONTAGE n'est pas renseigné."
        info "donnez-le : --set MONTAGE=/mnt/investigation   (le mémo est en tête de ce fichier)"
        return 1; }

    [[ -n "$PERIPH" ]] || { erreur "PERIPH n'est pas renseigné : fls et ils lisent le périphérique, pas le montage."
        info "donnez-le : --set PERIPH=/dev/loop0p2"
        return 1; }

    local opts
    opts="$(findmnt -no OPTIONS "$MONTAGE" 2>/dev/null)" || { erreur "rien n'est monté sur $MONTAGE"
        info "montez l'image d'abord (mémo en tête), ou prenez exemples/dd-linux.conf : il lit l'image sans la monter."
        return 1; }

    # Une pièce montée en écriture s'abîme au premier accès.
    [[ ",$opts," == *",ro,"* ]] || { erreur "$MONTAGE n'est pas monté en lecture seule : $opts"
        info "remontez-le : umount '$MONTAGE' puis mount -o ro,noatime,noexec,nodev …"
        return 1; }

    [[ -b "$PERIPH" ]] || { erreur "pas un périphérique bloc : $PERIPH"
        info "il faut être root, et donner la partition, pas un fichier."
        return 1; }

    # readlink -f : en LVM, findmnt dit /dev/mapper/vg-root et vous
    # /dev/vg/root — le même périphérique sous deux noms.
    [[ "$(readlink -f "$(findmnt -no SOURCE "$MONTAGE" 2>/dev/null)")" == "$(readlink -f "$PERIPH")" ]] \
        || attention "$PERIPH n'est pas la source de $MONTAGE : donnez la partition, pas le disque entier."

    [[ -d "$MONTAGE/etc" ]] || attention "pas de $MONTAGE/etc : la racine du système est-elle bien là ?"

    return 0
}


# ══════════════════════════════════════════════════════════════════════
#  3 · COMMANDES
# ══════════════════════════════════════════════════════════════════════
#
# Aucune étape ne porte « continu » : rouge veut dire qu'il s'est passé
# quelque chose. Ce qui varie selon la machine est réglé une fois, en
# tête de la fonction ; le plan (-l) montre la commande retenue.
#
# À savoir :
#   · wtmp et btmp sont copiés à l'étape 10 puis relus dans la copie ;
#     les étapes 11 à 13 et 21 à 22 en dépendent — avec -o, gardez la 10.
#   · les tar portent --ignore-failed-read : une pièce absente du lot est
#     signalée au journal, pas une erreur. Toutes les distributions n'ont
#     pas /etc/cron.d ni /etc/sudoers.d.
#   · photorec rend toujours 0, même avec un mauvais numéro de partition :
#     lisez la liste des fichiers en fin d'étape, et son journal.
#   · le manifeste est écrit à CÔTÉ du dossier, pas dedans : il ne se
#     hache pas lui-même. Le script d'origine archivait puis effaçait le
#     dossier ; ici on livre le dossier tel quel.

definir_commandes() {

    # ── Réglé une fois, selon la machine examinée ─────────────────────

    # /etc/timezone n'existe que sur Debian et dérivés
    local fuseau="cp -a '$MONTAGE/etc/localtime' '$DIR_SYSTEME/'"
    [[ -f "$MONTAGE/etc/timezone" ]] && fuseau="$fuseau && cp -aL '$MONTAGE/etc/timezone' '$DIR_SYSTEME/'"

    # dpkg ou rpm, jamais les deux ; la base brute est copiée AVANT d'être
    # interrogée — si l'outil manque sur le poste d'analyse, la pièce est
    # quand même emportée
    local paquets="echo 'ni base dpkg ni base RPM sur cette image'"
    [[ -d "$MONTAGE/var/lib/dpkg" ]] && paquets="cp -a '$MONTAGE/var/lib/dpkg/status' '$DIR_PAQUETS/${TK_PREFIX}_dpkg_status.txt' && dpkg-query --admindir='$MONTAGE/var/lib/dpkg' -l"
    [[ -d "$MONTAGE/var/lib/rpm"  ]] && paquets="cp -a '$MONTAGE/var/lib/rpm' '$DIR_PAQUETS/${TK_PREFIX}_rpmdb' && rpm --dbpath '$MONTAGE/var/lib/rpm' -qa"

    # tune2fs et la Sleuth Kit (fls, ils) ne lisent que l'ext — et voient
    # alors les fichiers supprimés. Ailleurs (xfs sur RedHat, btrfs sur
    # Fedora) : blkid pour l'identité, et find parcourt le montage en
    # écrivant chaque fichier au format que mactime lit —
    # MD5|nom|inode|mode|uid|gid|taille|atime|mtime|ctime|crtime.
    # La date de création vaut -1 : find ne la connaît pas partout, et
    # pour 0 mactime écrirait une ligne vide « Xxx Xxx 00 0000 » par fichier.
    local fsinfo="blkid -p '$PERIPH'"
    local corps="( cd '$MONTAGE' && find . -printf '0|%p|%i|%M|%U|%G|%s|%A@|%T@|%C@|-1\\n' )"
    case "$(findmnt -no FSTYPE "$MONTAGE" 2>/dev/null)" in
        ext*)   fsinfo="tune2fs -l '$PERIPH'"; corps="( fls -r -p -m / '$PERIPH' && ils -m '$PERIPH' )" ;;
    esac

TK_COMMANDES=(

# ── le système ────────────────────────────────────────────────────────
"Ce qui est monté|false,log|findmnt -no SOURCE,TARGET,FSTYPE,OPTIONS '$MONTAGE'"
"Distribution (/etc/os-release)|true|cp -aL '$MONTAGE/etc/os-release' '$DIR_SYSTEME/' && cat '$DIR_SYSTEME/os-release'"
"Nom de la machine (/etc/hostname)|true|cp -aL '$MONTAGE/etc/hostname' '$DIR_SYSTEME/' && cat '$DIR_SYSTEME/hostname'"
"Fuseau horaire|true|$fuseau && ls -l '$DIR_SYSTEME'"
"Montages déclarés (/etc/fstab)|true|cp -aL '$MONTAGE/etc/fstab' '$DIR_SYSTEME/' && cat '$DIR_SYSTEME/fstab'"
"Système de fichiers|true|$fsinfo | tee '$DIR_SYSTEME/${TK_PREFIX}_fs.txt' | tail -n 20"
"Paquets installés|true|$paquets | tee '$DIR_PAQUETS/${TK_PREFIX}_paquets.txt' | tail -n 10"

# ── les comptes du système ────────────────────────────────────────────
"Comptes déclarés (/etc/passwd, /etc/group)|true|cp -aL '$MONTAGE/etc/passwd' '$MONTAGE/etc/group' '$DIR_COMPTES/' && cat '$DIR_COMPTES/passwd'"
"Droits (shadow, sudoers, login.defs)|true|tar --ignore-failed-read -czvf '$DIR_COMPTES/${TK_PREFIX}_droits.tar.gz' -C '$MONTAGE' etc/shadow etc/gshadow etc/sudoers etc/sudoers.d etc/login.defs etc/security"

# ── qui s'est connecté ────────────────────────────────────────────────
"Copie de wtmp, btmp et lastlog|true|cp -a '$MONTAGE/var/log/wtmp' '$MONTAGE/var/log/btmp' '$MONTAGE/var/log/lastlog' '$DIR_CONNEXIONS/' && ls -l '$DIR_CONNEXIONS'"
"Démarrages de la machine|true|last -F -f '$DIR_CONNEXIONS/wtmp' reboot | tee '$DIR_CONNEXIONS/${TK_PREFIX}_reboots.txt'"
"Sessions ouvertes|true|last -F -f '$DIR_CONNEXIONS/wtmp' | tee '$DIR_CONNEXIONS/${TK_PREFIX}_sessions.txt' | tail -n 15"
"Échecs d'authentification|true|lastb -F -f '$DIR_CONNEXIONS/btmp' | tee '$DIR_CONNEXIONS/${TK_PREFIX}_echecs.txt' | tail -n 15"

# ── le réseau et les journaux ─────────────────────────────────────────
"Profil réseau {{profil_libelle}}|true|cp -aL --parents '{{profil}}' '$DIR_RESEAU/' && cat '$DIR_RESEAU/{{profil}}'"
"Réseau : hosts, resolv.conf, ssh|true|tar --ignore-failed-read -czvf '$DIR_RESEAU/${TK_PREFIX}_reseau.tar.gz' -C '$MONTAGE' etc/hosts etc/hosts.allow etc/hosts.deny etc/resolv.conf etc/nsswitch.conf etc/ssh"
"Archive de /var/log|true|tar -czf '$DIR_JOURNAUX/${TK_PREFIX}_var_log.tar.gz' -C '$MONTAGE' var/log && ls -lh '$DIR_JOURNAUX'"

# ── ce qui se relance tout seul ───────────────────────────────────────
"Persistance (cron, systemd, rc.local, profile.d…)|true|tar --ignore-failed-read -czvf '$DIR_PERSISTANCE/${TK_PREFIX}_persistance.tar.gz' -C '$MONTAGE' etc/crontab etc/cron.d etc/cron.hourly etc/cron.daily etc/cron.weekly etc/cron.monthly var/spool/cron etc/systemd/system usr/lib/systemd/system etc/rc.local etc/init.d etc/profile etc/profile.d etc/bash.bashrc etc/environment etc/ld.so.preload etc/modules-load.d etc/modprobe.d etc/xdg/autostart | tail -n 20"

# ── la timeline ───────────────────────────────────────────────────────
"Corps de la timeline|true|$corps | tee '$DIR_TIMELINE/${TK_PREFIX}_body.mactime' | tail -n 10"
"Timeline mactime|true|mactime -b '$DIR_TIMELINE/${TK_PREFIX}_body.mactime' -d -z '$TZ_MACTIME' | tee '$DIR_TIMELINE/${TK_PREFIX}_mactime.csv' | tail -n 10"

# ── chaque compte ─────────────────────────────────────────────────────
"Dates du dossier de {{compte_libelle}}|true|stat '{{compte}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_stat.txt'"
"Sessions de {{compte_libelle}}|true|last -F -f '$DIR_CONNEXIONS/wtmp' '{{compte_libelle}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_sessions.txt'"
"Échecs d'authentification de {{compte_libelle}}|true|lastb -F -f '$DIR_CONNEXIONS/btmp' '{{compte_libelle}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_echecs.txt'"
"Artefacts de {{compte_libelle}}|true|tar --ignore-failed-read -czvf '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_artefacts.tar.gz' -C '{{compte}}' .bash_history .zsh_history .python_history .lesshst .wget-hsts .bashrc .profile .bash_logout .viminfo .gitconfig .ssh .gnupg .aws .kube .docker .config .local .mozilla .thunderbird .cache .pki .xsession-errors"
"Inventaire du profil de {{compte_libelle}}|true|ls -lRa '{{compte}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_inventaire.txt' | tail -n 10"

# ── le reste ──────────────────────────────────────────────────────────
"Disques virtuels sur le poste|true|find '$MONTAGE' -iname '*.vmdk' -o -iname '*.vdi' -o -iname '*.ova' -o -iname '*.qcow2' | tee '$DIR_MACHINES/${TK_PREFIX}_disques_virtuels.txt'"
"Partitions pour photorec (testdisk)|false,log|testdisk /list '$PERIPH'"
"photorec sur la partition [[partition]]|true|photorec /log /logname '$DIR_LOGS/${TK_PREFIX}_photorec.log' /d '$DIR_PHOTOREC/recup_' /cmd '$PERIPH' '[[partition]]',fileopt,everything,enable,freespace,search && ls -lR '$DIR_PHOTOREC' | tail -n 20"

# ── le manifeste ──────────────────────────────────────────────────────
"Manifeste : une empreinte par fichier|true|( cd '$A_COTE' && find '$TK_PREFIX' -type f -exec sha256sum {} + ) | sort -k 2 | tee '$A_COTE/${TK_PREFIX}_manifeste.sha256' | tail -n 5"
)


# ══════════════════════════════════════════════════════════════════════
#  4 · LISTES
# ══════════════════════════════════════════════════════════════════════
#
# Une liste rend des lignes « valeur<TAB>étiquette ». Chaque étape qui
# contient {{nom}} est rejouée une fois par valeur : {{nom}} y devient
# la valeur, {{nom_libelle}} l'étiquette.
#
# profil   les fichiers des cinq dossiers où les distributions rangent
#          leur réseau. Valeur = chemin complet, étiquette = nom du
#          fichier. Un dossier absent ne rend rien, ce n'est pas une
#          erreur. Rejoue 1 étape (14) par profil trouvé.
#          Le cp --parents recrée le chemin d'origine sous RESEAU/ :
#          deux profils de même nom ne s'écrasent pas.
#
# compte   les dossiers de /home, plus /root qui n'y habite pas.
#          Valeur = chemin du profil, étiquette = nom du compte, qui
#          sert aussi de nom de fichier — tel quel, « o'brien_stat.txt ».
#          Rejoue 5 étapes (20 à 24) par compte.

TK_LISTES=(

"profil|lister_fichiers '$MONTAGE/etc/NetworkManager/system-connections'
        lister_fichiers '$MONTAGE/etc/sysconfig/network-scripts' 'ifcfg-*'
        lister_fichiers '$MONTAGE/etc/netplan'
        lister_fichiers '$MONTAGE/etc/systemd/network'
        lister_si_present '$MONTAGE/etc/network/interfaces'"

"compte|lister_dossiers '$MONTAGE/home'
        lister_si_present '$MONTAGE/root'"
)
}
