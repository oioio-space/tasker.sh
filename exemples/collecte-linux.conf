# ══════════════════════════════════════════════════════════════════════
#  COLLECTE DE TRIAGE — poste Linux, image DÉJÀ MONTÉE en lecture seule
# ══════════════════════════════════════════════════════════════════════
#
#     sudo ./tasker.sh -c exemples/collecte-linux.conf \
#          --set MONTAGE=/mnt/investigation --set PERIPH=/dev/loop0p2
#
#     MONTAGE   la racine du système montée en ro : tout se lit là
#     PERIPH    le périphérique qui porte le système de fichiers —
#               ce qu'affiche : findmnt -no SOURCE /mnt/investigation
#
# Aucun outil maison : chaque étape est une commande que vous pouvez
# retaper à la main. Modifiez une ligne du tableau, ajoutez-en, retirez-en.


# ══════════════════════════════════════════════════════════════════════
#  MÉMO — MONTER L'IMAGE
# ══════════════════════════════════════════════════════════════════════
#
# L'image est un fichier ; losetup en fait un disque, mount en fait un
# dossier. La protection tient au -r de losetup : rien en dessous ne
# peut écrire sur la pièce.
#
#     losetup -P -r -f --show image.dd        -> /dev/loop0
#     lsblk -f /dev/loop0                     l'arbre, les types, les UUID
#
# La colonne FSTYPE de lsblk dit quel cas s'applique :
#
#   ext4, xfs, btrfs — un système de fichiers, montez-le
#     mount -o ro /dev/loop0p2 /mnt/investigation
#     PERIPH=/dev/loop0p2
#
#   LVM2_member — un réservoir qui contient plusieurs volumes
#     vgscan ; vgchange -ay nom_du_groupe ; lvs
#     mount -o ro /dev/nom_du_groupe/root /mnt/investigation
#     PERIPH=/dev/nom_du_groupe/root
#
#   crypto_LUKS — chiffré, il faut la phrase de passe
#     cryptsetup open --readonly /dev/loop0p3 clair    -> /dev/mapper/clair
#     mount -o ro /dev/mapper/clair /mnt/investigation
#     PERIPH=/dev/mapper/clair
#
#   LUKS puis LVM — Ubuntu ou Fedora chiffrée : on déchiffre, du LVM apparaît
#     cryptsetup open --readonly /dev/loop0p3 clair
#     vgchange -ay nom_du_groupe
#     mount -o ro /dev/nom_du_groupe/root /mnt/investigation
#     PERIPH=/dev/nom_du_groupe/root
#
# Défaire, dans l'ordre inverse :
#     umount /mnt/investigation
#     vgchange -an nom_du_groupe          (si LVM)
#     cryptsetup close clair              (si LUKS)
#     losetup -d /dev/loop0
#
# Si losetup -P ne crée pas les p1, p2… (conteneur, noyau sans scan) :
#     fdisk -l image.dd                   colonne Start, en secteurs
#     losetup -r -o $((2048*512)) -f --show image.dd
#
# Options de mount utiles : ro (rien n'est écrit), noatime (lire ne
# change pas les dates), noexec, nodev (rien ne s'exécute depuis la pièce).
#
# Un /home ou un /var sur une AUTRE partition ne se collecte pas au
# passage : fls ne lit que le système de fichiers de PERIPH. Montez-le et
# refaites une passe, avec son propre PERIPH et son propre PC/SALLE.


# ══════════════════════════════════════════════════════════════════════
#  CE QUI EST ÉCRIT — ANALYSE/OS/SALLE/PREFIX/
# ══════════════════════════════════════════════════════════════════════
#
#     SYSTEME/      os-release, hostname, localtime, timezone, fstab,
#                   PREFIX_fs.txt
#     PAQUETS/      la base brute, plus la liste des paquets
#     COMPTES/      passwd, group, PREFIX_droits.tar.gz (shadow, sudoers…)
#                   puis, par compte : dates, sessions, échecs, artefacts,
#                   profils applicatifs, inventaire
#     CONNEXIONS/   wtmp, btmp et lastlog copiés ; wtmp et btmp relus
#     RESEAU/       PREFIX_reseau.tar.gz — profils NetworkManager,
#                   netplan, ifcfg, systemd, plus hosts, ssh et les baux
#     PERSISTANCE/  PREFIX_persistance.tar.gz (cron, systemd, rc.local,
#                   profile.d, ld.so.preload, modules)
#     JOURNAUX/     var_log.tar.gz — avec le journal systemd, à lire par :
#                   journalctl -D <extrait>/var/log/journal -o short-iso
#     TIMELINE/     PREFIX_body.mactime, PREFIX_mactime.csv
#     MACHINES/     les disques virtuels trouvés sur le poste
#     PHOTOREC/     recup_*/ — l'étape en affiche le poids total
#
# Le journal, le rapport, l'état de reprise et le journal photorec
# restent là où le script est lancé.
#
# Le nom du fichier dit comment il a été écrit :
#     cp -a    une pièce emportée telle quelle, avec ses dates, sous son
#              nom d'origine — os-release, fstab, wtmp
#     tar      un lot de pièces, dont certaines peuvent manquer —
#              PREFIX_droits.tar.gz ; -v affiche ce qui est entré
#     tee      la sortie d'un outil, sous le PREFIX — PREFIX_fs.txt
# cp -aL (avec L) quand c'est le contenu qu'on veut : /etc/os-release
# est un lien sur la plupart des distributions. cp -a sans L pour
# /etc/localtime : là, c'est le lien lui-même qui nomme le fuseau.


# ══════════════════════════════════════════════════════════════════════
#  1 · VARIABLES
# ══════════════════════════════════════════════════════════════════════

MONTAGE=""                     # À FOURNIR : --set MONTAGE=/mnt/investigation
PERIPH=""                      # À FOURNIR : --set PERIPH=/dev/loop0p2

PC="PC07"                      # nom du poste
SALLE="D32"                    # salle
PROJET="PRJ"                   # projet
OS="LINUX"                     # système du poste

ANALYSE="$PWD/ANALYSE"         # racine de sortie
TZ_MACTIME="UTC"               # fuseau de la timeline

TK_OPERATEUR="${SUDO_USER:-${USER:-inconnu}}"

# Ce qu'il faut sur TOUTE image. Ce qui ne sert que sur certaines — rpm,
# dpkg-query, tune2fs — s'ajoute plus bas, dans la branche qui le choisit :
# une Ubuntu qui examine une Fedora est prévenue au démarrage qu'il lui
# manque rpm, et une Fedora devant une Debian qu'il lui manque dpkg.
# Sur Ubuntu 24.04, trois paquets suffisent :
#     apt install rpm sleuthkit testdisk
TK_REQUIS=(findmnt blkid last lastb tar find fls ils mactime photorec)


# ══════════════════════════════════════════════════════════════════════
#  2 · CHEMINS ET CONTRÔLES
# ══════════════════════════════════════════════════════════════════════

calculer_variables() {
    TK_PREFIX="${PC}_${SALLE}_${PROJET}_${OS}"
    DEST="$ANALYSE/$OS/$SALLE/$TK_PREFIX"

    TK_SUJET="$PC · $SALLE · $PROJET · $OS"
    TK_DETAILS=("montage=$MONTAGE" "source=$PERIPH" "sortie=$DEST" "fuseau=$TZ_MACTIME")

    DIR_SYSTEME="$DEST/SYSTEME"
    DIR_PAQUETS="$DEST/PAQUETS"
    DIR_COMPTES="$DEST/COMPTES"
    DIR_CONNEXIONS="$DEST/CONNEXIONS"
    DIR_RESEAU="$DEST/RESEAU"
    DIR_PERSISTANCE="$DEST/PERSISTANCE"
    DIR_JOURNAUX="$DEST/JOURNAUX"
    DIR_TIMELINE="$DEST/TIMELINE"
    DIR_MACHINES="$DEST/MACHINES"
    DIR_PHOTOREC="$DEST/PHOTOREC"

    DIR_LOGS="$PWD"     # journal, rapport, état : là où le script est lancé
}

verifier() {
    # Les chemins sont posés entre apostrophes dans les commandes : une
    # apostrophe dans l'un d'eux redécouperait la ligne entière.
    case "$DEST$DIR_LOGS$MONTAGE$PERIPH$TZ_MACTIME" in
        *\'*) erreur "apostrophe dans un chemin ou un nom : impossible ici."
             info "renommez le dossier de sortie, ou lancez le script d'ailleurs."
             return 1 ;;
    esac

    [[ -n "$MONTAGE" ]] || { erreur "MONTAGE n'est pas renseigné."
        info "donnez-le : --set MONTAGE=/mnt/investigation   (le mémo est en tête de ce fichier)"
        return 1; }

    [[ -n "$PERIPH" ]] || { erreur "PERIPH n'est pas renseigné : fls et ils lisent le périphérique, pas le montage."
        info "donnez-le : --set PERIPH=/dev/loop0p2"
        return 1; }

    local opts
    opts="$(findmnt -no OPTIONS "$MONTAGE" 2>/dev/null)" || { erreur "rien n'est monté sur $MONTAGE"
        info "montez l'image d'abord (mémo en tête), ou prenez exemples/dd-linux.conf : il lit l'image sans la monter."
        return 1; }

    # Une pièce montée en écriture s'abîme au premier accès.
    [[ ",$opts," == *",ro,"* ]] || { erreur "$MONTAGE n'est pas monté en lecture seule : $opts"
        info "remontez-le : umount '$MONTAGE' puis mount -o ro,noatime,noexec,nodev …"
        return 1; }

    [[ -b "$PERIPH" ]] || { erreur "pas un périphérique bloc : $PERIPH"
        info "il faut être root, et donner la partition, pas un fichier."
        return 1; }

    # readlink -f : en LVM, findmnt dit /dev/mapper/vg-root et vous
    # /dev/vg/root — le même périphérique sous deux noms. Et il suffixe le
    # sous-volume en btrfs : /dev/mapper/clair[/root]. On coupe au crochet.
    local src; src="$(findmnt -no SOURCE "$MONTAGE" 2>/dev/null)"; src="${src%%[*}"
    [[ "$(readlink -f "$src")" == "$(readlink -f "$PERIPH")" ]] \
        || attention "$PERIPH n'est pas la source de $MONTAGE : donnez la partition, pas le disque entier."

    # Sans /etc, ce n'est pas une racine de système : le montage vise le
    # niveau supérieur d'un btrfs, ou un sous-dossier. Rien à collecter.
    [[ -d "$MONTAGE/etc" ]] || { erreur "pas de $MONTAGE/etc : ce n'est pas la racine d'un système."
        info "en btrfs, montez le sous-volume : mount -o ro,subvol=root … ; sinon vérifiez le chemin."
        return 1; }

    return 0
}


# ══════════════════════════════════════════════════════════════════════
#  3 · COMMANDES
# ══════════════════════════════════════════════════════════════════════
#
# Aucune étape ne porte « continu » : rouge veut dire qu'il s'est passé
# quelque chose. Ce qui varie selon la machine est réglé une fois, en
# tête de la fonction ; le plan (-l) montre la commande retenue.
#
# À savoir :
#   · wtmp et btmp sont copiés à l'étape 10 puis relus dans la copie ;
#     les étapes 11 à 13 et 20 à 21 en dépendent — avec -o, gardez la 10.
#   · les artefacts d'un compte sont coupés en deux étapes : les pièces
#     de triage d'abord (quelques Ko, instantané), puis .cache, .local,
#     les profils de navigateur, snap et flatpak — mesuré à 300 Mo et
#     une minute pour UN compte. En triage, passez la seconde (touche p).
#   · les tar de LOTS portent --ignore-failed-read : une pièce absente du
#     lot est signalée au journal, pas une erreur — toutes les
#     distributions n'ont pas /etc/cron.d ni /etc/sudoers.d. Celui de
#     /var/log ne le porte pas : un /var/log absent est une anomalie.
#   · photorec rend toujours 0, et un numéro de partition inconnu le fait
#     ne rien faire, en silence : « partition_1 » ou « p1 » rendent 0 sans
#     récupérer un fichier. PERIPH étant déjà un système de fichiers, il
#     n'y a pas de partition à choisir — c'est figé à partition_none.
#     Lisez quand même la liste en fin d'étape, et son journal.

definir_commandes() {

    # ── Réglé une fois, selon la machine examinée ─────────────────────

    # /etc/timezone n'existe que sur Debian et dérivés
    local fuseau="cp -a '$MONTAGE/etc/localtime' '$DIR_SYSTEME/'"
    [[ -f "$MONTAGE/etc/timezone" ]] && fuseau="$fuseau && cp -aL '$MONTAGE/etc/timezone' '$DIR_SYSTEME/'"

    # La base est copiée d'abord. rpm est ensuite interrogé DANS LA COPIE,
    # et pas par principe : sa base sqlite s'ouvre en écriture même pour
    # une simple question, et il échoue sur un montage en lecture seule.
    # dpkg-query, lui, n'écrit rien — vérifié — et lit le montage : copier
    # /var/lib/dpkg entier, ce serait 20 000 fichiers d'info/ pour rien.
    # cp -aT et non cp -a : sans le T, rejouer l'étape recopierait la base
    # DANS la copie déjà faite, et on aurait PREFIX_rpmdb/rpm/.
    # dpkg testé en premier : une Debian où rpm est installé comme outil a
    # un /var/lib/rpm vide, qui ne doit pas l'emporter sur sa vraie base.
    local paquets="echo 'ni base dpkg ni base RPM sur cette image' >&2; false"
    if [[ -d "$MONTAGE/var/lib/dpkg" ]]; then
        TK_REQUIS+=(dpkg-query)
        paquets="cp -a '$MONTAGE/var/lib/dpkg/status' '$DIR_PAQUETS/${TK_PREFIX}_dpkg_status.txt' && dpkg-query --admindir='$MONTAGE/var/lib/dpkg' -l"
    elif [[ -d "$MONTAGE/var/lib/rpm" ]]; then
        TK_REQUIS+=(rpm)
        local rpmdb="$DIR_PAQUETS/${TK_PREFIX}_rpmdb"
        # -L : depuis Fedora 36, /var/lib/rpm est un LIEN vers
        # /usr/lib/sysimage/rpm. Sans -L on copie le lien, qui pend une
        # fois sorti de l'image, et rpm ne trouve aucune base.
        paquets="cp -aLT '$MONTAGE/var/lib/rpm' '$rpmdb' && rpm --dbpath '$rpmdb' -qa"
    fi

    # lastlog a disparu de Fedora 40 et de Debian trixie (remplacé par
    # lastlog2) ; wtmp.1 et btmp.1 sont les mois précédents, quand
    # logrotate est passé. On prend ce qui est là, sans échouer sur le reste.
    local f connexions=""
    for f in wtmp wtmp.1 btmp btmp.1 lastlog; do
        [[ -f "$MONTAGE/var/log/$f" ]] && connexions="${connexions:+$connexions }'$MONTAGE/var/log/$f'"
    done

    # tune2fs et la Sleuth Kit (fls, ils) ne lisent que l'ext — et voient
    # alors les fichiers supprimés. Ailleurs (xfs sur RedHat, btrfs sur
    # Fedora) : blkid pour l'identité, et find parcourt le montage en
    # écrivant chaque fichier au format que mactime lit —
    # MD5|nom|inode|mode|uid|gid|taille|atime|mtime|ctime|crtime.
    # La date de création vaut -1 : find ne la connaît pas partout, et
    # pour 0 mactime écrirait une ligne vide « Xxx Xxx 00 0000 » par fichier.
    local fsinfo corps
    if [[ "$(findmnt -no FSTYPE "$MONTAGE" 2>/dev/null)" == ext* ]]; then
        TK_REQUIS+=(tune2fs)
        fsinfo="tune2fs -l '$PERIPH'"
        corps="( fls -r -p -m / '$PERIPH' && ils -m '$PERIPH' )"
    else
        fsinfo="blkid -p '$PERIPH'"
        corps="( cd '$MONTAGE' && find . -printf '0|/%P|%i|%M|%U|%G|%s|%A@|%T@|%C@|-1\\n' )"
    fi

TK_COMMANDES=(

# ── le système ────────────────────────────────────────────────────────
"Ce qui est monté|false,log|findmnt -no SOURCE,TARGET,FSTYPE,OPTIONS '$MONTAGE'"
"Distribution (/etc/os-release)|true|cp -aL '$MONTAGE/etc/os-release' '$DIR_SYSTEME/' && cat '$DIR_SYSTEME/os-release'"
"Nom de la machine (/etc/hostname)|true|cp -aL '$MONTAGE/etc/hostname' '$DIR_SYSTEME/' && cat '$DIR_SYSTEME/hostname'"
"Fuseau horaire|true|$fuseau && ls -l '$DIR_SYSTEME'"
"Montages déclarés (/etc/fstab)|true|cp -aL '$MONTAGE/etc/fstab' '$DIR_SYSTEME/' && cat '$DIR_SYSTEME/fstab'"
"Système de fichiers|true|$fsinfo | tee '$DIR_SYSTEME/${TK_PREFIX}_fs.txt' | tail -n 20"
"Paquets installés|true|$paquets | tee '$DIR_PAQUETS/${TK_PREFIX}_paquets.txt' | tail -n 10"

# ── les comptes du système ────────────────────────────────────────────
"Comptes déclarés (/etc/passwd, /etc/group)|true|cp -aL '$MONTAGE/etc/passwd' '$MONTAGE/etc/group' '$DIR_COMPTES/' && cat '$DIR_COMPTES/passwd'"
"Droits (shadow, sudoers, login.defs)|true|tar --ignore-failed-read -czvf '$DIR_COMPTES/${TK_PREFIX}_droits.tar.gz' -C '$MONTAGE' etc/shadow etc/gshadow etc/passwd- etc/shadow- etc/group- etc/gshadow- etc/sudoers etc/sudoers.d etc/login.defs etc/security etc/pam.d"

# ── qui s'est connecté ────────────────────────────────────────────────
"Copie des fichiers de connexion|true|cp -a $connexions '$DIR_CONNEXIONS/' && ls -l '$DIR_CONNEXIONS'"
"Démarrages de la machine|true|last -F -f '$DIR_CONNEXIONS/wtmp' reboot | tee '$DIR_CONNEXIONS/${TK_PREFIX}_reboots.txt'"
"Sessions ouvertes|true|last -F -f '$DIR_CONNEXIONS/wtmp' | tee '$DIR_CONNEXIONS/${TK_PREFIX}_sessions.txt' | tail -n 15"
"Échecs d'authentification|true|lastb -F -f '$DIR_CONNEXIONS/btmp' | tee '$DIR_CONNEXIONS/${TK_PREFIX}_echecs.txt' | tail -n 15"

# ── le réseau et les journaux ─────────────────────────────────────────
"Réseau : profils, hosts, ssh, baux|true|tar --ignore-failed-read -czvf '$DIR_RESEAU/${TK_PREFIX}_reseau.tar.gz' -C '$MONTAGE' etc/NetworkManager etc/sysconfig/network-scripts etc/netplan etc/systemd/network etc/network etc/hosts etc/hosts.allow etc/hosts.deny etc/resolv.conf etc/systemd/resolved.conf etc/nsswitch.conf etc/ssh var/lib/NetworkManager var/lib/dhcp | tail -n 20"
"Archive de /var/log|true|tar -czf '$DIR_JOURNAUX/${TK_PREFIX}_var_log.tar.gz' -C '$MONTAGE' var/log && ls -lh '$DIR_JOURNAUX'"

# ── ce qui se relance tout seul ───────────────────────────────────────
"Persistance (cron, systemd, rc.local, profile.d…)|true|tar --ignore-failed-read -czvf '$DIR_PERSISTANCE/${TK_PREFIX}_persistance.tar.gz' -C '$MONTAGE' etc/crontab etc/cron.d etc/cron.hourly etc/cron.daily etc/cron.weekly etc/cron.monthly var/spool/cron etc/systemd/system usr/lib/systemd/system etc/rc.local etc/init.d etc/profile etc/profile.d etc/bash.bashrc etc/environment etc/ld.so.preload etc/ld.so.conf.d etc/modules-load.d etc/modprobe.d etc/xdg/autostart etc/rc.d etc/bashrc etc/anacrontab var/spool/anacron var/spool/at etc/udev/rules.d etc/update-motd.d etc/apt/apt.conf.d etc/NetworkManager/dispatcher.d etc/systemd/user usr/local/bin usr/local/sbin | tail -n 20"

# ── la timeline ───────────────────────────────────────────────────────
"Corps de la timeline|true|$corps | tee '$DIR_TIMELINE/${TK_PREFIX}_body.mactime' | tail -n 10"
"Timeline mactime|true|mactime -b '$DIR_TIMELINE/${TK_PREFIX}_body.mactime' -d -z '$TZ_MACTIME' | tee '$DIR_TIMELINE/${TK_PREFIX}_mactime.csv' | tail -n 10"

# ── chaque compte ─────────────────────────────────────────────────────
"Dates du dossier de {{compte_libelle}}|true|stat '{{compte}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_stat.txt'"
"Sessions de {{compte_libelle}}|true|last -F -f '$DIR_CONNEXIONS/wtmp' '{{compte_libelle}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_sessions.txt'"
"Échecs d'authentification de {{compte_libelle}}|true|lastb -F -f '$DIR_CONNEXIONS/btmp' '{{compte_libelle}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_echecs.txt'"
"Artefacts de {{compte_libelle}}|true|tar --ignore-failed-read -czvf '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_artefacts.tar.gz' -C '{{compte}}' .bash_history .zsh_history .python_history .mysql_history .psql_history .lesshst .wget-hsts .bashrc .profile .bash_logout .viminfo .gitconfig .ssh .gnupg .aws .kube .docker .config .pki .xsession-errors"
"Caches et profils applicatifs de {{compte_libelle}}|true|tar --ignore-failed-read -czf '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_profils.tar.gz' -C '{{compte}}' .local .cache .mozilla .thunderbird snap .var/app && du -h '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_profils.tar.gz'"
"Inventaire du profil de {{compte_libelle}}|true|ls -lRa '{{compte}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_inventaire.txt' | tail -n 10"

# ── le reste ──────────────────────────────────────────────────────────
"Disques virtuels sur le poste|true|find '$MONTAGE' -iname '*.vmdk' -o -iname '*.vdi' -o -iname '*.ova' -o -iname '*.qcow2' | tee '$DIR_MACHINES/${TK_PREFIX}_disques_virtuels.txt'"
"photorec sur l'espace libre|true|photorec /log /logname '$DIR_LOGS/${TK_PREFIX}_photorec.log' /d '$DIR_PHOTOREC/recup_' /cmd '$PERIPH' partition_none,fileopt,everything,enable,freespace,search && du -sh '$DIR_PHOTOREC'"
)


# ══════════════════════════════════════════════════════════════════════
#  4 · LISTES
# ══════════════════════════════════════════════════════════════════════
#
# Une seule liste ici : compte. Elle vient du /etc/passwd de l'image, par la
# fonction de la section 5.
#   valeur      le dossier personnel, préfixé du montage
#   étiquette   le login, qui sert aussi de nom de fichier
#   rejoue      6 étapes (19 à 24), une fois par compte
#
# Un compte dont le dossier n'existe pas sur l'image ne rend rien, et
# c'est voulu : il n'y a rien à collecter.

TK_LISTES=("compte|lister_comptes")
}


# ══════════════════════════════════════════════════════════════════════
#  5 · FONCTIONS
# ══════════════════════════════════════════════════════════════════════
#
# La seule du fichier. Lister les dossiers de /home paraissait plus
# simple, mais c'est faux : un compte « administrateur » dont le dossier
# s'appelle /home/admin donnait un fichier de sessions vide et vert, un
# compte hors de /home était oublié, et lost+found passait pour un
# compte. Le /etc/passwd de l'image, lui, dit la vérité.
#
# Une ligne par compte : le dossier en valeur, le login en étiquette.
lister_comptes() {
    local nom home
    [[ -r "$MONTAGE/etc/passwd" ]] || { printf 'lister_comptes : pas de %s/etc/passwd\n' "$MONTAGE" >&2; return 0; }
    while IFS=: read -r nom _ _ _ _ home _; do
        (( INTERROMPU )) && return 130
        # /?* écarte les comptes logés à la racine — sans quoi on
        # collecterait le système entier au nom d'un compte de service.
        # Le login est assaini : il vient de la pièce, et il sert de nom
        # de fichier. Sans effet sur un login normal.
        [[ "$home" == /?* && -d "$MONTAGE$home" ]] && emettre "$MONTAGE$home" "${nom//[!A-Za-z0-9._-]/_}"
    done < "$MONTAGE/etc/passwd"
    return 0
}
