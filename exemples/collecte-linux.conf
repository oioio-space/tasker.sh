# Collecte de triage sur un poste Linux DÉJÀ MONTÉ en lecture seule.
# Le portage d'un script de collecte écrit d'une traite, découpé en étapes
# que l'on valide une par une. Que des commandes simples : cat, ls, cp,
# tar, find, last. Aucune fonction à écrire, aucun sed, aucun awk.
#
# Deux choses vous appartiennent et le script ne les décide pas :
#
#   losetup -P -r -f /images/PC07.dd          # -> /dev/loop0
#   mkdir -p /mnt/investigation
#   mount -o ro /dev/loop0p2 /mnt/investigation
#   sudo ./tasker.sh -c exemples/collecte-linux.conf \
#        --set MONTAGE=/mnt/investigation --set PERIPH=/dev/loop0p2
#   umount /mnt/investigation                 # quand vous avez fini
#   losetup -d /dev/loop0
#
#   MONTAGE  la racine du système, montée en ro : tout se lit là
#   PERIPH   le périphérique de CETTE partition, pas le disque entier :
#            tune2fs, fls et ils lisent un système de fichiers, pas
#            une table de partitions
#
# Si votre losetup -P ne crée pas les nœuds p1, p2… (conteneurs, noyaux
# sans partition scanning), exposez la partition directement :
#   fdisk -l /images/PC07.dd                  # la colonne Start, en secteurs
#   losetup -r -o $((2048*512)) -f --show /images/PC07.dd
#
# Tout ce qui est écrit va dans ANALYSE/OS/SALLE/PREFIX/ :
#     SYSTEME/     os-release, localtime, timezone, fstab, PREFIX_tune2fs.txt
#     PAQUETS/     dpkg ou rpm, selon la distribution
#     CONNEXIONS/  wtmp et btmp copiés, puis relus par last et lastb
#     RESEAU/      les profils NetworkManager, ifcfg-*, netplan, systemd
#     JOURNAUX/    var_log.tar.gz
#     TIMELINE/    PREFIX.fls  PREFIX.ils  PREFIX_body.mactime  PREFIX_mactime.csv
#     COMPTES/     par compte : dates, sessions, artefacts, inventaire
#     MACHINES/    les disques virtuels trouvés sur le poste
#     PHOTOREC/    recup_*/
# puis, à côté du dossier : PREFIX.tar.gz, l'archive de tout ce qui précède.
# Le journal, le rapport, l'état de reprise et le journal photorec vont
# dans le répertoire d'où le script est lancé, préfixés par PREFIX.

# --- variables ---------------------------------------------------------
MONTAGE=""                     # À FOURNIR : --set MONTAGE=/mnt/investigation
PERIPH=""                      # À FOURNIR : --set PERIPH=/dev/loop0p2
PC="PC07"                      # nom du poste
SALLE="D32"                    # salle
PROJET="PRJ"                   # projet
OS="LINUX"                     # système du poste
ANALYSE="$PWD/ANALYSE"         # racine de sortie
TZ_MACTIME="UTC"               # fuseau de la timeline
TK_OPERATEUR="${SUDO_USER:-${USER:-inconnu}}"
TK_REQUIS=(findmnt tune2fs last lastb tar find fls ils mactime testdisk photorec)

# --- chemins et contrôles ----------------------------------------------
calculer_variables() {
    TK_PREFIX="${PC}_${SALLE}_${PROJET}_${OS}"
    DEST="$ANALYSE/$OS/$SALLE/$TK_PREFIX"
    TK_SUJET="$PC · $SALLE · $PROJET · $OS"
    TK_DETAILS=("montage=$MONTAGE" "source=$PERIPH" "sortie=$DEST" "fuseau=$TZ_MACTIME")
    DIR_SYSTEME="$DEST/SYSTEME"
    DIR_PAQUETS="$DEST/PAQUETS"
    DIR_CONNEXIONS="$DEST/CONNEXIONS"
    DIR_RESEAU="$DEST/RESEAU"
    DIR_JOURNAUX="$DEST/JOURNAUX"
    DIR_TIMELINE="$DEST/TIMELINE"
    DIR_COMPTES="$DEST/COMPTES"
    DIR_MACHINES="$DEST/MACHINES"
    DIR_PHOTOREC="$DEST/PHOTOREC"
    DIR_LOGS="$PWD"             # journal, rapport, état : là où le script est lancé
}

verifier() {
    [[ -n "$MONTAGE" ]] || { erreur "MONTAGE n'est pas renseigné : le script ne choisit pas où l'image est montée."
        info "donnez-le : --set MONTAGE=/mnt/investigation   (la séquence complète est en tête de ce fichier)"
        return 1; }
    [[ -n "$PERIPH" ]] || { erreur "PERIPH n'est pas renseigné : tune2fs, fls et ils lisent le périphérique, pas le montage."
        info "donnez-le : --set PERIPH=/dev/loop0p2"
        return 1; }
    local opts
    opts="$(findmnt -no OPTIONS "$MONTAGE" 2>/dev/null)" || { erreur "rien n'est monté sur $MONTAGE"
        info "montez l'image d'abord, ou prenez exemples/dd-linux.conf : il lit l'image sans la monter."
        return 1; }
    # Une pièce à conviction montée en écriture s'abîme au premier accès.
    [[ ",$opts," == *",ro,"* ]] || { erreur "$MONTAGE n'est pas monté en lecture seule : $opts"
        info "remontez-le : umount '$MONTAGE' puis mount -o ro,noatime,noexec,nodev …"
        return 1; }
    [[ -b "$PERIPH" ]] || { erreur "pas un périphérique bloc : $PERIPH"
        info "il faut être root, et donner la partition, pas un fichier."
        return 1; }
    # Le disque entier passerait -b, et ferait échouer tune2fs, fls et ils
    # sans dire pourquoi : autant le dire ici.
    [[ "$(findmnt -no SOURCE "$MONTAGE" 2>/dev/null)" == "$PERIPH" ]] \
        || attention "$PERIPH n'est pas la source de $MONTAGE : donnez la partition, pas le disque entier."
    [[ -d "$MONTAGE/etc" ]] || attention "pas de $MONTAGE/etc : la racine du système est-elle bien là ?"
    return 0
}

# --- commandes ---------------------------------------------------------
# [[partition]] : le numéro affiché par testdisk. Demandé à la dernière étape.
#
# Aucune étape ne porte « continu » : ici, rouge veut dire qu'il s'est
# passé quelque chose. Ce qui varie d'une distribution à l'autre a été
# réglé plus haut, une fois, au lieu d'être toléré vingt fois.
#
# wtmp et btmp sont d'abord COPIÉS (étape 7), puis relus dans la copie :
# on analyse exactement ce qu'on a préservé. Les étapes 8 à 10 et 18 à 19
# en dépendent — avec -o ou --from, gardez l'étape 7 dans le lot.
#
# La dernière étape archive tout le dossier de sortie, à côté de lui et
# non dedans — sinon le tar s'avalerait lui-même. Le script d'origine
# effaçait le dossier ensuite ; ce n'est PAS porté. Ici une étape se
# rejoue, se reprend avec -r et se relit dans le journal : effacer la
# collecte à la fin enlèverait tout ça pour gagner de la place. Si vous
# ne voulez livrer que l'archive, effacez le dossier vous-même, une fois
# l'archive vérifiée.
#
# photorec rend TOUJOURS 0, et si le numéro de partition n'existe pas il
# retombe silencieusement sur le disque entier. Son code de sortie ne dit
# donc rien : ce sont les fichiers listés en fin d'étape et le journal
# photorec qu'il faut lire pour savoir ce qui a été récupéré.
#
# Deux façons d'écrire, et le nom du fichier dit laquelle :
#   cp -a  la pièce est emportée telle quelle, avec ses dates, et garde
#          son nom d'origine — os-release, fstab, localtime, wtmp ;
#   tee    c'est la sortie d'un outil, elle prend le PREFIX — PREFIX.fls,
#          PREFIX_tune2fs.txt, PREFIX_paquets.txt.
# Lire un fichier au lieu de le copier perdrait ses dates, et ce sont
# elles qu'on vient chercher. Ce qui est copié est ensuite affiché depuis
# la COPIE : ce qu'on voit à l'écran est ce qui a été écrit.
definir_commandes() {
    # Ce qui change d'une distribution à l'autre se choisit ICI, en bash
    # ordinaire, avant le tableau. L'étape reste la même et reste verte :
    # « il n'y a pas de base RPM sur cette image » n'est pas une erreur,
    # et une étape rouge qui apparaît à chaque fois finit par être ignorée.
    # cp -a d'abord, lecture ensuite : on emporte la pièce, pas seulement
    # ce qu'elle disait. cp -a sur /etc/localtime copie le LIEN, pas sa
    # cible — et c'est la cible affichée qui nomme le fuseau.
    local fuseau="cp -a '$MONTAGE/etc/localtime' '$DIR_SYSTEME/'"
    [[ -f "$MONTAGE/etc/timezone" ]] && fuseau="$fuseau && cp -a '$MONTAGE/etc/timezone' '$DIR_SYSTEME/'"

    # La base brute est copiée avant d'être interrogée : si dpkg-query ou
    # rpm manque sur le poste d'analyse — un poste RedHat devant une image
    # Debian — la pièce est quand même emportée, et l'étape le signale.
    local paquets="echo 'ni base dpkg ni base RPM sur cette image'"
    [[ -d "$MONTAGE/var/lib/dpkg" ]] && paquets="cp -a '$MONTAGE/var/lib/dpkg/status' '$DIR_PAQUETS/${TK_PREFIX}_dpkg_status.txt' && dpkg-query --admindir='$MONTAGE/var/lib/dpkg' -l"
    [[ -d "$MONTAGE/var/lib/rpm"  ]] && paquets="cp -a '$MONTAGE/var/lib/rpm' '$DIR_PAQUETS/${TK_PREFIX}_rpmdb' && rpm --dbpath '$MONTAGE/var/lib/rpm' -qa"
TK_COMMANDES=(
"Ce qui est monté|false,log|findmnt -no SOURCE,TARGET,FSTYPE,OPTIONS '$MONTAGE'"
"Distribution (/etc/os-release)|true|cp -a '$MONTAGE/etc/os-release' '$DIR_SYSTEME/' && cat '$DIR_SYSTEME/os-release'"
"Fuseau horaire|true|$fuseau && ls -l '$DIR_SYSTEME'"
"Montages déclarés (/etc/fstab)|true|cp -a '$MONTAGE/etc/fstab' '$DIR_SYSTEME/' && cat '$DIR_SYSTEME/fstab'"
"Dates du système de fichiers|true|tune2fs -l '$PERIPH' | tee '$DIR_SYSTEME/${TK_PREFIX}_tune2fs.txt' | tail -n 20"
"Paquets installés|true|$paquets | tee '$DIR_PAQUETS/${TK_PREFIX}_paquets.txt' | tail -n 10"
"Copie de wtmp et btmp|true|cp -a '$MONTAGE/var/log/wtmp' '$MONTAGE/var/log/btmp' '$DIR_CONNEXIONS/' && ls -l '$DIR_CONNEXIONS'"
"Démarrages de la machine|true|last -F -f '$DIR_CONNEXIONS/wtmp' reboot | tee '$DIR_CONNEXIONS/${TK_PREFIX}_reboots.txt'"
"Sessions ouvertes|true|last -F -f '$DIR_CONNEXIONS/wtmp' | tee '$DIR_CONNEXIONS/${TK_PREFIX}_sessions.txt' | tail -n 15"
"Échecs d'authentification|true|lastb -F -f '$DIR_CONNEXIONS/btmp' | tee '$DIR_CONNEXIONS/${TK_PREFIX}_echecs.txt' | tail -n 15"
"Profil réseau {{profil_libelle}}|true|cp -a --parents '{{profil}}' '$DIR_RESEAU/' && cat '$DIR_RESEAU/{{profil}}'"
"Archive de /var/log|true|tar -czf '$DIR_JOURNAUX/${TK_PREFIX}_var_log.tar.gz' -C '$MONTAGE' var/log && ls -lh '$DIR_JOURNAUX'"
"fls sur $PERIPH|true|fls -r -p -m / '$PERIPH' | tee '$DIR_TIMELINE/${TK_PREFIX}.fls' | tail -n 10"
"ils sur $PERIPH|true|ils -m '$PERIPH' | tee '$DIR_TIMELINE/${TK_PREFIX}.ils' | tail -n 10"
"Corps de la timeline (fls + ils)|true|cat '$DIR_TIMELINE/${TK_PREFIX}.fls' '$DIR_TIMELINE/${TK_PREFIX}.ils' | tee '$DIR_TIMELINE/${TK_PREFIX}_body.mactime' | tail -n 10"
"Timeline mactime|true|mactime -b '$DIR_TIMELINE/${TK_PREFIX}_body.mactime' -d -z '$TZ_MACTIME' | tee '$DIR_TIMELINE/${TK_PREFIX}_mactime.csv' | tail -n 10"
"Dates du dossier de {{compte_libelle}}|true|stat '{{compte}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_stat.txt'"
"Sessions de {{compte_libelle}}|true|last -F -f '$DIR_CONNEXIONS/wtmp' '{{compte_libelle}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_sessions.txt'"
"Échecs d'authentification de {{compte_libelle}}|true|lastb -F -f '$DIR_CONNEXIONS/btmp' '{{compte_libelle}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_echecs.txt'"
"Artefacts de {{compte_libelle}}|true|tar --ignore-failed-read -czvf '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_artefacts.tar.gz' -C '{{compte}}' .bash_history .bashrc .profile .viminfo .ssh .config .local .mozilla .cache .pki"
"Inventaire du profil de {{compte_libelle}}|true|ls -lRa '{{compte}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_inventaire.txt' | tail -n 10"
"Disques virtuels sur le poste|true|find '$MONTAGE' -iname '*.vmdk' -o -iname '*.vdi' -o -iname '*.ova' -o -iname '*.qcow2' | tee '$DIR_MACHINES/${TK_PREFIX}_disques_virtuels.txt'"
"Partitions pour photorec (testdisk)|false,log|testdisk /list '$PERIPH'"
"photorec sur la partition [[partition]]|true|photorec /log /logname '$DIR_LOGS/${TK_PREFIX}_photorec.log' /d '$DIR_PHOTOREC/recup_' /cmd '$PERIPH' '[[partition]]',fileopt,everything,enable,freespace,search && ls -lR '$DIR_PHOTOREC' | tail -n 20"
"Archive de toute la collecte|true|tar -czf '$ANALYSE/$OS/$SALLE/${TK_PREFIX}.tar.gz' -C '$ANALYSE/$OS/$SALLE' '$TK_PREFIX' && ls -lh '$ANALYSE/$OS/$SALLE/${TK_PREFIX}.tar.gz'"
)
# Les fichiers écrits par les étapes de compte portent le nom du compte
# TEL QUEL : « o'brien_stat.txt », « jean dupont_stat.txt ». C'est voulu —
# un nom rectifié ne désigne plus le compte — mais si vous rebouclez
# dessus, mettez vos variables entre guillemets.
#
# --ignore-failed-read sur le tar des artefacts : sans lui, le premier
# fichier absent — et il en manque toujours — ferait échouer l'archive
# entière et les autres n'y entreraient pas. -v liste ce qui est entré ;
# ce qui manque est signalé sur la sortie d'erreur, donc dans le journal.

# --parents sur le cp des profils : le chemin d'origine est recréé sous
#          RESEAU/. Deux distributions peuvent poser le même nom dans deux
#          de ces dossiers ; à plat, le second écraserait le premier sans
#          rien dire et l'étape resterait verte. Là, chacun garde sa place,
#          et on lit du même coup d'où il venait.
#
# profil : les cinq endroits où les distributions rangent la configuration
#          réseau. Aucune ne les utilise tous ; un dossier absent n'est pas
#          une erreur, il ne produit simplement rien. « ifcfg-* » est un
#          joker de shell, pas une expression régulière.
# compte : /home/* et /root, pris ensemble — root est un compte comme un
#          autre pour la collecte, mais il n'habite pas /home. Les cinq
#          étapes qui suivent la liste sont rejouées pour chacun.
TK_LISTES=(
"profil|lister_fichiers '$MONTAGE/etc/NetworkManager/system-connections'
        lister_fichiers '$MONTAGE/etc/sysconfig/network-scripts' 'ifcfg-*'
        lister_fichiers '$MONTAGE/etc/netplan'
        lister_fichiers '$MONTAGE/etc/systemd/network'
        lister_si_present '$MONTAGE/etc/network/interfaces'"
"compte|lister_dossiers '$MONTAGE/home'
        lister_si_present '$MONTAGE/root'"
)
}
