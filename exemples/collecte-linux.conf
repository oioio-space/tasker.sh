# ══════════════════════════════════════════════════════════════════════
#  COLLECTE DE TRIAGE — poste Linux, image DÉJÀ MONTÉE en lecture seule
# ══════════════════════════════════════════════════════════════════════
#
# Le portage d'un script de collecte écrit d'une traite, découpé en
# étapes qu'on valide une par une. Que des commandes ordinaires : cat,
# cp, ls, tar, find, last. Ni fonction, ni sed, ni awk.
#
#     sudo ./tasker.sh -c exemples/collecte-linux.conf \
#          --set MONTAGE=/mnt/investigation --set PERIPH=/dev/loop0p2
#
# Deux choses vous appartiennent, le script ne les décide pas :
#
#     MONTAGE   la racine du système montée en ro : tout se lit là
#     PERIPH    le périphérique du système de fichiers, PAS le disque
#               entier. C'est ce qu'affiche findmnt -no SOURCE $MONTAGE


# ══════════════════════════════════════════════════════════════════════
#  MÉMO — MONTER L'IMAGE
# ══════════════════════════════════════════════════════════════════════
#
# Le principe : l'image est un fichier ; losetup en fait un disque, mount
# en fait un dossier. La protection vient d'un seul endroit — le -r de
# losetup. Une fois posé, rien en dessous ne peut écrire sur la pièce.
#
# D'abord, savoir ce qu'on a :
#
#     losetup -P -r -f --show image.dd        -> /dev/loop0
#     lsblk -f /dev/loop0                     l'arbre, les types, les UUID
#
# Ce que lsblk affiche en TYPE dit quel cas s'applique :
#
#     ext4, xfs, btrfs   cas 1 — un système de fichiers, montez-le
#     LVM2_member        cas 2 — du LVM par-dessus
#     crypto_LUKS        cas 3 — du chiffrement par-dessus
#
# ── cas 1 · disque simple ─────────────────────────────────────────────
#
#     mount -o ro /dev/loop0p2 /mnt/investigation
#     PERIPH=/dev/loop0p2
#
# ── cas 2 · LVM ───────────────────────────────────────────────────────
# La partition n'est pas un système de fichiers, c'est un réservoir qui
# en contient plusieurs. Il faut l'ouvrir pour voir dedans.
#
#     vgscan                             quels groupes de volumes ?
#     vgchange -ay nom_du_groupe         les rendre visibles
#     lvs                                quels volumes dedans ?
#     mount -o ro /dev/nom_du_groupe/root /mnt/investigation
#     PERIPH=/dev/nom_du_groupe/root
#
# ── cas 3 · LUKS ──────────────────────────────────────────────────────
# La partition est chiffrée. Il faut la phrase de passe ou la clé.
#
#     cryptsetup open --readonly /dev/loop0p3 clair   -> /dev/mapper/clair
#     mount -o ro /dev/mapper/clair /mnt/investigation
#     PERIPH=/dev/mapper/clair
#
# ── cas 4 · LUKS puis LVM ─────────────────────────────────────────────
# Le cas courant d'une Ubuntu ou d'une Fedora chiffrée : on déchiffre,
# et c'est du LVM qui apparaît. On enchaîne les cas 3 et 2.
#
#     cryptsetup open --readonly /dev/loop0p3 clair
#     vgchange -ay nom_du_groupe
#     mount -o ro /dev/nom_du_groupe/root /mnt/investigation
#     PERIPH=/dev/nom_du_groupe/root
#
# ── défaire, dans l'ordre inverse ─────────────────────────────────────
#
#     umount /mnt/investigation
#     vgchange -an nom_du_groupe          (si LVM)
#     cryptsetup close clair              (si LUKS)
#     losetup -d /dev/loop0
#
# ── si losetup -P ne crée pas les p1, p2… ─────────────────────────────
# Cela arrive en conteneur, ou avec un noyau qui ne parcourt pas les
# tables de partitions. On expose alors la partition directement, en
# donnant son décalage.
#
#     fdisk -l image.dd                   la colonne Start, en secteurs
#     losetup -r -o $((2048*512)) -f --show image.dd
#
# ── mémo des options de mount ─────────────────────────────────────────
#
#     ro         rien ne peut être écrit — la protection de la pièce
#     noatime    la lire ne change pas ses dates de dernier accès
#     noexec     rien ne s'exécute depuis un disque suspect
#     nodev      les fichiers spéciaux du disque ne valent rien ici
#
#     mount -o ro,noatime,noexec,nodev /dev/loop0p2 /mnt/investigation


# ══════════════════════════════════════════════════════════════════════
#  CE QUI EST ÉCRIT
# ══════════════════════════════════════════════════════════════════════
#
# Tout va dans ANALYSE/OS/SALLE/PREFIX/ :
#
#     SYSTEME/     os-release, localtime, timezone, fstab, PREFIX_fs.txt
#     PAQUETS/     la base brute, plus la liste des paquets
#     CONNEXIONS/  wtmp et btmp copiés, puis relus par last et lastb
#     RESEAU/      les profils, rangés sous leur chemin d'origine
#     JOURNAUX/    var_log.tar.gz
#     TIMELINE/    PREFIX.fls  .ils  _body.mactime  _mactime.csv
#     COMPTES/     par compte : dates, sessions, artefacts, inventaire
#     MACHINES/    les disques virtuels trouvés sur le poste
#     PHOTOREC/    recup_*/
#
# Puis, à CÔTÉ du dossier : PREFIX.tar.gz, l'archive de tout cela.
# Le journal, le rapport et l'état de reprise restent dans le répertoire
# d'où le script est lancé.
#
# Deux façons d'écrire, et le nom du fichier dit laquelle :
#
#     cp -a   la pièce est emportée telle quelle, avec ses dates, et
#             garde son nom d'origine — os-release, fstab, wtmp
#     tee     c'est la sortie d'un outil, elle prend le PREFIX —
#             PREFIX.fls, PREFIX_fs.txt, PREFIX_paquets.txt
#
# Lire un fichier au lieu de le copier perdrait ses dates, et ce sont
# elles qu'on vient chercher. Ce qui est copié est ensuite affiché
# depuis la COPIE : ce qu'on voit à l'écran est ce qui a été écrit.


# ══════════════════════════════════════════════════════════════════════
#  1 · VARIABLES
# ══════════════════════════════════════════════════════════════════════

MONTAGE=""                     # À FOURNIR : --set MONTAGE=/mnt/investigation
PERIPH=""                      # À FOURNIR : --set PERIPH=/dev/loop0p2

PC="PC07"                      # nom du poste
SALLE="D32"                    # salle
PROJET="PRJ"                   # projet
OS="LINUX"                     # système du poste

ANALYSE="$PWD/ANALYSE"         # racine de sortie
TZ_MACTIME="UTC"               # fuseau de la timeline

TK_OPERATEUR="${SUDO_USER:-${USER:-inconnu}}"

# findmnt, last et lastb viennent d'util-linux : ils sont sur tous les
# Linux. tune2fs n'est PAS dans la liste — il ne lit que l'ext, et une
# image RedHat est en xfs ; l'outil est choisi plus bas, selon le cas.
TK_REQUIS=(findmnt blkid last lastb tar find fls ils mactime testdisk photorec)


# ══════════════════════════════════════════════════════════════════════
#  2 · CHEMINS ET CONTRÔLES
# ══════════════════════════════════════════════════════════════════════

calculer_variables() {
    TK_PREFIX="${PC}_${SALLE}_${PROJET}_${OS}"
    DEST="$ANALYSE/$OS/$SALLE/$TK_PREFIX"

    TK_SUJET="$PC · $SALLE · $PROJET · $OS"
    TK_DETAILS=("montage=$MONTAGE" "source=$PERIPH" "sortie=$DEST" "fuseau=$TZ_MACTIME")

    DIR_SYSTEME="$DEST/SYSTEME"
    DIR_PAQUETS="$DEST/PAQUETS"
    DIR_CONNEXIONS="$DEST/CONNEXIONS"
    DIR_RESEAU="$DEST/RESEAU"
    DIR_JOURNAUX="$DEST/JOURNAUX"
    DIR_TIMELINE="$DEST/TIMELINE"
    DIR_COMPTES="$DEST/COMPTES"
    DIR_MACHINES="$DEST/MACHINES"
    DIR_PHOTOREC="$DEST/PHOTOREC"

    DIR_LOGS="$PWD"     # journal, rapport, état : là où le script est lancé
}

verifier() {
    [[ -n "$MONTAGE" ]] || { erreur "MONTAGE n'est pas renseigné : le script ne choisit pas où l'image est montée."
        info "donnez-le : --set MONTAGE=/mnt/investigation   (le mémo est en tête de ce fichier)"
        return 1; }

    [[ -n "$PERIPH" ]] || { erreur "PERIPH n'est pas renseigné : fls et ils lisent le périphérique, pas le montage."
        info "donnez-le : --set PERIPH=/dev/loop0p2"
        return 1; }

    local opts
    opts="$(findmnt -no OPTIONS "$MONTAGE" 2>/dev/null)" || { erreur "rien n'est monté sur $MONTAGE"
        info "montez l'image d'abord, ou prenez exemples/dd-linux.conf : il lit l'image sans la monter."
        return 1; }

    # Une pièce à conviction montée en écriture s'abîme au premier accès.
    [[ ",$opts," == *",ro,"* ]] || { erreur "$MONTAGE n'est pas monté en lecture seule : $opts"
        info "remontez-le : umount '$MONTAGE' puis mount -o ro,noatime,noexec,nodev …"
        return 1; }

    [[ -b "$PERIPH" ]] || { erreur "pas un périphérique bloc : $PERIPH"
        info "il faut être root, et donner la partition, pas un fichier."
        return 1; }

    # Le disque entier passerait -b, et ferait échouer fls et ils sans
    # dire pourquoi : autant le dire ici.
    [[ "$(findmnt -no SOURCE "$MONTAGE" 2>/dev/null)" == "$PERIPH" ]] \
        || attention "$PERIPH n'est pas la source de $MONTAGE : donnez la partition, pas le disque entier."

    [[ -d "$MONTAGE/etc" ]] || attention "pas de $MONTAGE/etc : la racine du système est-elle bien là ?"

    return 0
}


# ══════════════════════════════════════════════════════════════════════
#  3 · COMMANDES
# ══════════════════════════════════════════════════════════════════════
#
# Aucune étape ne porte « continu » : ici, rouge veut dire qu'il s'est
# passé quelque chose. Ce qui varie d'une distribution à l'autre est
# réglé une fois, en tête de la fonction, au lieu d'être toléré partout.
#
# wtmp et btmp sont COPIÉS à l'étape 7, puis relus dans la copie : on
# analyse exactement ce qu'on a préservé. Les étapes 8 à 10 et 18 à 19
# en dépendent — avec -o ou --from, gardez l'étape 7 dans le lot.
#
# photorec rend TOUJOURS 0, et si le numéro de partition n'existe pas il
# retombe en silence sur le disque entier. Son code de sortie ne dit donc
# rien : lisez les fichiers listés en fin d'étape, et son journal.
#
# La dernière étape archive tout le dossier, à côté de lui et non dedans
# — sinon le tar s'avalerait lui-même. Le script d'origine effaçait le
# dossier ensuite ; ce n'est PAS porté. Ici une étape se rejoue, se
# reprend avec -r et se relit dans le journal : effacer la collecte
# enlèverait tout cela pour gagner de la place. À faire vous-même, une
# fois l'archive vérifiée.

definir_commandes() {

    # ── ce qui dépend de la machine examinée, choisi une fois ─────────
    # L'étape reste la même et reste verte : « pas de base RPM sur cette
    # image » n'est pas une erreur. Une étape rouge qui revient à chaque
    # exécution finit par être ignorée, et c'est ainsi qu'on rate la
    # vraie. Le plan (-l) montre d'avance la commande retenue.

    # Fuseau : /etc/localtime est partout, /etc/timezone seulement sur
    # Debian. cp -a copie le LIEN, pas sa cible — et c'est la cible
    # affichée qui nomme le fuseau.
    local fuseau="cp -a '$MONTAGE/etc/localtime' '$DIR_SYSTEME/'"
    [[ -f "$MONTAGE/etc/timezone" ]] && fuseau="$fuseau && cp -a '$MONTAGE/etc/timezone' '$DIR_SYSTEME/'"

    # Paquets : la base brute est emportée AVANT d'être interrogée. Si
    # dpkg-query ou rpm manque sur le poste d'analyse — un poste RedHat
    # devant une image Debian — la pièce est quand même sauvée, et
    # l'étape signale l'échec.
    local paquets="echo 'ni base dpkg ni base RPM sur cette image'"
    [[ -d "$MONTAGE/var/lib/dpkg" ]] && paquets="cp -a '$MONTAGE/var/lib/dpkg/status' '$DIR_PAQUETS/${TK_PREFIX}_dpkg_status.txt' && dpkg-query --admindir='$MONTAGE/var/lib/dpkg' -l"
    [[ -d "$MONTAGE/var/lib/rpm"  ]] && paquets="cp -a '$MONTAGE/var/lib/rpm' '$DIR_PAQUETS/${TK_PREFIX}_rpmdb' && rpm --dbpath '$MONTAGE/var/lib/rpm' -qa"

    # Système de fichiers : tune2fs ne lit que l'ext et échoue sur tout
    # le reste — or RedHat est en xfs. blkid, lui, marche partout et sort
    # toujours en 0 : c'est le repli. Seul l'ext note sa date de
    # création ; xfs et btrfs ne la gardent pas.
    local fsinfo="blkid -p '$PERIPH'"
    case "$(findmnt -no FSTYPE "$MONTAGE" 2>/dev/null)" in
        ext2|ext3|ext4) fsinfo="tune2fs -l '$PERIPH'" ;;
        xfs)            fsinfo="xfs_info '$MONTAGE'" ;;
        btrfs)          fsinfo="btrfs filesystem show '$PERIPH'" ;;
    esac

TK_COMMANDES=(

# ── le système ────────────────────────────────────────────────────────
"Ce qui est monté|false,log|findmnt -no SOURCE,TARGET,FSTYPE,OPTIONS '$MONTAGE'"
"Distribution (/etc/os-release)|true|cp -a '$MONTAGE/etc/os-release' '$DIR_SYSTEME/' && cat '$DIR_SYSTEME/os-release'"
"Fuseau horaire|true|$fuseau && ls -l '$DIR_SYSTEME'"
"Montages déclarés (/etc/fstab)|true|cp -a '$MONTAGE/etc/fstab' '$DIR_SYSTEME/' && cat '$DIR_SYSTEME/fstab'"
"Système de fichiers|true|$fsinfo | tee '$DIR_SYSTEME/${TK_PREFIX}_fs.txt' | tail -n 20"
"Paquets installés|true|$paquets | tee '$DIR_PAQUETS/${TK_PREFIX}_paquets.txt' | tail -n 10"

# ── qui s'est connecté ────────────────────────────────────────────────
"Copie de wtmp et btmp|true|cp -a '$MONTAGE/var/log/wtmp' '$MONTAGE/var/log/btmp' '$DIR_CONNEXIONS/' && ls -l '$DIR_CONNEXIONS'"
"Démarrages de la machine|true|last -F -f '$DIR_CONNEXIONS/wtmp' reboot | tee '$DIR_CONNEXIONS/${TK_PREFIX}_reboots.txt'"
"Sessions ouvertes|true|last -F -f '$DIR_CONNEXIONS/wtmp' | tee '$DIR_CONNEXIONS/${TK_PREFIX}_sessions.txt' | tail -n 15"
"Échecs d'authentification|true|lastb -F -f '$DIR_CONNEXIONS/btmp' | tee '$DIR_CONNEXIONS/${TK_PREFIX}_echecs.txt' | tail -n 15"

# ── le réseau et les journaux ─────────────────────────────────────────
"Profil réseau {{profil_libelle}}|true|cp -a --parents '{{profil}}' '$DIR_RESEAU/' && cat '$DIR_RESEAU/{{profil}}'"
"Archive de /var/log|true|tar -czf '$DIR_JOURNAUX/${TK_PREFIX}_var_log.tar.gz' -C '$MONTAGE' var/log && ls -lh '$DIR_JOURNAUX'"

# ── la timeline ───────────────────────────────────────────────────────
"fls sur $PERIPH|true|fls -r -p -m / '$PERIPH' | tee '$DIR_TIMELINE/${TK_PREFIX}.fls' | tail -n 10"
"ils sur $PERIPH|true|ils -m '$PERIPH' | tee '$DIR_TIMELINE/${TK_PREFIX}.ils' | tail -n 10"
"Corps de la timeline (fls + ils)|true|cat '$DIR_TIMELINE/${TK_PREFIX}.fls' '$DIR_TIMELINE/${TK_PREFIX}.ils' | tee '$DIR_TIMELINE/${TK_PREFIX}_body.mactime' | tail -n 10"
"Timeline mactime|true|mactime -b '$DIR_TIMELINE/${TK_PREFIX}_body.mactime' -d -z '$TZ_MACTIME' | tee '$DIR_TIMELINE/${TK_PREFIX}_mactime.csv' | tail -n 10"

# ── chaque compte ─────────────────────────────────────────────────────
"Dates du dossier de {{compte_libelle}}|true|stat '{{compte}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_stat.txt'"
"Sessions de {{compte_libelle}}|true|last -F -f '$DIR_CONNEXIONS/wtmp' '{{compte_libelle}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_sessions.txt'"
"Échecs d'authentification de {{compte_libelle}}|true|lastb -F -f '$DIR_CONNEXIONS/btmp' '{{compte_libelle}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_echecs.txt'"
"Artefacts de {{compte_libelle}}|true|tar --ignore-failed-read -czvf '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_artefacts.tar.gz' -C '{{compte}}' .bash_history .bashrc .profile .viminfo .ssh .config .local .mozilla .cache .pki"
"Inventaire du profil de {{compte_libelle}}|true|ls -lRa '{{compte}}' | tee '$DIR_COMPTES/${TK_PREFIX}_{{compte_libelle}}_inventaire.txt' | tail -n 10"

# ── le reste ──────────────────────────────────────────────────────────
"Disques virtuels sur le poste|true|find '$MONTAGE' -iname '*.vmdk' -o -iname '*.vdi' -o -iname '*.ova' -o -iname '*.qcow2' | tee '$DIR_MACHINES/${TK_PREFIX}_disques_virtuels.txt'"
"Partitions pour photorec (testdisk)|false,log|testdisk /list '$PERIPH'"
"photorec sur la partition [[partition]]|true|photorec /log /logname '$DIR_LOGS/${TK_PREFIX}_photorec.log' /d '$DIR_PHOTOREC/recup_' /cmd '$PERIPH' '[[partition]]',fileopt,everything,enable,freespace,search && ls -lR '$DIR_PHOTOREC' | tail -n 20"
"Archive de toute la collecte|true|tar -czf '$ANALYSE/$OS/$SALLE/${TK_PREFIX}.tar.gz' -C '$ANALYSE/$OS/$SALLE' '$TK_PREFIX' && ls -lh '$ANALYSE/$OS/$SALLE/${TK_PREFIX}.tar.gz'"
)


# ══════════════════════════════════════════════════════════════════════
#  4 · LISTES
# ══════════════════════════════════════════════════════════════════════
#
# Une liste rend des lignes « valeur<TAB>étiquette ». Chaque étape qui
# contient {{nom}} est alors rejouée une fois par valeur : {{nom}} y
# devient la valeur, {{nom_libelle}} l'étiquette.
#
# ── profil ────────────────────────────────────────────────────────────
#   ce qu'elle fait : regarde les cinq dossiers où les distributions
#                     rangent leur configuration réseau, et rend les
#                     fichiers qui s'y trouvent
#   valeur          : le chemin complet du fichier
#   étiquette       : son nom seul, pour l'afficher
#   ce qui suit     : 1 étape, rejouée une fois par profil trouvé
#
#   Aucune distribution n'utilise les cinq. Un dossier absent n'est pas
#   une erreur : il ne rend simplement rien. « ifcfg-* » est un joker de
#   shell, pas une expression régulière.
#
#   --parents au moment de la copie : le chemin d'origine est recréé
#   sous RESEAU/. Deux dossiers peuvent contenir le même nom de fichier ;
#   à plat, le second écraserait le premier sans un mot, et l'étape
#   resterait verte. Là, chacun garde sa place — et on lit d'où il vient.
#
# ── compte ────────────────────────────────────────────────────────────
#   ce qu'elle fait : les dossiers de /home, plus /root
#   valeur          : le chemin du profil
#   étiquette       : le nom du compte, qui sert aussi de nom de fichier
#   ce qui suit     : 5 étapes, rejouées une fois par compte
#
#   root est un compte comme un autre pour la collecte, mais il n'habite
#   pas /home : d'où les deux appels.
#
#   Les fichiers écrits portent le nom du compte TEL QUEL —
#   « o'brien_stat.txt », « jean dupont_stat.txt ». C'est voulu : un nom
#   rectifié ne désigne plus le compte. Si vous rebouclez dessus, mettez
#   vos variables entre guillemets.

TK_LISTES=(

"profil|lister_fichiers '$MONTAGE/etc/NetworkManager/system-connections'
        lister_fichiers '$MONTAGE/etc/sysconfig/network-scripts' 'ifcfg-*'
        lister_fichiers '$MONTAGE/etc/netplan'
        lister_fichiers '$MONTAGE/etc/systemd/network'
        lister_si_present '$MONTAGE/etc/network/interfaces'"

"compte|lister_dossiers '$MONTAGE/home'
        lister_si_present '$MONTAGE/root'"
)
}
